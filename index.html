<script>
/* =========================================================
   案例 01 的可运行示范 · 测井曲线智能分层
   ---------------------------------------------------------
   纯前端，无依赖：
     合成井曲线（已知真实界面）→ 最优分段（DP + 惩罚项）→ 容差匹配打分
   对外只暴露 window.WelllogLayerDemo(root, ctx)
   ========================================================= */

(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  var N = 640;          // 采样点数
  var STEP = 0.125;     // m / 点
  var TOP = 2000;       // 井段顶深 m
  var MINSEG = 8;       // 最小层厚 1 m = 8 点
  var TOL = 8;          // 容差 ±1 m = 8 点

  /* 浅色配色：所有色值与 tokens.css 保持一致 */
  var C = {
    curve: '#2f3a3f',
    grid: '#eeeae0',
    gridSoft: '#f4f1e9',
    text: '#79828a',
    textDim: '#9ba3a9',
    truth: '#2f7d6b',
    det: '#b26a39',
    hover: '#b9c0c5',
    thin: '#f0dfa4'
  };

  var LITH = [
    { max: 45, name: '砂岩', color: '#c99a56' },
    { max: 70, name: '粉砂岩', color: '#a3855f' },
    { max: 100, name: '泥岩', color: '#6b89a3' },
    { max: 999, name: '富有机质泥岩', color: '#8878ab' }
  ];
  function lithOf(v) {
    for (var i = 0; i < LITH.length; i++) if (v < LITH[i].max) return LITH[i];
    return LITH[3];
  }

  /* ---------- 随机数 ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- 合成井 ---------- */
  function makeWell(seed, nLayers, noise) {
    var rnd = mulberry32(seed);
    var gauss = function () {
      var u = 0, v = 0;
      while (u === 0) u = rnd();
      while (v === 0) v = rnd();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };

    var raw = [], i, sum = 0;
    for (i = 0; i < nLayers; i++) { var w = 0.7 + rnd() * 1.5; raw.push(w); sum += w; }
    var th = [], remaining = N;
    for (i = 0; i < nLayers; i++) {
      var v;
      if (i === nLayers - 1) { v = remaining; }
      else {
        var maxAllowed = remaining - 30 * (nLayers - i - 1);
        v = Math.round(raw[i] / sum * N);
        v = Math.min(Math.max(v, 30), Math.max(30, maxAllowed));
      }
      th.push(v); remaining -= v;
    }

    // 埋一个 0.6—0.9 m 的薄层：厚度从邻层借，层数不变
    if (nLayers >= 7 && rnd() < 0.8) {
      var j0 = 1 + Math.floor(rnd() * (nLayers - 3));
      for (var t2 = 0; t2 < nLayers; t2++) {
        var c2 = 1 + ((j0 - 1 + t2) % (nLayers - 2));
        if (th[c2] >= 46) {
          var thin = 5 + Math.floor(rnd() * 3);
          var move = th[c2] - thin;
          th[c2] = thin;
          th[c2 - 1] += move;
          break;
        }
      }
    }

    var valsByLayer = [], prev = 60 + rnd() * 40;
    for (i = 0; i < nLayers; i++) {
      var vv = 24 + rnd() * 106;
      if (Math.abs(vv - prev) < 10) vv = prev + (vv > prev ? 1 : -1) * (10 + rnd() * 8);
      vv = Math.min(136, Math.max(20, vv));
      valsByLayer.push(vv); prev = vv;
    }

    var cut = [], acc = 0;
    for (i = 0; i < nLayers; i++) { cut.push(acc); acc += th[i]; }
    var step = new Float64Array(N);
    for (i = 0; i < N; i++) {
      var li = 0;
      for (var j = 0; j < nLayers; j++) if (i >= cut[j]) li = j;
      step[i] = valsByLayer[li];
    }

    // 仪器响应：3 点核平滑，制造约 2 个采样点的过渡带
    var sm = new Float64Array(N);
    for (i = 0; i < N; i++) {
      var s = 0, wsum = 0;
      for (var q = -1; q <= 1; q++) {
        var idx = i + q;
        if (idx >= 0 && idx < N) { s += step[idx] * (2 - Math.abs(q)); wsum += (2 - Math.abs(q)); }
      }
      sm[i] = s / wsum;
    }
    step = sm;

    var x = new Float64Array(N);
    for (i = 0; i < N; i++) x[i] = step[i] + gauss() * noise;

    return { x: x, cut: cut.slice(1), layers: th, vals: valsByLayer };
  }

  /* ---------- 最优分段（动态规划 + 惩罚项）---------- */
  function segment(x, beta) {
    var n = x.length, i, t, s;
    var cs = new Float64Array(n + 1), cs2 = new Float64Array(n + 1);
    for (i = 0; i < n; i++) { cs[i + 1] = cs[i] + x[i]; cs2[i + 1] = cs2[i] + x[i] * x[i]; }
    function cost(a, b) {
      var m = b - a; if (m <= 0) return 0;
      var sum = cs[b] - cs[a];
      return cs2[b] - cs2[a] - sum * sum / m;
    }
    var F = new Float64Array(n + 1), prev = new Int32Array(n + 1);
    F[0] = 0; prev[0] = 0;
    for (t = 1; t <= n; t++) {
      var best = cost(0, t), bp = 0;
      if (t > MINSEG * 2) {
        for (s = MINSEG; s <= t - MINSEG; s++) {
          var v = F[s] + cost(s, t) + beta;
          if (v < best) { best = v; bp = s; }
        }
      }
      F[t] = best; prev[t] = bp;
    }
    var bounds = [], cur = n;
    while (cur > 0) {
      var p = prev[cur];
      if (p <= 0) break;
      bounds.push(p); cur = p;
    }
    return bounds.reverse();
  }

  /* ---------- 稳健噪声估计 ---------- */
  function sigmaHat(x) {
    var d = [], i;
    for (i = 1; i < x.length; i++) d.push(Math.abs(x[i] - x[i - 1]));
    d.sort(function (a, b) { return a - b; });
    var med = d[Math.floor(d.length / 2)];
    return Math.max(0.8, med / 0.6745 / Math.SQRT2);
  }

  /* ---------- 容差匹配打分 ---------- */
  function score(det, tru) {
    var used = tru.map(function () { return false; });
    var tp = 0, errSum = 0;
    det.forEach(function (d) {
      var bi = -1, bd = 1e9;
      tru.forEach(function (t, i) {
        if (!used[i]) { var df = Math.abs(t - d); if (df < bd) { bd = df; bi = i; } }
      });
      if (bi >= 0 && bd <= TOL) { used[bi] = true; tp++; errSum += bd; }
    });
    var fp = det.length - tp;
    var fn = tru.filter(function (t, i) { return !used[i]; }).length;
    var p = tp + fp ? tp / (tp + fp) : 0;
    var r = tp + fn ? tp / (tp + fn) : 0;
    var f1 = (p + r) ? 2 * p * r / (p + r) : 0;
    return { tp: tp, fp: fp, fn: fn, p: p, r: r, f1: f1, mae: tp ? errSum * STEP / tp : 0, matchedTrue: used };
  }

  function mean(a, b, x) { var s = 0; for (var i = a; i < b; i++) s += x[i]; return s / (b - a); }

  /* =========================================================
     主渲染
     ========================================================= */
  function WelllogLayerDemo(root) {
    var state = { seed: 20261022, layers: 10, noise: 8, beta: 3, showTrue: true };
    var well, sig, det, sc, fitData = [];

    root.innerHTML = '' +
      '<div class="demo">' +
      '<div class="demo-head">' +
      '<div><span class="kicker">INTERACTIVE · 最优分段</span>' +
      '<h3 style="margin-top:8px">把一条 GR 曲线切成地质单元</h3>' +
      '<p>这是一口程序合成的井：真实层界面已知，所以能给算法精确打分。拖动 β 改变"每增加一个界面要付出的代价"，看它怎么从过分割滑到欠分割。</p></div>' +
      '<button class="btn primary" data-act="new">换一口井 ↻</button>' +
      '</div>' +

      '<div class="demo-ctl">' +
      '<div class="ctl"><label>噪声 σ</label><input type="range" min="2" max="24" step="1" value="8" id="c-noise"><span class="val" id="v-noise">8</span></div>' +
      '<div class="ctl"><label>真实层数</label><input type="range" min="5" max="14" step="1" value="10" id="c-layers"><span class="val" id="v-layers">10</span></div>' +
      '<div class="ctl"><label>惩罚 β</label><input type="range" min="0.2" max="12" step="0.1" value="3" id="c-beta"><span class="val" id="v-beta">3.0</span></div>' +
      '<label class="ctl tog on" id="c-true"><i></i>显示真实界面</label>' +
      '</div>' +

      '<div class="demo-grid">' +
      '<div class="track-wrap"><div class="track">' +
      '<svg id="logsvg" viewBox="0 0 462 620" role="img" aria-label="GR 曲线与分层结果"></svg>' +
      '<div class="readout" id="readout">把鼠标移到曲线上</div></div>' +
      '<div class="track-legend">' +
      '<span><i style="background:' + C.curve + '"></i>GR 曲线</span>' +
      '<span><i style="background:' + C.det + '"></i>检出界面</span>' +
      '<span><i class="dash"></i>真实界面</span>' +
      '<span><i style="background:' + C.thin + ';height:8px;width:11px;border-radius:2px"></i>薄层告警</span>' +
      '</div></div>' +

      '<div class="demo-side">' +
      '<div class="metrics" id="metrics"></div>' +
      '<div class="verdict" id="verdict"></div>' +
      '<div class="fitbox"><div class="ft"><span>F1 vs 惩罚系数 β</span><span id="fit-note"></span></div>' +
      '<svg id="fitsvg" viewBox="0 0 360 120"></svg></div>' +
      '<div class="hintbox"><b>过分割 / 欠分割：</b>β 太小，噪声波动会被当成层界面；β 太大，真实薄层会被合并。' +
      '<b>可用区间通常在曲线平台段的左端</b>——这也是实践里"先调 β 再调规则"的原因。</div>' +
      '</div></div>' +

      '<div class="ltable-wrap"><table class="ltable" id="ltable"></table></div>' +
      '</div>';

    var svg = root.querySelector('#logsvg');
    var fitSvg = root.querySelector('#fitsvg');
    var readout = root.querySelector('#readout');
    var metricsEl = root.querySelector('#metrics');
    var verdictEl = root.querySelector('#verdict');
    var tableEl = root.querySelector('#ltable');

    /* ------- 几何 ------- */
    var W = 462, H = 620, padL = 58, padT = 24, padB = 26, pw = 330, ph = H - padT - padB, GRMAX = 150;
    function X(v) { return padL + Math.min(v, GRMAX) / GRMAX * pw; }
    function Y(i) { return padT + i / (N - 1) * ph; }
    function depthAt(i) { return (TOP + i * STEP).toFixed(2); }

    /* ------- 真实层区间（含厚度），用于薄层告警 ------- */
    function trueLayers() {
      var edges = [0].concat(well.cut).concat([N]);
      var out = [];
      for (var i = 0; i < edges.length - 1; i++) {
        out.push({ a: edges[i], b: edges[i + 1], thick: (edges[i + 1] - edges[i]) * STEP });
      }
      return out;
    }

    /* ------- 计算 ------- */
    function recompute(full) {
      well = makeWell(state.seed, state.layers, state.noise);
      sig = sigmaHat(well.x);
      det = segment(well.x, state.beta * sig * sig * Math.log(N));
      sc = score(det, well.cut);
      if (full) buildFit();
    }

    function betaOf(k) { return k * sig * sig * Math.log(N); }

    function buildFit() {
      fitData = [];
      for (var k = 0.2; k <= 12.01; k += 0.4) {
        var b = segment(well.x, betaOf(k));
        fitData.push({ k: k, f1: score(b, well.cut).f1 });
      }
    }

    /* ------- 主图 ------- */
    function drawTrack() {
      var s = '';
      s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>';

      for (var d = 0; d <= 80; d += 10) {
        var yy = padT + d / 80 * ph;
        s += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (padL + pw) + '" y2="' + yy + '" stroke="' + C.grid + '"/>';
        s += '<text x="' + (padL - 10) + '" y="' + (yy + 3.5) + '" fill="' + C.textDim + '" font-size="9" font-family="monospace" text-anchor="end">' + (TOP + d) + '</text>';
      }
      [0, 50, 100, 150].forEach(function (v) {
        var xx = X(v);
        s += '<line x1="' + xx + '" y1="' + padT + '" x2="' + xx + '" y2="' + (padT + ph) + '" stroke="' + C.gridSoft + '"/>';
        s += '<text x="' + xx + '" y="' + (padT + ph + 15) + '" fill="' + C.textDim + '" font-size="9" font-family="monospace" text-anchor="middle">' + v + '</text>';
      });
      s += '<text x="' + (padL + pw) + '" y="' + (padT + ph + 15) + '" fill="' + C.textDim + '" font-size="8.5" font-family="monospace" text-anchor="end">API</text>';
      s += '<text x="6" y="' + (padT - 10) + '" fill="' + C.text + '" font-size="9" font-family="monospace">深度(m)</text>';

      // 检出层段：底色 + 左色条
      var starts = [0].concat(det).concat([N]);
      for (var i = 0; i < starts.length - 1; i++) {
        var a = starts[i], b = starts[i + 1];
        var m = mean(a, b, well.x), li = lithOf(m);
        var y0 = Y(a), y1 = Y(b - 1) + (Y(1) - Y(0));
        s += '<rect x="' + padL + '" y="' + y0.toFixed(1) + '" width="' + pw + '" height="' + Math.max(1, y1 - y0).toFixed(1) + '" fill="' + li.color + '" opacity="0.10"/>';
        s += '<rect x="45" y="' + y0.toFixed(1) + '" width="3" height="' + Math.max(1, y1 - y0).toFixed(1) + '" rx="1.5" fill="' + li.color + '" opacity="0.75"/>';
      }

      // 薄层告警：真实厚度 < 1 m 且未被检出
      trueLayers().forEach(function (L) {
        if (L.thick >= 1.0) return;
        var hit = det.some(function (dpos) { return dpos > L.a - TOL && dpos < L.b + TOL + 1 && dpos > L.a; });
        if (hit) return;
        var y0 = Y(L.a), y1 = Y(L.b - 1) + (Y(1) - Y(0));
        s += '<rect x="' + padL + '" y="' + y0.toFixed(1) + '" width="' + pw + '" height="' + Math.max(2, y1 - y0).toFixed(1) + '" fill="' + C.thin + '" opacity=".55"/>';
        s += '<line x1="' + (padL + pw + 6) + '" y1="' + ((y0 + y1) / 2) + '" x2="' + (padL + pw + 16) + '" y2="' + ((y0 + y1) / 2) + '" stroke="' + C.det + '" stroke-width="1"/>';
        s += '<text x="' + (padL + pw + 19) + '" y="' + ((y0 + y1) / 2 + 3) + '" fill="' + C.det + '" font-size="8" font-family="monospace">' + L.thick.toFixed(1) + 'm 漏检</text>';
      });

      // 真实界面
      if (state.showTrue) {
        well.cut.forEach(function (c) {
          s += '<line x1="' + padL + '" y1="' + Y(c) + '" x2="' + (padL + pw) + '" y2="' + Y(c) + '" stroke="' + C.truth + '" stroke-width="1" stroke-dasharray="4 5" opacity="0.65"/>';
          s += '<text x="' + (padL + pw - 2) + '" y="' + (Y(c) - 3) + '" fill="' + C.truth + '" font-size="8" font-family="monospace" text-anchor="end" opacity="0.8">真 ' + (TOP + c * STEP).toFixed(1) + '</text>';
        });
      }

      // 曲线
      var path = '';
      for (var p = 0; p < N; p++) path += (p ? 'L' : 'M') + X(well.x[p]).toFixed(1) + ' ' + Y(p).toFixed(1);
      s += '<path d="' + path + '" fill="none" stroke="' + C.curve + '" stroke-width="1.15" stroke-linejoin="round"/>';

      // 检出界面
      det.forEach(function (c) {
        var yy = Y(c);
        s += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (padL + pw + 4) + '" y2="' + yy + '" stroke="' + C.det + '" stroke-width="1.2"/>';
        s += '<path d="M' + (padL + pw + 4) + ' ' + yy + ' l5 -3 l0 6 z" fill="' + C.det + '"/>';
        s += '<text x="' + (padL + pw + 12) + '" y="' + (yy + 3) + '" fill="' + C.det + '" font-size="8.5" font-family="monospace">' + (TOP + c * STEP).toFixed(1) + '</text>';
      });

      s += '<line id="xh" x1="' + padL + '" y1="0" x2="' + (padL + pw) + '" y2="0" stroke="' + C.hover + '" stroke-dasharray="3 3" style="display:none"/>';
      s += '<rect id="hit" x="' + padL + '" y="' + padT + '" width="' + pw + '" height="' + ph + '" fill="transparent" style="cursor:crosshair"/>';

      svg.innerHTML = s;

      var hit = svg.querySelector('#hit'), xh = svg.querySelector('#xh');
      hit.addEventListener('mousemove', function (e) {
        var r = svg.getBoundingClientRect();
        var sy = (e.clientY - r.top) / r.height * H;
        var idx = Math.round((sy - padT) / ph * (N - 1));
        if (idx < 0 || idx >= N) { xh.style.display = 'none'; return; }
        var yy = Y(idx);
        xh.setAttribute('y1', yy); xh.setAttribute('y2', yy);
        xh.style.display = '';
        var s2 = [0].concat(det).concat([N]), li2 = 0;
        for (var q = 0; q < s2.length - 1; q++) if (idx >= s2[q] && idx < s2[q + 1]) li2 = q;
        var lito = lithOf(mean(s2[li2], s2[li2 + 1], well.x));
        readout.innerHTML = (TOP + idx * STEP).toFixed(2) + ' m · GR ' + well.x[idx].toFixed(0) +
          ' · <span style="color:' + lito.color + ';font-weight:600">' + lito.name + '</span>';
      });
      hit.addEventListener('mouseleave', function () {
        xh.style.display = 'none';
        readout.textContent = '把鼠标移到曲线上';
      });
    }

    /* ------- 指标 ------- */
    function drawMetrics() {
      var f = sc.f1, cls = f >= 0.85 ? 'good' : f >= 0.6 ? 'warn' : 'bad';
      metricsEl.innerHTML =
        '<div class="metric ' + cls + '"><div class="l">F1</div><div class="v">' + f.toFixed(2) + '</div></div>' +
        '<div class="metric"><div class="l">召回 R</div><div class="v">' + sc.r.toFixed(2) + '<small>' + sc.tp + '/' + (sc.tp + sc.fn) + '</small></div></div>' +
        '<div class="metric"><div class="l">精确 P</div><div class="v">' + sc.p.toFixed(2) + '<small>' + sc.tp + '/' + (sc.tp + sc.fp) + '</small></div></div>' +
        '<div class="metric"><div class="l">平均偏差</div><div class="v">' + sc.mae.toFixed(2) + '<small>m</small></div></div>';

      var nn = det.length + 1, nt = well.cut.length + 1;
      var msg;
      if (sc.f1 >= 0.85) msg = '界面基本对齐：层数 ' + nn + ' vs 真实 ' + nt + '，可以直接进入人工复核。';
      else if (nn > nt + 1) msg = '当前 <b>过分割</b>：切出 ' + nn + ' 个层，真实只有 ' + nt + ' 个。β 偏小，噪声波动被当成了界面。';
      else if (nn < nt - 1) msg = '当前 <b>欠分割</b>：只切出 ' + nn + ' 个层，真实有 ' + nt + ' 个。β 偏大或噪声过大，相邻层被合并了。';
      else msg = '层数接近但位置有偏差：共 ' + nn + ' 层，命中 ' + sc.tp + ' 个界面。';
      if (sc.fn) msg += ' 漏检 ' + sc.fn + ' 处、多检 ' + sc.fp + ' 处。';
      var thinMiss = trueLayers().filter(function (L) { return L.thick < 1.0; }).length;
      if (sc.fn && thinMiss) msg += ' 漏掉的多半是图中标黄的 <b>&lt;1 m 薄层</b>——被最小层厚规则挡在门外。';
      verdictEl.innerHTML = msg;
    }

    /* ------- 调参曲线 ------- */
    function drawFit() {
      var w = 360, h = 120, m = { l: 26, r: 8, t: 10, b: 18 };
      var f1s = fitData.map(function (d) { return d.f1; });
      var ymax = 1, ymin = Math.max(0, Math.min.apply(null, f1s) - 0.08);
      function fx(k) { return m.l + (k - 0.2) / 11.8 * (w - m.l - m.r); }
      function fy(v) { return m.t + (1 - (v - ymin) / (ymax - ymin)) * (h - m.t - m.b); }

      var s = '';
      [ymin, (ymin + ymax) / 2, ymax].forEach(function (v) {
        s += '<line x1="' + m.l + '" y1="' + fy(v) + '" x2="' + (w - m.r) + '" y2="' + fy(v) + '" stroke="' + C.grid + '"/>';
        s += '<text x="' + (m.l - 5) + '" y="' + (fy(v) + 3) + '" fill="' + C.textDim + '" font-size="8" font-family="monospace" text-anchor="end">' + v.toFixed(1) + '</text>';
      });
      var pts = fitData.map(function (d) { return fx(d.k).toFixed(1) + ',' + fy(d.f1).toFixed(1); }).join(' ');
      s += '<polyline points="' + pts + '" fill="none" stroke="' + C.truth + '" stroke-width="1.5" opacity="0.85"/>';

      var best = fitData.reduce(function (a, b) { return b.f1 > a.f1 ? b : a; }, fitData[0]);
      s += '<circle cx="' + fx(best.k) + '" cy="' + fy(best.f1) + '" r="2.6" fill="' + C.truth + '"/>';
      s += '<text x="' + (fx(best.k) + 5) + '" y="' + (fy(best.f1) - 5) + '" fill="' + C.truth + '" font-size="8" font-family="monospace">best β=' + best.k.toFixed(1) + '</text>';

      var cx = fx(state.beta);
      s += '<line x1="' + cx + '" y1="' + m.t + '" x2="' + cx + '" y2="' + (h - m.b) + '" stroke="' + C.det + '" stroke-width="1" stroke-dasharray="3 3"/>';
      s += '<circle cx="' + cx + '" cy="' + fy(sc.f1) + '" r="3.2" fill="' + C.det + '"/>';

      s += '<text x="' + m.l + '" y="' + (h - 4) + '" fill="' + C.textDim + '" font-size="8" font-family="monospace">β 0.2</text>';
      s += '<text x="' + (w - m.r) + '" y="' + (h - 4) + '" fill="' + C.textDim + '" font-size="8" font-family="monospace" text-anchor="end">12.0</text>';
      fitSvg.innerHTML = s;
      root.querySelector('#fit-note').textContent = fitData.length + ' 次重算 · 当前 β=' + state.beta.toFixed(1);
    }

    /* ------- 分层表 ------- */
    function drawTable() {
      var starts = [0].concat(det).concat([N]);
      var rows = '';
      for (var i = 0; i < starts.length - 1; i++) {
        var a = starts[i], b = starts[i + 1];
        var m = mean(a, b, well.x), li = lithOf(m);
        var top = TOP + a * STEP, bot = TOP + b * STEP;
        var judge = '—', cls = '';
        if (i === 0) { judge = '井段顶'; }
        else {
          var matched = false;
          well.cut.forEach(function (c, ci) { if (sc.matchedTrue[ci] && Math.abs(c - a) <= TOL) matched = true; });
          judge = matched ? '✓ 命中' : '✗ 多余界面';
          cls = matched ? 'ok' : 'extra';
        }
        rows += '<tr><td>' + (i + 1) + '</td>' +
          '<td>' + top.toFixed(2) + '</td>' +
          '<td>' + bot.toFixed(2) + '</td>' +
          '<td>' + (bot - top).toFixed(2) + '</td>' +
          '<td>' + m.toFixed(0) + '</td>' +
          '<td class="lith"><span class="swatch" style="background:' + li.color + '"></span>' + li.name + '</td>' +
          '<td class="' + cls + '">' + judge + '</td></tr>';
      }
      tableEl.innerHTML = '<thead><tr><th>层</th><th>顶深 (m)</th><th>底深 (m)</th><th>厚度 (m)</th><th>平均 GR</th><th>岩性推断</th><th>判定</th></tr></thead><tbody>' + rows + '</tbody>';
    }

    function paint() { drawTrack(); drawMetrics(); drawFit(); drawTable(); }

    /* ------- 事件 ------- */
    root.querySelector('[data-act="new"]').addEventListener('click', function () {
      state.seed = Math.floor(Math.random() * 1e9);
      recompute(true); paint();
    });

    root.querySelector('#c-noise').addEventListener('input', function () {
      state.noise = +this.value;
      root.querySelector('#v-noise').textContent = this.value;
      recompute(true); paint();
    });

    root.querySelector('#c-layers').addEventListener('input', function () {
      state.layers = +this.value;
      root.querySelector('#v-layers').textContent = this.value;
      recompute(true); paint();
    });

    root.querySelector('#c-beta').addEventListener('input', function () {
      state.beta = +this.value;
      root.querySelector('#v-beta').textContent = (+this.value).toFixed(1);
      det = segment(well.x, betaOf(state.beta));
      sc = score(det, well.cut);
      paint();
    });

    var tog = root.querySelector('#c-true');
    tog.addEventListener('click', function () {
      state.showTrue = !state.showTrue;
      tog.classList.toggle('on', state.showTrue);
      drawTrack();
    });

    /* ------- 初始化 ------- */
    recompute(true);
    paint();
  }

  window.WelllogLayerDemo = WelllogLayerDemo;
  window.WelllogLayerDemoCleanup = function () { /* 本示范未使用定时器，DOM 销毁即释放 */ };
})();

</script>

  var tabs={"background":{"label":"专业背景","lede":"岩屑由钻井液携带至地面，是录井人员识别钻遇岩性的直接样品。样品经过清洗、烘干和挑选后，在显微镜下观察颗粒、结构、颜色与胶结特征，并结合井深形成岩屑描述。自动识别的目标是提供稳定的初筛与定量统计，最终定名仍由地质人员结合邻井和测井资料确认。","judge":[{"label":"任务","value":"把显微镜下的岩屑图像转换成可复核的岩性分类与组分比例。"},{"label":"数据门槛","value":"30 口井起步"},{"label":"可见收益","value":"优先复核难例"},{"label":"难度","value":"高"}],"sections":[{"no":1,"en":"PROBLEM","title":"当前做法与问题","html":"<p>一口井会产生数百个深度样品，逐样观察耗时；不同人员对细粒砂岩、粉砂岩、泥质岩等近似类别的边界判断可能不同。混样、泥浆污染、颗粒遮挡和光照差异会进一步增加误差。</p>"},{"no":2,"en":"INTERVENTION","title":"AI 能做什么","html":"<p>对标准化显微图像进行颗粒级检测/分类，再按样品汇总岩性比例、粒级与置信度；低置信度或疑似混样的图像进入人工复核。</p><p><b>责任边界：</b>模型输出候选或初稿，专业人员确认并保留最终解释权。</p>"},{"no":3,"en":"DATA","title":"需要准备什么","html":"<p>优先整理同一区块、来源明确且可按井隔离的数据。建议以下数据条件作为试点起点，需结合实际区块规模调整。</p><ul><li><b>岩屑显微图像</b>：建议固定倍率、光源、背景和标尺；每口井 300—800 张起步；标签/用途：颗粒框或图像级岩性标签；训练/验证按井隔离</li><li><b>岩屑描述与井深</b>：样品深度、主/次岩性、粒级、含油显示；标签/用途：由解释员复核的统一标签</li><li><b>样品处理元数据</b>：清洗、烘干、拍摄设备与日期；标签/用途：用于识别域偏移与追溯</li></ul>"},{"no":4,"en":"DIFFICULTY","title":"技术难度与参考方向","html":"<p><b>难度：高。</b>主要挑战包括数据质量、标签一致性与跨井/跨设备泛化。建议先建立简单基线，再用整井或整批留出验证；不要仅报告随机切分的单一准确率。</p><p><b>通用技术方向：</b>细粒度图像分类、目标检测与实例分割、类别不均衡与小样本学习、置信度校准与人工复核。</p>"}]},"workflow":{"label":"案例流程","title":"从岩屑照片到可复核的岩性统计","lead":["示意项目：选取同一区块 30 口井、约 1.5 万张标准化颗粒图像，建立岩性初筛模型。所有数值仅用于说明流程，不代表真实油田性能。","目标是减少逐颗粒目视归类时间，并把不确定样品排到复核队列；模型不独立签发地质结论。"],"stats":[["示意井数","30 口"],["图像量","约 1.5 万张"],["输出","类别 + 比例"],["决策方式","AI 初筛 / 人工定名"]],"steps":[{"name":"采集标准化","role":"图像","do":"固定倍率、标尺、色卡、光照和背景，同一批次记录拍摄参数。","effect":"降低成像差异，让模型学习岩屑而不是灯光。","trap":"混用倍率会导致颗粒尺度特征失真。"},{"name":"颗粒标注与质检","role":"地质标注","do":"按颗粒框选，记录岩性；双人复核争议样本，保留混合类别。","effect":"形成可追溯标签并显式表达不确定性。","trap":"把同一口井的近似图片拆到训练和测试会造成信息泄漏。"},{"name":"训练与井级验证","role":"视觉模型","do":"先建立轻量分类基线，再比较检测/分割；训练、验证按井号切分。","effect":"得到新井可泛化能力的估计。","trap":"仅随机分图会高估性能。"},{"name":"比例汇总与复核","role":"解释员","do":"按样品汇总颗粒类别比例，低置信度、少见类别和混样样本优先复核。","effect":"把人工时间集中在难例上。","trap":"模型置信度不等于地质可信度。"}],"metrics":{"title":"如何判断方案有效","html":"<ul><li>颗粒级 Macro-F1：各岩性类别 F1 的平均，避免常见类掩盖少数类。</li><li>样品级主岩性准确率：模型主类与专家复核主类一致比例。</li><li>复核负担：达到目标质量时需人工复核的图像比例。</li><li>跨井测试：整口留出井从未参与训练，报告置信区间与类别混淆。</li></ul><p>所有演示数值均为教学示意，落地前需要用经审核的留出井/留出批次数据重新评估。</p>"},"fails":[{"name":"细粒砂岩与粉砂岩易混","why":"增加粒度标注与多尺度图像，并单列相邻类别混淆。"},{"name":"光照/倍率变化造成域偏移","why":"固定拍摄流程，按设备分层评估。"},{"name":"混样或泥浆污染","why":"设置“混合/不可判”类别，避免强行单类输出。"}]},"demo":{"label":"交互演示","intro":"切换示意岩屑样本，观察分类、置信度与复核提示。样本为教学用合成示意，不是真实岩屑图像。","height":680}};
  var demoFile={"name":"demo/index.html","mime":"text/html","enc":"text","data":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>演示</title><style>\n:root{--ink:#242b2e;--muted:#68747a;--jade:#2f7d6b;--clay:#b26a39;--line:#e5e7e2;--paper:#fff;--soft:#f5f7f5}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.6 system-ui,\"Microsoft YaHei\",sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--jade);font-weight:700}.sub{color:var(--muted);margin:4px 0 16px}.badge{display:inline-flex;padding:3px 9px;border-radius:999px;background:#e7f2ed;color:var(--jade);font-size:12px}.panel{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.ctrl{display:flex;align-items:center;gap:8px;color:var(--muted)}input[type=range]{accent-color:var(--jade)}button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}button.active,button:hover{border-color:var(--jade);color:var(--jade)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:130px;flex:1}.metric b{display:block;font-size:22px;color:var(--jade)}.note{font-size:12px;color:var(--muted)}svg{width:100%;height:auto;background:white;border-radius:8px}.warn{color:var(--clay)}.small{font-size:12px}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;min-width:135px;flex:1}.bar{height:10px;background:#e9ece9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#70b59c,var(--jade));border-radius:99px}.source{color:var(--jade);font-size:11px;font-weight:700}.foot{margin-top:12px;padding:10px;border-left:3px solid var(--clay);background:#fbf4ee;color:#705538;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.head{display:block}}</style></head><body><main class=\"wrap\"><div class=\"head\"><div><span class=\"eyebrow\">INTERACTIVE DEMO · M1</span><h2 style=\"margin:6px 0 0\">岩屑图像分类示意</h2><p class=\"sub\">颗粒分割、岩性候选与置信度共同支持快速初筛，最终由地质人员复核。</p></div><span class=\"badge\">教学示意数据</span></div><div id=\"app\"></div><div class=\"foot\">本演示使用程序生成/虚构数据，仅说明可视化与流程逻辑，不构成现场判断或生产建议。</div></main><script>\nconst app=document.getElementById('app');\nconst samples=[['砂岩',.86,'#d6aa68','颗粒较粗 · 次棱角状','主颗粒比例 68%'],['粉砂岩',.73,'#b99a72','细粒为主 · 分选中等','细粒比例 74%'],['泥岩',.91,'#6d91a9','暗色细粒 · 层理明显','泥质组分 82%'],['混合样',.48,'#9a8d78','砂泥混杂 · 需复核','两类比例接近']];let i=0;function draw(){let s=samples[i];app.innerHTML=`<div class=\"row\">${samples.map((x,j)=>`<button class=\"${i===j?'active':''}\" onclick=\"i=${j};draw()\">样本 ${j+1}</button>`).join('')}</div><div class=\"grid\"><section class=\"panel\"><h3>样品视野（示意颗粒）</h3><svg viewBox=\"0 0 600 300\"><rect width=\"600\" height=\"300\" fill=\"#f1eee7\"/>${Array.from({length:30},(_,n)=>{let x=(n*83+27)%570+15,y=(n*47+19)%260+20,r=8+(n*7)%23;return `<ellipse cx=\"${x}\" cy=\"${y}\" rx=\"${r*1.3}\" ry=\"${r*.7}\" transform=\"rotate(${n*21} ${x} ${y})\" fill=\"${s[2]}\" opacity=\"${.35+(n%6)*.09}\" stroke=\"#79694f\" stroke-opacity=\".35\"/>`}).join('')}<text x=\"20\" y=\"284\" font-size=\"12\" fill=\"#68747a\">程序绘制的示意颗粒 · 非真实显微图像</text></svg></section><section class=\"panel\"><h3>岩性识别建议</h3><div class=\"metric\"><b>${s[0]}</b><span>${s[3]}</span></div><p>模型置信度</p><div class=\"bar\"><i style=\"width:${s[1]*100}%\"></i></div><p><b>${Math.round(s[1]*100)}%</b> · ${s[4]}</p><div class=\"cards\"><div class=\"card\">主类<b>${s[0]}</b></div><div class=\"card\">复核状态<b class=\"${s[1]<.6?'warn':''}\">${s[1]<.6?'建议复核':'可优先通过'}</b></div></div><p class=\"note\">置信度低于 60% 或混合样进入人工复核队列。</p></section></div>`}draw();\n<\/script></body></html>"};

    if(!window.CaseDemoHost){root.innerHTML='<div class=\"callout warn\">示范宿主未加载。</div>';return;}

<script>
(function(){
  var meta={"id":"mudlog-gas-anomaly","sceneId":"m2","title":"气测异常段智能识别与解释","version":"1.0.0","updated":"2026-10-23"};
  var tabs={"background":{"label":"专业背景","lede":"气测录井连续监测钻井液返出气体中的总烃及甲烷、乙烷等组分，是发现油气显示的重要信息来源。解释人员需要把气体响应与钻进深度、循环和接单根等工况对应起来，再结合岩屑、荧光和后续试油资料综合判断。","judge":[{"label":"任务","value":"从总烃与组分曲线中定位异常段，并结合工况信息给出解释优先级。"},{"label":"数据门槛","value":"按井分组"},{"label":"可见收益","value":"异常候选排序"},{"label":"难度","value":"中"}],"sections":[{"no":1,"en":"PROBLEM","title":"当前做法与问题","html":"<p>背景气、接单根气、泵启停和脱气效率变化会造成曲线波动。只按固定阈值容易漏掉缓慢异常，也可能把工况扰动误报为油气显示；异常段样本少且真值需要其他资料验证。</p>"},{"no":2,"en":"INTERVENTION","title":"AI 能做什么","html":"<p>先估计随深度变化的背景基线，再检测持续偏离和组分比变化，输出候选异常区间、异常类型线索及置信度。模型只负责排序与提示，油气性质必须由综合解释确认。</p><p><b>责任边界：</b>模型输出候选或初稿，专业人员确认并保留最终解释权。</p>"},{"no":3,"en":"DATA","title":"需要准备什么","html":"<p>优先整理同一区块、来源明确且可按井隔离的数据。建议以下数据条件作为试点起点，需结合实际区块规模调整。</p><ul><li><b>气测全烃与组分</b>：建议 1—5 m 采样，保存原始时间与深度；标签/用途：异常段起止深度、专家解释标签</li><li><b>钻井工况</b>：钻时、泵启停、接单根、排量、泥浆性能；标签/用途：用于区分工况气与地层响应</li><li><b>验证资料</b>：岩屑/荧光、测井、测试或试油结果；标签/用途：作为解释核验，不可把模型预测当真值</li></ul>"},{"no":4,"en":"DIFFICULTY","title":"技术难度与参考方向","html":"<p><b>难度：中。</b>主要挑战包括数据质量、标签一致性与跨井/跨设备泛化。建议先建立简单基线，再用整井或整批留出验证；不要仅报告随机切分的单一准确率。</p><p><b>通用技术方向：</b>稳健基线估计、变化点检测、多变量时序分类、弱标签与代价敏感评估。</p>"}]},"workflow":{"label":"案例流程","title":"气测曲线异常候选段筛查","lead":["示意项目：对同区块历史井的全烃及组分数据进行深度对齐，筛选值得复核的异常段。以下数据与指标为模拟教学值。","先做透明的基线+持续性规则作为基准，再评估时序模型是否改善异常段召回和复核效率。"],"stats":[["示意数据","12 口井"],["采样间隔","约 2 m"],["输出","候选区间"],["首要关注","漏报 / 可解释"]],"steps":[{"name":"深度和迟到校正","role":"数据工程","do":"统一深度基准，校正气体从井底到地面的迟到时间，并标记接单根等事件。","effect":"避免异常段与实际层位错位。","trap":"迟到校正错误会把显示归到错误层段。"},{"name":"基线与异常候选","role":"时序分析","do":"用稳健滑动中位数估计背景，结合偏离幅度、持续长度和组分比生成候选区间。","effect":"同时捕捉尖峰与缓慢抬升。","trap":"固定阈值可能随井、泥浆和设备漂移。"},{"name":"工况过滤与排序","role":"多源融合","do":"对照泵启停、接单根、钻时和泥浆参数，将明显工况扰动降权而非简单删除。","effect":"解释员先看最可能有地层意义的区间。","trap":"工况事件缺失时需要保留不确定标签。"},{"name":"综合复核与回流","role":"地质解释","do":"与岩屑、荧光、测井及测试资料交叉核验，记录确认/排除原因。","effect":"形成可审计的解释闭环。","trap":"不能用预测标签反过来充当独立真值。"}],"metrics":{"title":"如何判断方案有效","html":"<ul><li>区间召回率：经专家确认的异常区间中被候选覆盖的比例；优先控制漏报。</li><li>每百米误报数：候选区间中需排除的频率，反映复核负担。</li><li>区间重叠 IoU：预测区间与专家区间的交并比，补充衡量定位质量。</li><li>按井留出测试，并分别报告接单根、背景气强等工况子集。</li></ul><p>所有演示数值均为教学示意，落地前需要用经审核的留出井/留出批次数据重新评估。</p>"},"fails":[{"name":"接单根气误报","why":"增加工况事件标记，并输出“工况相关”解释标签。"},{"name":"基线缓慢漂移","why":"使用分段稳健基线并监控设备/泥浆变化。"},{"name":"测试结果缺失","why":"采用分层置信等级，明确哪些判断尚未被独立验证。"}]},"demo":{"label":"交互演示","intro":"调节检测阈值和持续时间，查看模拟气测曲线上的异常候选区间。","height":680}};
  var demoFile={"name":"demo/index.html","mime":"text/html","enc":"text","data":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>演示</title><style>\n:root{--ink:#242b2e;--muted:#68747a;--jade:#2f7d6b;--clay:#b26a39;--line:#e5e7e2;--paper:#fff;--soft:#f5f7f5}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.6 system-ui,\"Microsoft YaHei\",sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--jade);font-weight:700}.sub{color:var(--muted);margin:4px 0 16px}.badge{display:inline-flex;padding:3px 9px;border-radius:999px;background:#e7f2ed;color:var(--jade);font-size:12px}.panel{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.ctrl{display:flex;align-items:center;gap:8px;color:var(--muted)}input[type=range]{accent-color:var(--jade)}button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}button.active,button:hover{border-color:var(--jade);color:var(--jade)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:130px;flex:1}.metric b{display:block;font-size:22px;color:var(--jade)}.note{font-size:12px;color:var(--muted)}svg{width:100%;height:auto;background:white;border-radius:8px}.warn{color:var(--clay)}.small{font-size:12px}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;min-width:135px;flex:1}.bar{height:10px;background:#e9ece9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#70b59c,var(--jade));border-radius:99px}.source{color:var(--jade);font-size:11px;font-weight:700}.foot{margin-top:12px;padding:10px;border-left:3px solid var(--clay);background:#fbf4ee;color:#705538;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.head{display:block}}</style></head><body><main class=\"wrap\"><div class=\"head\"><div><span class=\"eyebrow\">INTERACTIVE DEMO · M2</span><h2 style=\"margin:6px 0 0\">气测异常段候选筛查</h2><p class=\"sub\">结合全烃与组分曲线识别异常候选段，并用工况和迟到时间校正辅助复核。</p></div><span class=\"badge\">教学示意数据</span></div><div id=\"app\"></div><div class=\"foot\">本演示使用程序生成/虚构数据，仅说明可视化与流程逻辑，不构成现场判断或生产建议。</div></main><script>\nconst app=document.getElementById('app');\nlet threshold=1.6,duration=3;function draw(){let vals=Array.from({length:80},(_,i)=>.6+Math.sin(i*.35)*.18+Math.sin(i*1.71)*.08+(i>28&&i<40?1.3*Math.sin((i-28)/12*Math.PI):0)+(i>57&&i<63?.65:0));let hits=[];let on=-1;vals.forEach((v,i)=>{if(v>threshold&&on<0)on=i;if((v<=threshold||i===79)&&on>=0){if(i-on>=duration)hits.push([on,i]);on=-1}});let points=vals.map((v,i)=>`${40+i*8.8},${220-v*76}`).join(' ');app.innerHTML=`<div class=\"panel row\"><label class=\"ctrl\">异常阈值 <input id=\"th\" type=\"range\" min=\".8\" max=\"2.5\" step=\".1\" value=\"${threshold}\"><b>${threshold.toFixed(1)}%</b></label><label class=\"ctrl\">最短持续点数 <input id=\"du\" type=\"range\" min=\"1\" max=\"8\" value=\"${duration}\"><b>${duration}</b></label><span class=\"note\">模拟单位：全烃 % · 横轴为深度递增</span></div><div class=\"grid\"><section class=\"panel\"><h3>气测全烃曲线</h3><svg viewBox=\"0 0 760 270\"><path d=\"M40 30V225H735\" stroke=\"#ccd2ce\" fill=\"none\"/>${[0,1,2,3].map(k=>`<line x1=\"40\" y1=\"${220-k*60}\" x2=\"735\" y2=\"${220-k*60}\" stroke=\"#edf0ed\"/><text x=\"8\" y=\"${224-k*60}\" font-size=\"11\" fill=\"#68747a\">${k}%</text>`).join('')}${hits.map(([a,b])=>`<rect x=\"${40+a*8.8}\" y=\"35\" width=\"${(b-a)*8.8}\" height=\"188\" fill=\"#edd9c5\" opacity=\".65\"/>`).join('')}<polyline points=\"${points}\" fill=\"none\" stroke=\"#2f7d6b\" stroke-width=\"2.5\"/>${hits.map(([a,b])=>`<text x=\"${40+a*8.8}\" y=\"48\" font-size=\"11\" fill=\"#b26a39\">候选异常</text>`).join('')}<text x=\"40\" y=\"250\" font-size=\"11\" fill=\"#68747a\">浅色区间 = 持续超过阈值的候选段</text></svg></section><section class=\"panel\"><h3>候选解释清单</h3><div class=\"cards\">${hits.length?hits.map(([a,b],j)=>`<div class=\"card\"><span class=\"badge\">候选 ${j+1}</span><p>深度索引 ${a}—${b}</p><b>需结合工况复核</b><p class=\"note\">检查接单根 / 泵启停 / 组分比</p></div>`).join(''):'<div class=\"card\">当前参数下没有候选段，可降低阈值或持续点数。</div>'}</div><p class=\"note\">模拟异常不等同于油气层；需对照岩屑、荧光、测井与试油资料。</p></section></div>`;document.getElementById('th').oninput=e=>{threshold=+e.target.value;draw()};document.getElementById('du').oninput=e=>{duration=+e.target.value;draw()}}draw();\n<\/script></body></html>"};

(function(){
  var meta={"id":"mudlog-fluorescence-grading","sceneId":"m3","title":"岩屑荧光图像智能分级","version":"1.0.0","updated":"2026-10-23"};
  var tabs={"background":{"label":"专业背景","lede":"荧光录井通过紫外光照射岩屑，观察发光颜色、强度、产状及滴照反应，为含油性判断提供现场线索。图像模型可把主观目测变为可复核的等级建议，但荧光受油质、矿物、灯源和拍摄条件影响，不能直接替代综合含油性评价。","judge":[{"label":"任务","value":"在标准化紫外成像下估计荧光级别并标出支持判断的图像区域。"},{"label":"数据门槛","value":"固定成像"},{"label":"可见收益","value":"等级一致建议"},{"label":"难度","value":"中"}],"sections":[{"no":1,"en":"PROBLEM","title":"当前做法与问题","html":"<p>荧光级别主要依赖人员目视经验。不同紫外灯强度、曝光、白平衡和拍摄距离会改变图像亮度与颜色；矿物荧光、背景反射也可能与油质荧光混淆。</p>"},{"no":2,"en":"INTERVENTION","title":"AI 能做什么","html":"<p>先对图像做色彩校正与岩屑区域提取，再估计亮度、颜色分布、荧光面积等特征，输出 1—4 级建议、置信度和关注区域。低置信度样本转人工复判。</p><p><b>责任边界：</b>模型输出候选或初稿，专业人员确认并保留最终解释权。</p>"},{"no":3,"en":"DATA","title":"需要准备什么","html":"<p>优先整理同一区块、来源明确且可按井隔离的数据。建议以下数据条件作为试点起点，需结合实际区块规模调整。</p><ul><li><b>紫外荧光图像</b>：固定波长灯源、曝光、距离、色卡和暗场条件；每井 200—600 张起步；标签/用途：按统一标准标记 1—4 级及不可判样本</li><li><b>白光对照图像</b>：同一样品的可见光照片；标签/用途：用于区分矿物/背景特征</li><li><b>样品与验证记录</b>：井深、岩性、油质描述、滴照结果；标签/用途：专家复核标签；少量测试结果作外部校验</li></ul>"},{"no":4,"en":"DIFFICULTY","title":"技术难度与参考方向","html":"<p><b>难度：中。</b>主要挑战包括数据质量、标签一致性与跨井/跨设备泛化。建议先建立简单基线，再用整井或整批留出验证；不要仅报告随机切分的单一准确率。</p><p><b>通用技术方向：</b>色彩空间与光照校正、图像分类与区域注意力、有序分类、跨设备域适配。</p>"}]},"workflow":{"label":"案例流程","title":"荧光图像分级与证据展示","lead":["示意项目：在固定成像箱中采集四级荧光样本，先建立图像分级基线，再观察跨批次稳定性。颜色与样本均为教学示意。","方案强调“等级建议 + 证据 + 复核”，不从颜色直接推断储量或商业产能。"],"stats":[["分级体系","1—4 级"],["成像要求","固定 UV / 曝光"],["输出","级别 + 置信度"],["复核触发","低置信 / 域外"]],"steps":[{"name":"标准化成像","role":"采集","do":"固定紫外波长、照射时间、暗场背景、镜头距离，并拍摄色卡。","effect":"颜色差异更可能来自样品而非设备。","trap":"自动曝光会破坏跨样本比较。"},{"name":"岩屑区域与质量检查","role":"视觉预处理","do":"分离样品区域，检测过曝、模糊、遮挡与背景污染。","effect":"不合格图像先重拍，避免垃圾进模型。","trap":"强反光可能被误识别为荧光。"},{"name":"有序等级建模","role":"图像算法","do":"提取颜色/亮度分布并训练有序分类器；同时保留不可判类。","effect":"输出级别建议及影响判断的区域。","trap":"等级之间有序，不能只看普通准确率。"},{"name":"盲评与人工确认","role":"现场解释","do":"按批次或设备留出盲评，与专家一致性及滴照/测试资料核验。","effect":"明确模型可用边界并收集争议样本。","trap":"同一批图片随机切分会高估跨批次表现。"}],"metrics":{"title":"如何判断方案有效","html":"<ul><li>加权 Kappa：惩罚相差多级的错误，比单纯准确率更符合等级任务。</li><li>Macro-F1：防止少数高荧光等级被多数低等级掩盖。</li><li>跨批次一致性：按拍摄日期、设备和井分组报告性能。</li><li>校准误差：检查模型给出的置信度是否可信，并设低置信转人工阈值。</li></ul><p>所有演示数值均为教学示意，落地前需要用经审核的留出井/留出批次数据重新评估。</p>"},"fails":[{"name":"设备曝光漂移","why":"锁定曝光并用色卡校正，记录设备元数据。"},{"name":"矿物/背景假荧光","why":"加入白光对照与矿物干扰样本，提供不可判类别。"},{"name":"等级边界主观","why":"统一标注规范，双人盲评并记录争议区间。"}]},"demo":{"label":"交互演示","intro":"切换示意荧光等级，观察颜色分布与置信度如何支持分级建议。图像为程序生成的色块示意。","height":680}};

  var tabs={"background":{"label":"专业背景","lede":"钻时表示钻头钻进单位进尺所需时间，受岩石可钻性影响，也会随钻压、转速、排量、钻头磨损和井眼条件变化。录井解释人员常将钻时与岩屑、气测及邻井对比，用于辅助判断岩性变化和界面位置。","judge":[{"label":"任务","value":"从钻时变化中提取可能的地层界面，并将工况影响与地质变化区分开来。"},{"label":"数据门槛","value":"曲线 + 工况"},{"label":"可见收益","value":"减少逐段扫描"},{"label":"难度","value":"中"}],"sections":[{"no":1,"en":"PROBLEM","title":"当前做法与问题","html":"<p>同一种岩性在不同钻井参数下可出现不同钻时；单看曲线尖峰容易过分割，平缓变化又可能漏掉界面。岩屑返出存在迟到时间，若深度对齐不准，交叉验证会错位。</p>"},{"no":2,"en":"INTERVENTION","title":"AI 能做什么","html":"<p>利用滑窗中位数、变化幅度、局部方差和钻井参数校正生成界面候选及变化强度；用岩屑/气测证据排序，供解释员确认而非自动定层。</p><p><b>责任边界：</b>模型输出候选或初稿，专业人员确认并保留最终解释权。</p>"},{"no":3,"en":"DATA","title":"需要准备什么","html":"<p>优先整理同一区块、来源明确且可按井隔离的数据。建议以下数据条件作为试点起点，需结合实际区块规模调整。</p><ul><li><b>钻时/机械钻速曲线</b>：0.5—1 m 采样，统一单位并记录深度；标签/用途：30—50 口井的人工界面/层段标签</li><li><b>钻井参数</b>：钻压、转速、排量、钻头型号及进尺；标签/用途：用于归一化工况影响</li><li><b>岩屑、气测与邻井资料</b>：同井段，含迟到时间校正；标签/用途：交叉验证界面及评估解释一致性</li></ul>"},{"no":4,"en":"DIFFICULTY","title":"技术难度与参考方向","html":"<p><b>难度：中。</b>主要挑战包括数据质量、标签一致性与跨井/跨设备泛化。建议先建立简单基线，再用整井或整批留出验证；不要仅报告随机切分的单一准确率。</p><p><b>通用技术方向：</b>稳健变化点检测、工况归一化、多变量序列分割、迟到时间校正。</p>"}]},"workflow":{"label":"案例流程","title":"从钻时变化到地层界面候选","lead":["示意项目：使用同区块 40 口井的钻时与作业参数，发现曲线变化点并与已复核层界对比。示意性能数字不代表现场效果。","先确保深度与迟到时间一致，再判断算法是否能减少人工逐段扫描，不把机械参数变化直接等同于地层界面。"],"stats":[["示意井数","40 口"],["采样","0.5—1 m"],["输出","界面候选"],["容差示例","±1 m"]],"steps":[{"name":"数据清洗与统一","role":"数据","do":"统一钻时单位、深度网格，标记停钻/接单根/换钻头等非地层事件。","effect":"分离有效钻进响应与作业事件。","trap":"异常值删除可能抹掉真实突变，需留痕。"},{"name":"迟到与工况校正","role":"工程校正","do":"按井段估计岩屑迟到时间，并对钻压、转速、排量变化做条件标记或归一化。","effect":"让钻时、岩屑和气测在同一地层位置比较。","trap":"把迟到时间当常数可能产生系统偏移。"},{"name":"候选界面检测","role":"时序模型","do":"基线用滑窗中位数和变化点算法，进阶使用多变量序列分割输出界面概率。","effect":"形成可排序的候选界面而不是黑箱层名。","trap":"参数变化造成的假界面需由工况通道解释。"},{"name":"综合对比与复核","role":"地质解释","do":"查看候选附近岩屑、气测和邻井层序；接受、移动或拒绝界面。","effect":"保留可追溯的最终解释与反馈样本。","trap":"评测标签与训练标签必须按井隔离。"}],"metrics":{"title":"如何判断方案有效","html":"<ul><li>界面命中率：候选与专家界面在 ±1 m（示例容差）内匹配的比例。</li><li>召回率 / 精确率：分别反映漏界面与多余候选；根据作业成本选择阈值。</li><li>平均绝对深度误差：仅对匹配界面计算。</li><li>按井留出，并单列换钻头、参数突变与迟到校正不确定井段。</li></ul><p>所有演示数值均为教学示意，落地前需要用经审核的留出井/留出批次数据重新评估。</p>"},"fails":[{"name":"参数突变造成误报","why":"把钻压/转速/排量变化作为解释通道，并标记事件附近候选。"},{"name":"迟到时间错误","why":"用循环参数和现场校正更新，展示校正不确定范围。"},{"name":"渐变界面难定位","why":"允许输出界面概率带或深度区间，不强制单点。"}]},"demo":{"label":"交互演示","intro":"调整检测阈值，观察程序生成的钻时曲线如何形成界面候选。","height":680}};
  var demoFile={"name":"demo/index.html","mime":"text/html","enc":"text","data":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>演示</title><style>\n:root{--ink:#242b2e;--muted:#68747a;--jade:#2f7d6b;--clay:#b26a39;--line:#e5e7e2;--paper:#fff;--soft:#f5f7f5}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.6 system-ui,\"Microsoft YaHei\",sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--jade);font-weight:700}.sub{color:var(--muted);margin:4px 0 16px}.badge{display:inline-flex;padding:3px 9px;border-radius:999px;background:#e7f2ed;color:var(--jade);font-size:12px}.panel{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.ctrl{display:flex;align-items:center;gap:8px;color:var(--muted)}input[type=range]{accent-color:var(--jade)}button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}button.active,button:hover{border-color:var(--jade);color:var(--jade)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:130px;flex:1}.metric b{display:block;font-size:22px;color:var(--jade)}.note{font-size:12px;color:var(--muted)}svg{width:100%;height:auto;background:white;border-radius:8px}.warn{color:var(--clay)}.small{font-size:12px}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;min-width:135px;flex:1}.bar{height:10px;background:#e9ece9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#70b59c,var(--jade));border-radius:99px}.source{color:var(--jade);font-size:11px;font-weight:700}.foot{margin-top:12px;padding:10px;border-left:3px solid var(--clay);background:#fbf4ee;color:#705538;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.head{display:block}}</style></head><body><main class=\"wrap\"><div class=\"head\"><div><span class=\"eyebrow\">INTERACTIVE DEMO · M4</span><h2 style=\"margin:6px 0 0\">钻时变化点候选</h2><p class=\"sub\">沿井深检测钻时序列变化，提示层界候选并结合其他录井资料确认。</p></div><span class=\"badge\">教学示意数据</span></div><div id=\"app\"></div><div class=\"foot\">本演示使用程序生成/虚构数据，仅说明可视化与流程逻辑，不构成现场判断或生产建议。</div></main><script>\nconst app=document.getElementById('app');\nlet threshold=1.3;function draw(){let vals=Array.from({length:100},(_,i)=>1.1+.22*Math.sin(i*.28)+.12*Math.sin(i*1.7)+(i>28&&i<48?1.3:0)+(i>68?.7:0));let cand=[];for(let i=3;i<vals.length-3;i++){let a=(vals[i-1]+vals[i-2]+vals[i-3])/3,b=(vals[i+1]+vals[i+2]+vals[i+3])/3;if(Math.abs(a-b)>threshold)cand.push(i)}cand=cand.filter((v,i)=>i===0||v-cand[i-1]>5);let pts=vals.map((v,i)=>`${42+i*6.6},${220-v*48}`).join(' ');app.innerHTML=`<div class=\"panel row\"><label class=\"ctrl\">变化阈值 <input id=\"t\" type=\"range\" min=\".5\" max=\"2.5\" step=\".1\" value=\"${threshold}\"><b>${threshold.toFixed(1)}</b></label><span class=\"note\">阈值越低候选越多；模拟钻时单位 min/m</span></div><div class=\"grid\"><section class=\"panel\"><h3>钻时曲线与界面候选</h3><svg viewBox=\"0 0 740 270\"><path d=\"M42 25V225H710\" stroke=\"#ccd2ce\" fill=\"none\"/>${[0,1,2,3,4].map(k=>`<line x1=\"42\" y1=\"${220-k*42}\" x2=\"710\" y2=\"${220-k*42}\" stroke=\"#edf0ed\"/><text x=\"8\" y=\"${224-k*42}\" font-size=\"11\" fill=\"#68747a\">${k}</text>`).join('')}<polyline points=\"${pts}\" fill=\"none\" stroke=\"#41699b\" stroke-width=\"2.5\"/>${cand.map(i=>`<line x1=\"${42+i*6.6}\" y1=\"30\" x2=\"${42+i*6.6}\" y2=\"220\" stroke=\"#b26a39\" stroke-dasharray=\"4 4\"/><circle cx=\"${42+i*6.6}\" cy=\"${220-vals[i]*48}\" r=\"4\" fill=\"#b26a39\"/>`).join('')}<text x=\"45\" y=\"250\" font-size=\"11\" fill=\"#68747a\">深度方向 → · 橙色虚线为变化点候选</text></svg></section><section class=\"panel\"><h3>候选复核摘要</h3><div class=\"cards\"><div class=\"metric\"><b>${cand.length}</b>候选界面</div><div class=\"metric\"><b>${Math.max(0,cand.length-2)}</b>建议优先复核</div></div><p>请核对候选点附近的：</p><ul><li>钻压、转速、排量是否突变</li><li>是否换钻头或停钻</li><li>迟到校正后的岩屑变化</li><li>气测、荧光与邻井层序证据</li></ul><p class=\"note\">仅钻时突变不能证明发生了地层界面变化。</p></section></div>`;document.getElementById('t').oninput=e=>{threshold=+e.target.value;draw()}}draw();\n<\/script></body></html>"};

(function(){
  var meta={"id":"mudlog-report-draft","sceneId":"m5","title":"结构化录井报告辅助生成","version":"1.0.0","updated":"2026-10-23"};
  var tabs={"background":{"label":"专业背景","lede":"综合录井报告汇总井身信息、地层分层、岩屑描述、气测与荧光显示、钻井工况和异常事件等内容。报告撰写需要跨表核对、遵循行业模板，并保证每项结论能追溯到原始记录。NLP 的合理定位是抽取、归并和起草，不是自动创造事实或替工程师签字。","judge":[{"label":"任务","value":"将经过校验的录井结构化记录组织成有出处、可审核的报告初稿。"},{"label":"数据门槛","value":"规范字段"},{"label":"可见收益","value":"减少重复汇编"},{"label":"难度","value":"中"}],"sections":[{"no":1,"en":"PROBLEM","title":"当前做法与问题","html":"<p>信息分散在多张表、曲线和班报中，人工复制汇总耗时且易出现单位、深度、层名和日期不一致。自由生成模型可能补写不存在的数值或把预测性解释说成事实，必须设置来源约束与审核。</p>"},{"no":2,"en":"INTERVENTION","title":"AI 能做什么","html":"<p>先将结构化字段和经过授权的记录映射到报告章节，按模板生成初稿；每句话附数据来源/记录编号，缺字段显示待补，不确定结论使用建议措辞，最后由工程师审核签发。</p><p><b>责任边界：</b>模型输出候选或初稿，专业人员确认并保留最终解释权。</p>"},{"no":3,"en":"DATA","title":"需要准备什么","html":"<p>优先整理同一区块、来源明确且可按井隔离的数据。建议以下数据条件作为试点起点，需结合实际区块规模调整。</p><ul><li><b>结构化井数据</b>：井身、井深、层段、气测/荧光显示、工况事件；标签/用途：字段校验与单位规范，无需语言模型猜测</li><li><b>历史报告与模板</b>：经授权且脱敏的同区块报告、企业模板与术语表；标签/用途：抽取章节结构、术语和格式规范</li><li><b>来源关联</b>：每个字段的表名、记录时间、井深或单据号；标签/用途：报告句子与来源可追溯</li></ul>"},{"no":4,"en":"DIFFICULTY","title":"技术难度与参考方向","html":"<p><b>难度：中。</b>主要挑战包括数据质量、标签一致性与跨井/跨设备泛化。建议先建立简单基线，再用整井或整批留出验证；不要仅报告随机切分的单一准确率。</p><p><b>通用技术方向：</b>信息抽取与字段映射、模板约束生成、检索增强生成、事实核验与引用追踪。</p>"}]},"workflow":{"label":"案例流程","title":"带来源追踪的报告初稿生成","lead":["示意项目：把一口井的结构化分层、显示和工况记录填入固定模板，自动生成可编辑初稿。示例字段与报告内容为虚构教学数据。","评价重点是事实准确、来源可追溯和人工节省时间；文句流畅度排在其后。"],"stats":[["输入来源","结构化记录"],["生成方式","模板约束"],["必备能力","来源追踪"],["最终责任","人工审核签发"]],"steps":[{"name":"字段映射与校验","role":"数据治理","do":"把不同表的井号、深度、单位和枚举值映射到统一数据字典；缺失字段列为待补。","effect":"减少复制错误与口径不一致。","trap":"不要把空值自动补成看似合理的数字。"},{"name":"章节证据组装","role":"信息抽取","do":"按报告模板检索对应层段、气测/荧光和事件记录，为每个事实绑定来源 ID。","effect":"生成前可检查数据是否齐备。","trap":"来源时间或井深冲突时需先解决冲突。"},{"name":"受约束起草","role":"NLP 生成","do":"使用固定模板填充事实字段；结论句只引用已有审核结论，模型不得自行推断产能或储量。","effect":"形成格式一致、易编辑的初稿。","trap":"无出处句子应禁止或醒目标注。"},{"name":"逐项审核与签发","role":"专业审核","do":"按来源链接核对数值、单位、层名和结论；修改内容留痕后由责任人签发。","effect":"把效率收益与责任边界同时保留。","trap":"未经审核的初稿不得作为正式报告。"}],"metrics":{"title":"如何判断方案有效","html":"<ul><li>字段准确率：报告中的井号、深度、数值和单位与源记录一致的比例。</li><li>来源覆盖率：可回溯到有效源记录的事实句比例，目标应接近 100%。</li><li>关键事实错误率：对井深、层段、显示和异常等高风险字段单独统计。</li><li>人工编辑时间与修改率：比较传统撰写与辅助起草，并抽样双人审核。</li></ul><p>所有演示数值均为教学示意，落地前需要用经审核的留出井/留出批次数据重新评估。</p>"},"fails":[{"name":"幻觉或外推","why":"模板只允许填入已有字段，结论句使用审核通过的文本片段。"},{"name":"单位/深度错配","why":"生成前运行字段级校验，报告中显示单位和来源。"},{"name":"模板/术语漂移","why":"模板版本化，术语表随项目受控更新。"}]},"demo":{"label":"交互演示","intro":"编辑示意井数据并生成带来源标记的报告片段；仅演示结构化模板填充，不调用外部模型。","height":680}};

<script>
/* =========================================================
   案例示范宿主 Case Demo Host
   ---------------------------------------------------------
   把「案例包里的示范文件」渲染成可交互的页面。两种模式：

   page    —— 包里有 index.html
              整页放进 sandbox iframe，样式/脚本完全隔离，
              写多复杂都不会污染主站。
   module  —— 包里有 demo.js 但没有 html
              挂进 Shadow DOM 并执行 demo.js，导出的 mount(root, api)
              往里画东西；上传的 CSS 也注入 Shadow DOM，不外泄。

   所有文件都转成 data URL 内联，因此 file:// 直接打开也能跑，
   不依赖本地服务器、不发起任何网络请求。

   对外接口：
     CaseDemoHost.create(container, pkg, ctx) -> { mode, destroy() }
     CaseDemoHost.resolveMode(pkg) -> 'page' | 'module' | 'none'
     pkg = { files:[{name,size,mime,enc,data}], demo:{mode,html,js,height} }
   ========================================================= */

(function (global) {
  'use strict';

  var MIME = {
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
    webp: 'image/webp', svg: 'image/svg+xml', ico: 'image/x-icon', bmp: 'image/bmp',
    mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg',
    mp4: 'video/mp4', webm: 'video/webm',
    woff: 'font/woff', woff2: 'font/woff2', ttf: 'font/ttf', otf: 'font/otf',
    json: 'application/json', csv: 'text/csv', txt: 'text/plain', pdf: 'application/pdf'
  };

  var TEXT_EXT = ['json', 'js', 'mjs', 'css', 'html', 'htm', 'svg', 'txt', 'csv', 'tsv', 'md', 'xml', 'yaml', 'yml', 'geojson'];

  /* Shadow DOM 里要继承的设计令牌 */
  var TOKENS = ['--paper', '--paper-2', '--paper-3', '--card', '--card-soft',
    '--line', '--line-2', '--line-3', '--ink', '--ink-2', '--ink-3', '--ink-4', '--ink-inv',
    '--jade', '--jade-d', '--jade-l', '--clay', '--clay-d', '--clay-l',
    '--ok', '--ok-bg', '--warn', '--warn-bg', '--bad', '--bad-bg',
    '--sans', '--mono', '--r-s', '--r-m', '--r-l', '--sh-1', '--sh-2'];

  var BASE_CSS =
    '.cd-box{display:block;font-family:var(--sans,system-ui,sans-serif);' +
    'font-size:13px;line-height:1.72;color:var(--ink,#242b2e);padding:2px 0 6px}' +
    '.cd-err{border:1px solid var(--bad,#b05a51);background:var(--bad-bg,#f9e9e5);' +
    'color:var(--bad,#b05a51);border-radius:8px;padding:11px 13px;font-size:12px;line-height:1.7}' +
    '.cd-err b{display:block;margin-bottom:4px;font-size:12.5px}' +
    '.cd-err code{font-family:var(--mono,monospace);background:rgba(0,0,0,.05);padding:1px 4px;border-radius:3px}';

  var seq = 0;

  /* ---------------- 小工具 ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function extOf(name) {
    var m = /\.([a-z0-9]+)$/i.exec(String(name).split('?')[0].split('#')[0]);
    return m ? m[1].toLowerCase() : '';
  }
  function baseOf(name) { return String(name).split('/').pop(); }
  function isCss(n) { return extOf(n) === 'css'; }
  function isJs(n) { var e = extOf(n); return e === 'js' || e === 'mjs'; }
  function isHtml(n) { var e = extOf(n); return e === 'html' || e === 'htm'; }
  function isText(n) { return TEXT_EXT.indexOf(extOf(n)) >= 0; }
  function mimeOf(n) { return MIME[extOf(n)] || (isText(n) ? 'text/plain' : 'application/octet-stream'); }

  function findFile(files, ref) {
    if (!ref || !files) return null;
    var r = String(ref).replace(/^\.\//, '').split('?')[0].split('#')[0];
    var i, hit = null;
    for (i = 0; i < files.length; i++) if (files[i].name === r) return files[i];
    var bn = baseOf(r).toLowerCase();
    for (i = 0; i < files.length; i++) if (baseOf(files[i].name).toLowerCase() === bn) return files[i];
    return hit;
  }
  function firstExt(files, test) {
    for (var i = 0; i < (files || []).length; i++) if (test(files[i].name)) return files[i];
    return null;
  }

  /* 文件 → 可直接放进 src/href/url() 的地址 */
  function urlOf(f) {
    if (!f) return '';
    if (f.enc === 'dataurl') return f.data;
    return 'data:' + (f.mime || mimeOf(f.name)) + ';charset=utf-8,' + encodeURIComponent(f.data);
  }

  /* ---------------- 模式判定 ---------------- */
  function resolveMode(pkg) {
    var d = (pkg && pkg.demo) || {};
    var files = (pkg && pkg.files) || [];
    var mode = d.mode || 'auto';
    if (mode === 'builtin' || mode === 'page' || mode === 'module') return mode;
    if (findFile(files, d.html) || firstExt(files, isHtml)) return 'page';
    if (findFile(files, d.js) || firstExt(files, isJs)) return 'module';
    return 'none';
  }

  /* ---------------- page 模式：拼一份自包含 HTML ---------------- */
  function cssText(css, map, files) {
    return String(css)
      .replace(/url\(\s*(["']?)([^"')]+)\1\s*\)/gi, function (all, q, ref) {
        if (/^(data:|https?:|\/\/)/i.test(ref)) return all;
        var f = findFile(files, ref);
        return f ? 'url("' + map[f.name] + '")' : all;
      })
      .replace(/<\/style/gi, '<\\/style');
  }
  function jsText(js) {
    return String(js).replace(/<\/script/gi, '<\\/script');
  }

  function buildPageDoc(pkg, token) {
    var files = pkg.files || [];
    var d = pkg.demo || {};
    var htmlFile = findFile(files, d.html) || firstExt(files, isHtml);
    var html = htmlFile ? String(htmlFile.data)
      : '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><p>包里没有 HTML 文件。</p></body></html>';

    /* 资源表只收"素材"（图片、JSON 等），html/css/js 本身不进去，避免体积翻倍 */
    var map = {};
    files.forEach(function (f) {
      if (isHtml(f.name) || isJs(f.name) || isCss(f.name)) return;
      map[f.name] = urlOf(f);
      if (!map[baseOf(f.name)]) map[baseOf(f.name)] = urlOf(f);
    });

    var used = {};

    /* 1. <link rel=stylesheet> → <style> */
    html = html.replace(/<link\b[^>]*>/gi, function (tag) {
      if (!/stylesheet/i.test(tag)) return tag;
      var m = /href\s*=\s*["']([^"']+)["']/i.exec(tag);
      var f = m && findFile(files, m[1]);
      if (!f || !isCss(f.name)) return tag;
      used[f.name] = 1;
      return '<style data-src="' + esc(m[1]) + '">' + cssText(f.data, map, files) + '</style>';
    });

    /* 2. <script src> → 内联 */
    html = html.replace(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>\s*<\/script\s*>/gi, function (tag, src) {
      var f = findFile(files, src);
      if (!f || !isJs(f.name)) return tag;
      used[f.name] = 1;
      return '<script data-src="' + esc(src) + '">' + jsText(f.data) + '<\/script' + '>';
    });

    /* 3. 其它资源引用 → data URL */
    html = html.replace(/\b(src|href|poster)\s*=\s*["']([^"']+)["']/gi, function (all, attr, ref) {
      if (/^(data:|https?:|mailto:|tel:|#|\/\/)/i.test(ref)) return all;
      var f = findFile(files, ref);
      if (!f || isHtml(f.name) || isJs(f.name) || isCss(f.name)) return all;
      return attr + '="' + map[f.name] + '"';
    });

    /* 4. 未被引用的 css / js 追加到末尾 */
    var tail = '';
    files.forEach(function (f) {
      if (used[f.name] || !isCss(f.name)) return;
      used[f.name] = 1;
      tail += '<style data-src="' + esc(f.name) + '">' + cssText(f.data, map, files) + '</style>';
    });
    files.forEach(function (f) {
      if (used[f.name] || !isJs(f.name)) return;
      used[f.name] = 1;
      tail += '<script data-src="' + esc(f.name) + '">' + jsText(f.data) + '<\/script' + '>';
    });

    /* 5. 注入资源表与高度上报 */
    var assetsJson = JSON.stringify(map).replace(/</g, '\\u003c');
    var head =
      '<script>window.__ASSETS__=' + assetsJson + ';' +
      'window.caseAsset=function(n){return window.__ASSETS__[n]||""};' +
      '(function(){var last=-1;function send(){' +
      'var h=Math.max(document.body?document.body.scrollHeight:0,document.documentElement.scrollHeight);' +
      'h=Math.min(h,4200);if(Math.abs(h-last)>2){last=h;' +
      'try{parent.postMessage({__caseDemo:"' + token + '",h:h},"*")}catch(e){}}}' +
      'document.addEventListener("DOMContentLoaded",send);window.addEventListener("load",send);' +
      'try{if(window.ResizeObserver){new ResizeObserver(send).observe(document.documentElement)}}catch(e){}' +
      'var n=0,t=setInterval(function(){send();if(++n>40)clearInterval(t)},400);' +
      '})();<\/script' + '>';

    if (/<head[^>]*>/i.test(html)) {
      html = html.replace(/<head[^>]*>/i, function (m) { return m + head; });
    } else if (/<html[^>]*>/i.test(html)) {
      html = html.replace(/<html[^>]*>/i, function (m) { return m + '<head><meta charset="utf-8">' + head + '</head>'; });
    } else {
      html = '<!DOCTYPE html><html><head><meta charset="utf-8">' + head + '</head><body>' + html + '</body></html>';
    }

    if (tail) {
      if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, tail + '</body>');
      else html += tail;
    }
    return html;
  }

  function createPage(host, pkg, ctx) {
    var token = 'cd' + (++seq) + Date.now().toString(36);
    var minH = Math.max(220, Number(pkg.demo && pkg.demo.height) || 520);

    var frame = document.createElement('iframe');
    frame.className = 'cd-iframe';
    frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups allow-downloads');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.setAttribute('title', (pkg.meta && pkg.meta.title ? pkg.meta.title : '案例示范') + '（沙箱）');
    frame.style.height = minH + 'px';
    frame.srcdoc = buildPageDoc(pkg, token);
    host.appendChild(frame);

    function onMsg(e) {
      if (e.source !== frame.contentWindow) return;
      var d = e.data;
      if (!d || d.__caseDemo !== token) return;
      var h = Math.min(6200, Math.max(minH, Number(d.h) + 2));
      frame.style.height = h + 'px';
    }
    global.addEventListener('message', onMsg);

    return {
      mode: 'page',
      destroy: function () {
        global.removeEventListener('message', onMsg);
        frame.remove();
      }
    };
  }

  /* ---------------- module 模式：Shadow DOM + demo.js ---------------- */
  function tokenCss() {
    var cs = global.getComputedStyle(document.documentElement);
    var out = ':host{';
    TOKENS.forEach(function (t) {
      var v = cs.getPropertyValue(t);
      if (v) out += t + ':' + v.trim() + ';';
    });
    return out + '}';
  }

  function errBox(box, title, detail) {
    var d = document.createElement('div');
    d.className = 'cd-err';
    d.innerHTML = '<b>' + esc(title) + '</b>' + esc(detail || '');
    box.appendChild(d);
  }

  function createModule(host, pkg, ctx) {
    var files = pkg.files || [];
    var d = pkg.demo || {};
    var shadow = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;

    var style = document.createElement('style');
    style.textContent = tokenCss() + '\n' + BASE_CSS + '\n' +
      files.filter(function (f) { return isCss(f.name); }).map(function (f) { return String(f.data); }).join('\n');
    shadow.appendChild(style);

    var box = document.createElement('div');
    box.className = 'cd-box';
    shadow.appendChild(box);

    var cleanups = [];
    var api = {
      asset: function (name) { return urlOf(findFile(files, name)); },
      readText: function (name) {
        var f = findFile(files, name);
        return Promise.resolve(f && f.enc === 'text' ? f.data : '');
      },
      list: function () { return files.map(function (f) { return f.name; }); },
      scene: (ctx && ctx.scene) || null,
      kase: (ctx && ctx.kase) || null,
      onDestroy: function (fn) { if (typeof fn === 'function') cleanups.push(fn); },
      height: function (px) { if (px) host.style.minHeight = Number(px) + 'px'; }
    };

    var jsFile = findFile(files, d.js) || firstExt(files, isJs);
    var live = null;

    if (!jsFile) {
      errBox(box, '没有找到 demo.js', '把示范脚本命名为 demo.js 放进包里，或改用 index.html 整页模式。');
    } else {
      var code = String(jsFile.data);
      var mod = { exports: {} };
      var fn = null;
      try {
        fn = new Function('module', 'exports', 'api', 'root', 'console', code + '\n;return module.exports;');
      } catch (e) {
        errBox(box, 'demo.js 有语法错误（第 ' + (e.lineNumber || '?') + ' 行附近）', e.message);
      }
      if (fn) {
        try { delete global.__CASE_MOUNT__; } catch (e) { global.__CASE_MOUNT__ = null; }
        var out = null;
        try {
          out = fn(mod, mod.exports, api, box, global.console) || mod.exports;
        } catch (e) {
          errBox(box, 'demo.js 在加载阶段抛出异常', e.message);
        }
        if (out) {
          var cand = (typeof out.mount === 'function') ? out
            : (out.default && typeof out.default.mount === 'function') ? out.default
              : (typeof global.__CASE_MOUNT__ === 'function') ? { mount: global.__CASE_MOUNT__ }
                : null;
          if (!cand) {
            errBox(box, 'demo.js 没有导出 mount',
              '支持三种写法：module.exports={mount(root,api){}}、exports.mount=function(root,api){}、window.__CASE_MOUNT__=function(root,api){}。');
          } else {
            try {
              live = cand.mount(box, api) || cand;
            } catch (e) {
              errBox(box, 'mount() 执行失败', e.message);
            }
          }
        }
      }
    }

    return {
      mode: 'module',
      destroy: function () {
        try { if (live && typeof live.unmount === 'function') live.unmount(); } catch (e) { }
        cleanups.forEach(function (fn) { try { fn(); } catch (e) { } });
        try { if (shadow.host === host) host.innerHTML = ''; } catch (e) { }
      }
    };
  }

  /* ---------------- 入口 ---------------- */
  function create(container, pkg, ctx) {
    if (!container) return { mode: 'none', destroy: function () { } };
    container.innerHTML = '';
    var mode = resolveMode(pkg);
    if (mode === 'page') return createPage(container, pkg, ctx);
    if (mode === 'module') return createModule(container, pkg, ctx);
    return { mode: 'none', destroy: function () { } };
  }

  global.CaseDemoHost = {
    create: create,
    resolveMode: resolveMode,
    buildPageDoc: buildPageDoc,
    findFile: findFile,
    isText: isText,
    mimeOf: mimeOf
  };

})(window);

</script>
<script>
/* =========================================================
   案例包导入 Case Import（v2：多文件 / 文件夹）
   ---------------------------------------------------------

    '  var N = 240, curve = [];',
    '  var segs = [[60, 9], [92, 7], [48, 11]];',

  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(entries) {
    var enc = new TextEncoder();
    var now = new Date();
    var dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2)) & 0xFFFF;
    var dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

    var locals = [], centrals = [], offset = 0;

    entries.forEach(function (e) {
      var nameBytes = enc.encode(e.name);
      var data = e.binary || enc.encode(e.text || '');
      var crc = crc32(data);

      var lh = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, dosTime, true);
      dv.setUint16(12, dosDate, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);

      var ch = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);

      locals.push(lh, data);
      centrals.push(ch);
      offset += lh.length + data.length;
    });

    var cdSize = centrals.reduce(function (a, c) { return a + c.length; }, 0);
    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    var all = locals.concat(centrals, [eocd]);
    var total = all.reduce(function (a, c) { return a + c.length; }, 0);
    var out = new Uint8Array(total), pos = 0;
    all.forEach(function (c) { out.set(c, pos); pos += c.length; });
    return new Blob([out], { type: 'application/zip' });
  }
