<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>石油勘探开发的智能化可能性地图</title>
<meta name="description" content="按石油作业链条逐环节展示可被深度学习改造的候选场景，标注 AI 介入点、数据条件与难度等级；带可运行的案例示范。">

<style>
/* =========================================================
   设计令牌 Design Tokens
   风格：暖白纸面 + 低饱和彩色分区
   规则：所有颜色只在这里定义，案例与组件不得写死色值
   ========================================================= */

:root{
  /* ---------- 画布 ---------- */
  --paper:      #fbfaf6;   /* 主背景，暖白 */
  --paper-2:    #f5f2ea;   /* 次级底板 */
  --paper-3:    #efece1;   /* 三级底板 */
  --card:       #ffffff;   /* 卡片 */
  --card-soft:  #fdfcf9;   /* 卡片内嵌区 */

  /* ---------- 描边 ---------- */
  --line:       #e9e4d8;
  --line-2:     #ddd7c8;
  --line-3:     #c9c2b0;

  /* ---------- 墨色（文字） ---------- */
  --ink:        #242b2e;
  --ink-2:      #4d565b;
  --ink-3:      #79828a;
  --ink-4:      #9ba3a9;
  --ink-inv:    #fdfcf9;

  /* ---------- 主强调 ---------- */
  --jade:       #2f7d6b;
  --jade-d:     #235f51;
  --jade-l:     #e6f1ec;
  --clay:       #b26a39;
  --clay-d:     #8e5229;
  --clay-l:     #f8ecdf;

  /* ---------- 五类方法色（中饱和，白底可读） ---------- */
  --c-cv:       #2f7d6b;   /* 计算机视觉 */
  --c-ts:       #b26a39;   /* 时序预测 */
  --c-nlp:      #7e5a8d;   /* 自然语言处理 */
  --c-opt:      #41699b;   /* 优化算法 */
  --c-kg:       #767a2e;   /* 知识图谱 */

  --bg-cv:      #e6f1ec;
  --bg-ts:      #f8ecdf;
  --bg-nlp:     #efe9f4;
  --bg-opt:     #e7eef9;
  --bg-kg:      #f1f1dd;

  /* ---------- 语义色 ---------- */
  --ok:         #3f8560;
  --ok-bg:      #e7f3ea;
  --warn:       #a97a1c;
  --warn-bg:    #f9efd7;
  --bad:        #b05a51;
  --bad-bg:     #f9e9e5;

  /* ---------- 圆角与阴影 ---------- */
  --r-s: 5px;
  --r-m: 9px;
  --r-l: 14px;
  --r-xl: 20px;

  --sh-1: 0 1px 2px rgba(48,44,30,.045);
  --sh-2: 0 1px 2px rgba(48,44,30,.05), 0 6px 18px -10px rgba(48,44,30,.14);
  --sh-3: 0 2px 4px rgba(48,44,30,.05), 0 14px 34px -16px rgba(48,44,30,.20);

  /* ---------- 字体 ---------- */
  --mono: 'JetBrains Mono','SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',monospace;
  --sans: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',
          'PingFang SC','Hiragino Sans GB','Microsoft YaHei UI','Microsoft YaHei',sans-serif;

  /* ---------- 布局 ---------- */
  --nav-h: 54px;
  --maxw: 1180px;
  --sp-1: 6px;  --sp-2: 10px;  --sp-3: 14px;
  --sp-4: 20px; --sp-5: 28px;  --sp-6: 40px;
}

/* =========================================================
   Reset
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.68;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}

/* 背景：四处低饱和色晕，制造“纸面有光”的感觉，不做暗色 */
body::before{
  content:'';
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(1000px 620px at 6% -12%,  #e5f1eb 0%, rgba(229,241,235,0) 62%),
    radial-gradient(880px 560px at 96% -6%,   #f9ecdf 0%, rgba(249,236,223,0) 60%),
    radial-gradient(900px 760px at 74% 102%,  #e8eef8 0%, rgba(232,238,248,0) 62%),
    radial-gradient(760px 620px at 18% 96%,   #f7ebee 0%, rgba(247,235,238,0) 60%),
    var(--paper);
}
/* 极淡网格，只在上半页可见 */
body::after{
  content:'';
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(80,74,55,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(80,74,55,.055) 1px, transparent 1px);
  background-size:76px 76px;
  mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 0%, transparent 82%);
  -webkit-mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 0%, transparent 82%);
}

a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
img,svg{max-width:100%}
::selection{background:rgba(47,125,107,.20);color:var(--ink)}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--paper-2)}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:3px solid var(--paper-2)}
::-webkit-scrollbar-thumb:hover{background:var(--line-3)}

:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:3px}

/* =========================================================
   排版基元
   ========================================================= */
h1,h2,h3,h4,h5{font-weight:650;letter-spacing:-.005em;line-height:1.3;color:var(--ink)}
p{color:var(--ink-2)}
b,strong{font-weight:650;color:var(--ink)}

.wrap{width:min(var(--maxw),calc(100% - 48px));margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--jade-d);display:inline-flex;align-items:center;gap:9px;
}
.kicker::before{content:'';width:20px;height:1.5px;background:currentColor;opacity:.55;border-radius:2px}
.kicker.plain::before{display:none}
.kicker.clay{color:var(--clay-d)}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);
}

.lede{font-size:13.5px;line-height:1.8;color:var(--ink-2)}

/* 工具类 */
.muted{color:var(--ink-3)}
.small{font-size:12px}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--line);border:0;margin:0}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}

/* 动效：轻微上浮，不做夸张动画 */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
.d1{animation-delay:.03s}.d2{animation-delay:.06s}.d3{animation-delay:.09s}.d4{animation-delay:.12s}.d5{animation-delay:.15s}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

</style>
<style>
/* =========================================================
   布局层：导航 / 页头 / 章节 / 链条 / 页脚
   ========================================================= */

/* ---------------- 顶部导航 ---------------- */
.hdr{
  position:sticky;top:0;z-index:60;
  background:rgba(251,250,246,.82);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--line);
}
.hdr-in{
  width:min(var(--maxw),calc(100% - 44px));margin:0 auto;
  height:var(--nav-h);display:flex;align-items:center;gap:24px;
}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(148deg,var(--jade) 0%, #3f9a83 55%, var(--clay) 140%);
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 1px 2px rgba(47,125,107,.28), 0 6px 14px -8px rgba(47,125,107,.5);
}
.brand-mark svg{display:block}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-size:14px;font-weight:650;letter-spacing:.01em;color:var(--ink)}
.brand-txt span{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;color:var(--ink-4);
  text-transform:uppercase;margin-top:3px;
}

.nav{display:flex;align-items:center;gap:1px;margin-left:auto}
.nav a{
  position:relative;padding:7px 11px;border-radius:6px;font-size:13px;color:var(--ink-2);
  transition:color .16s,background .16s;white-space:nowrap;
}
.nav a:hover{color:var(--ink);background:rgba(47,125,107,.07)}
.nav a.on{color:var(--jade-d);font-weight:600}
.nav a.on::after{
  content:'';position:absolute;left:11px;right:11px;bottom:-2px;height:2px;
  background:var(--jade);border-radius:2px;
}
.nav .nav-sep{width:1px;height:16px;background:var(--line-2);margin:0 8px}

/* ---------------- 章节 ---------------- */
.section{padding:38px 0}
.section.tight{padding:26px 0}
.section + .section{border-top:0}
/* 章节头：标高尺 + 编号徽标 + 全宽标题，像技术文档的章节分隔 */
.sec-head{border-top:1px solid var(--line-2);padding-top:9px;margin-bottom:16px}
.sec-rail{display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:20px}
.sec-num{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--jade-d);
  padding:1px 6px;border:1px solid rgba(47,125,107,.26);border-radius:4px;
  background:var(--jade-l);line-height:1.5;
}
.sec-rail .kicker::before{display:none}
.sec-rail .kicker{font-size:9px;letter-spacing:.16em}
.sec-rail .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.sec-head h2{font-size:clamp(17px,1.75vw,20px);letter-spacing:-.012em}
.sec-head p{color:var(--ink-3);font-size:12.5px;max-width:82ch;margin-top:3px;line-height:1.62}

/* ---------------- HERO ---------------- */
.hero{padding:34px 0 0;position:relative}
.hero-grid{
  display:grid;grid-template-columns:minmax(0,1fr) 372px;
  gap:52px;align-items:start;padding-bottom:6px;
}
.hero-main{min-width:0}
.hero-top{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.hero-badge{
  font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--jade-d);
  background:var(--jade-l);border:1px solid rgba(47,125,107,.22);
  padding:3px 9px;border-radius:100px;
}
.hero-badge.alt{background:var(--paper-2);border-color:var(--line-2);color:var(--ink-3)}

.hero h1{
  font-size:clamp(28px,3.3vw,42px);
  line-height:1.14;font-weight:680;letter-spacing:-.024em;
  max-width:20ch;
}
.hero h1 em{
  font-style:normal;position:relative;white-space:nowrap;
  color:var(--jade-d);
}
.hero h1 em::after{
  content:'';position:absolute;left:-2px;right:-2px;bottom:.08em;height:.2em;
  background:linear-gradient(90deg, rgba(47,125,107,.16), rgba(178,106,57,.16));
  border-radius:3px;z-index:-1;
}
.hero-lead{
  margin-top:16px;max-width:60ch;font-size:13.5px;
  color:var(--ink-2);line-height:1.8;
}
.hero-note{
  margin-top:16px;display:flex;gap:11px;align-items:flex-start;
  padding:10px 14px;border-left:2.5px solid var(--clay);
  background:linear-gradient(90deg, rgba(178,106,57,.07), rgba(178,106,57,0) 72%);
  border-radius:0 7px 7px 0;max-width:none;
}
.hero-note b{color:var(--ink);font-weight:650}
.hero-note p{font-size:12px;color:var(--ink-3);line-height:1.65}
.hero-acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

/* 速览面板 */
.spec{
  border:1px solid var(--line-2);border-radius:11px;background:var(--card);
  box-shadow:var(--sh-2);overflow:hidden;position:relative;
}
.spec::before{
  content:'';position:absolute;left:0;top:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--jade) 0%, #4f9a86 52%, var(--clay) 100%);
}
.spec-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 15px;border-bottom:1px solid var(--line);background:var(--card-soft);
  font-size:8.5px;letter-spacing:.13em;color:var(--ink-4);margin-top:3px;
}
.spec-body{padding:0 15px}
.spec-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--line);
}
.spec-body:last-of-type .spec-row:last-child{border-bottom:0}
.spec-row .k{font-size:11.5px;color:var(--ink-3)}
.spec-row .v{font-family:var(--mono);font-size:16px;color:var(--ink);line-height:1;white-space:nowrap}
.spec-row .v small{font-size:9px;color:var(--ink-4);margin:0 5px 0 2px;font-family:var(--sans);letter-spacing:0}
.spec-row .v small:last-child{margin-right:0}
.spec-bar{display:flex;height:4px;margin:0 15px 6px;border-radius:2px;overflow:hidden;background:var(--line)}
.spec-bar i{display:block;height:100%}
.spec-sub{padding:9px 15px 0;border-top:1px solid var(--line);font-size:8.5px;letter-spacing:.13em;color:var(--ink-4)}
.comp{padding:7px 15px 0}
.comp-bar{display:flex;height:7px;border-radius:3px;overflow:hidden;gap:2px}
.comp-bar i{display:block;height:100%}
.comp-legend{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-top:7px}
.comp-legend a{
  display:flex;align-items:center;gap:5px;padding:3px 0;
  font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.04em;
  border-bottom:1px solid var(--line);transition:color .15s;
}
.comp-legend a:hover{color:var(--jade-d)}
.comp-legend i{width:6px;height:6px;border-radius:1px;display:block;flex-shrink:0}
.comp-legend b{margin-left:auto;color:var(--ink);font-weight:500}
.spec-f{
  display:flex;justify-content:space-between;gap:10px;margin-top:11px;
  padding:8px 15px;border-top:1px solid var(--line);background:var(--card-soft);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--ink-4);
}

/* ---------------- 链条 ---------------- */
.chain-wrap{position:relative}
.chain-scroll{overflow-x:auto;padding:0 0 8px;margin:0 -6px}
.chain-scroll::-webkit-scrollbar{height:6px}
.chain{
  display:grid;grid-template-columns:repeat(13,minmax(80px,1fr));
  gap:4px;position:relative;padding-top:22px;min-width:1020px;
}
.chain::before{
  content:'';position:absolute;left:6px;right:6px;top:8px;height:1px;
  background:linear-gradient(90deg,rgba(47,125,107,.10),var(--line-3) 6%,var(--line-2) 94%,rgba(178,106,57,.16));
}
.step{
  position:relative;display:block;padding:11px 9px 10px;border-radius:8px;
  border:1px solid transparent;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s;
}
.step::before{
  content:'';position:absolute;top:-17px;left:17px;width:6px;height:6px;border-radius:50%;
  background:var(--card);border:1.5px solid var(--line-3);transition:all .18s;
}
.step:hover{background:var(--card);border-color:var(--line);box-shadow:var(--sh-2);transform:translateY(-2px)}
.step:hover::before{background:var(--jade);border-color:var(--jade);box-shadow:0 0 0 4px rgba(47,125,107,.13)}
.step-idx{font-family:var(--mono);font-size:8.5px;color:var(--ink-4);letter-spacing:.1em}
.step-name{font-size:12px;margin-top:3px;letter-spacing:.01em;line-height:1.3;font-weight:600;color:var(--ink)}
.step-n{font-family:var(--mono);font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1}
.step-n span{font-size:8.5px;color:var(--ink-4);margin-left:3px;font-family:var(--sans)}
.step-bar{display:flex;gap:2px;margin-top:6px;height:3px}
.step-bar i{flex:1;border-radius:2px;background:var(--c,var(--line-2));opacity:.9;min-width:2px}
.step-bar i.empty{background:var(--line-2);opacity:1}

.chain-hint{
  display:flex;align-items:center;gap:8px;margin-top:9px;
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-4);
}

/* ---------------- 页脚 ---------------- */
.ftr{border-top:1px solid var(--line-2);padding:30px 0 36px;margin-top:0;background:rgba(245,242,234,.55)}
.ftr-in{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
.ftr-col h5{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:11px;font-weight:400;
}
.ftr-col p,.ftr-col a{font-size:11.5px;color:var(--ink-3);display:block;line-height:1.9}
.ftr-col a:hover{color:var(--jade-d)}
.ftr-bot{
  margin-top:22px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-4);
}

/* ---------------- 面包屑 ---------------- */
.crumb{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-4);padding:14px 0 0;flex-wrap:wrap}
.crumb a{color:var(--ink-3);transition:color .16s}
.crumb a:hover{color:var(--jade-d)}
.crumb .sep{color:var(--line-3)}
.crumb .cur{color:var(--ink-2)}

/* ---------------- 页头 ---------------- */
.page-head{padding:14px 0 18px}
.ph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:26px;flex-wrap:wrap}
.ph-idx{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--ink-4);margin-bottom:7px}
.ph-idx b{color:var(--jade);font-weight:500}
.page-head h1{font-size:clamp(22px,2.6vw,30px);letter-spacing:-.016em;line-height:1.2}
.page-head h1 .en{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:var(--ink-4);text-transform:uppercase;margin-top:7px;font-weight:400;
}
.page-head .blurb{margin-top:10px;max-width:70ch;color:var(--ink-2);font-size:12.8px;line-height:1.75}
.ph-stat{display:flex;gap:22px;flex-shrink:0;padding-top:6px}
.ph-stat div{text-align:right}
.ph-stat .n{font-family:var(--mono);font-size:20px;line-height:1;color:var(--ink)}
.ph-stat .l{font-size:10px;color:var(--ink-4);margin-top:5px;letter-spacing:.05em}

/* ---------------- 响应式 ---------------- */
@media (max-width:1080px){
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:26px}
  .hero h1{max-width:none}
  .spec{max-width:520px}
}
@media (max-width:760px){
  .wrap,.hdr-in{width:calc(100% - 32px)}
  .section{padding:30px 0}
  .hero{padding:24px 0 0}
  .hero h1{max-width:none}
  .nav a:not(.nav-keep){display:none}
  .nav .nav-sep{display:none}
  .sec-head{flex-direction:column;align-items:flex-start;gap:8px}
  .ftr-in{gap:26px}
}

</style>
<style>
/* =========================================================
   组件层：标签 / 卡片 / 表格 / 四段式 / 流程 / 示范 / 控制台
   ========================================================= */

/* ---------------- 标签 ---------------- */
.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  padding:3px 8px;border-radius:5px;border:1px solid var(--line-2);
  color:var(--ink-3);background:var(--card-soft);white-space:nowrap;
}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}

.mtag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
  padding:2px 7px;border-radius:5px;
  color:var(--mc,var(--ink-3));
  border:1px solid color-mix(in srgb, var(--mc,var(--line-3)) 26%, transparent);
  background:color-mix(in srgb, var(--mc,var(--line-3)) 8%, var(--card));
  white-space:nowrap;
}
.mtag b{font-weight:600}
.mtag[data-m="cv"]{--mc:var(--c-cv)}
.mtag[data-m="ts"]{--mc:var(--c-ts)}
.mtag[data-m="nlp"]{--mc:var(--c-nlp)}
.mtag[data-m="opt"]{--mc:var(--c-opt)}
.mtag[data-m="kg"]{--mc:var(--c-kg)}

.dtag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
  padding:2px 8px;border-radius:5px;border:1px solid;
}
.dtag[data-d="低"]{color:var(--ok);border-color:rgba(63,133,96,.28);background:var(--ok-bg)}
.dtag[data-d="中"]{color:var(--warn);border-color:rgba(169,122,28,.28);background:var(--warn-bg)}
.dtag[data-d="高"]{color:var(--bad);border-color:rgba(176,90,81,.28);background:var(--bad-bg)}
.dtag::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}

.badge-ready{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  padding:3px 8px;border-radius:4px;font-weight:600;
  color:var(--jade-d);background:var(--jade-l);border:1px solid rgba(47,125,107,.22);
}
.badge-ready::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--jade)}
.badge-draft{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  padding:3px 8px;border-radius:4px;
  color:var(--warn);background:var(--warn-bg);border:1px solid rgba(169,122,28,.24);
}
.badge-wip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  padding:3px 8px;border-radius:4px;color:var(--ink-3);
  background:var(--paper-2);border:1px dashed var(--line-2);
}

/* ---------------- 按钮 ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:7px;font-size:13px;font-weight:500;
  border:1px solid var(--line-2);color:var(--ink);
  background:var(--card);
  transition:background .16s,border-color .16s,box-shadow .16s,transform .16s;
  cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--card-soft);border-color:var(--line-3);box-shadow:var(--sh-1)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--ink-inv);font-weight:600}
.btn.primary:hover{background:var(--jade-d);border-color:var(--jade-d);box-shadow:0 4px 12px -4px rgba(47,125,107,.45)}
.btn.clay{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.clay:hover{background:var(--clay-d);border-color:var(--clay-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn.ghost:hover{color:var(--ink);background:rgba(80,74,55,.06);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:6px}
.btn .ar{font-family:var(--mono);font-size:10px;opacity:.55}

/* ---------------- 卡片 ---------------- */
.card{
  border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--card);box-shadow:var(--sh-1);
}
.card-pad{padding:16px 18px}

/* 方法面板：五格一体式，靠细线分隔，不再用浮起的卡片 */
.methods{
  display:grid;grid-template-columns:repeat(5,1fr);
  border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;
  background:var(--card);box-shadow:var(--sh-1);
}
.mcard{
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
  padding:15px 15px 13px;border:0;border-left:1px solid var(--line);border-radius:0;
  background:var(--card);box-shadow:none;
  transition:background .16s;
}
.mcard:first-child{border-left:0}
.mcard::before{
  content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--mc);
  opacity:1;
}
.mcard:hover{background:var(--card-soft)}
.mcard .abbr{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;color:var(--mc);
  display:flex;align-items:center;justify-content:space-between;
}
.mcard .abbr b{font-size:13px;font-weight:650;letter-spacing:.05em}
.mcard .abbr span{font-size:8.5px;color:var(--ink-4);letter-spacing:.05em}
.mcard .nm{font-size:13px;font-weight:650;margin-top:-1px}
.mcard .ds{font-size:11px;line-height:1.6;color:var(--ink-3);flex:1}
.mcard .cnt{
  font-family:var(--mono);font-size:10px;color:var(--ink-3);
  border-top:1px solid var(--line);padding-top:7px;display:flex;align-items:baseline;gap:5px;
}
.mcard .cnt b{font-size:13.5px;color:var(--ink);font-weight:500}
.mcard[data-m="cv"]{--mc:var(--c-cv)}
.mcard[data-m="ts"]{--mc:var(--c-ts)}
.mcard[data-m="nlp"]{--mc:var(--c-nlp)}
.mcard[data-m="opt"]{--mc:var(--c-opt)}
.mcard[data-m="kg"]{--mc:var(--c-kg)}

/* ---------------- 矩阵 ---------------- */
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);box-shadow:var(--sh-1)}
table.matrix{border-collapse:collapse;width:100%;min-width:680px}
table.matrix th,table.matrix td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.matrix thead th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-4);font-weight:400;padding:10px 6px;background:var(--card-soft);
}
table.matrix thead th:first-child{text-align:left;padding-left:16px;width:158px}
table.matrix tbody th{
  text-align:left;padding-left:16px;font-weight:500;font-size:12.5px;color:var(--ink-2);
  white-space:nowrap;background:var(--card);position:sticky;left:0;z-index:2;
}
table.matrix tbody th i{font-family:var(--mono);font-size:9px;color:var(--ink-4);font-style:normal;margin-right:8px}
table.matrix td{height:30px;background:var(--card)}
table.matrix td a{
  display:flex;align-items:center;justify-content:center;height:30px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-2);transition:all .14s;
}
table.matrix td a:hover{color:#fff;background:var(--jade);font-weight:600}
table.matrix td.zero a{color:var(--line-3)}
table.matrix tfoot td,table.matrix tfoot th{
  font-family:var(--mono);font-size:10px;color:var(--ink-3);padding:9px 6px;border-bottom:0;background:var(--card-soft);
}
table.matrix tfoot th{text-align:left;padding-left:16px;font-size:9.5px;letter-spacing:.09em}

.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:12px}
.legend .k{display:flex;align-items:center;gap:6px}
.legend .k i{width:10px;height:10px;border-radius:2px;display:block}

/* ---------------- 字段说明 ---------------- */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.field{background:var(--card);padding:14px 16px 16px}
.field .fx{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--ink-4);margin-bottom:7px}
.field h4{font-size:13px;margin-bottom:5px}
.field p{font-size:11.8px;color:var(--ink-3);line-height:1.65}
.field p b{color:var(--ink-2);font-weight:600}

/* ---------------- 环节页：筛选 ---------------- */
.filters{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:10px 0;border-bottom:1px solid var(--line);position:sticky;top:var(--nav-h);
  background:rgba(251,250,246,.92);backdrop-filter:blur(10px);z-index:20;
}
.filters .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--ink-4);margin-right:2px}
.chip{
  font-size:12px;padding:5px 11px;border-radius:100px;border:1px solid var(--line-2);
  color:var(--ink-2);transition:all .15s;background:var(--card);white-space:nowrap;
}
.chip:hover{border-color:var(--line-3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ink-inv);font-weight:500}
.chip.on[data-m]{background:var(--mc);border-color:var(--mc);color:#fff}
.chip[data-m="cv"]{--mc:var(--c-cv)}
.chip[data-m="ts"]{--mc:var(--c-ts)}
.chip[data-m="nlp"]{--mc:var(--c-nlp)}
.chip[data-m="opt"]{--mc:var(--c-opt)}
.chip[data-m="kg"]{--mc:var(--c-kg)}
.filters .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.filters .divider{width:1px;height:16px;background:var(--line-2);margin:0 5px}

/* ---------------- 场景列表 ---------------- */
.scenes{padding:4px 0 28px}
.scene-row{
  display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:start;
  padding:13px 12px 13px 6px;border-bottom:1px solid var(--line);
  transition:background .16s,padding .16s;position:relative;
}
.scene-row::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--jade);
  transform:scaleY(0);transform-origin:center;transition:transform .2s;border-radius:2px;
}
.scene-row:hover{background:rgba(255,255,255,.7);padding-left:13px}
.scene-row:hover::before{transform:scaleY(.6)}
.sr-n{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);padding-top:4px;letter-spacing:.07em}
.sr-name{font-size:14.5px;font-weight:650;letter-spacing:.003em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sr-name .arrow{color:var(--ink-4);font-size:12px;transition:transform .18s,color .18s}
.scene-row:hover .sr-name .arrow{transform:translateX(3px);color:var(--jade)}
.sr-point{font-size:12.2px;color:var(--ink-3);line-height:1.62;margin-top:4px;max-width:80ch}
.sr-meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.sr-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-top:3px}
.scene-row.is-ext .sr-name{font-weight:600;color:var(--ink-2)}
.scene-row.is-ext .sr-point{color:var(--ink-4)}

.empty{padding:54px 0;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:6px;font-weight:600}

.pager{display:flex;justify-content:space-between;gap:14px;padding:18px 0 44px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{
  display:flex;flex-direction:column;gap:4px;padding:11px 15px;border:1px solid var(--line);
  border-radius:8px;min-width:180px;background:var(--card);transition:border-color .16s,box-shadow .16s;
}
.pager a:hover{border-color:var(--line-3);box-shadow:var(--sh-1)}
.pager .dir{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--ink-4)}
.pager .nm{font-size:13.5px}
.pager a.next{text-align:right;margin-left:auto}

/* ---------------- 方法页 ---------------- */
.method-group{border-bottom:1px solid var(--line)}
.mg-head{
  display:flex;align-items:baseline;gap:12px;padding:15px 0 8px;
  position:sticky;top:var(--nav-h);background:rgba(251,250,246,.93);backdrop-filter:blur(10px);z-index:10;
}
.mg-head .idx{font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.mg-head h3{font-size:14.5px}
.mg-head .cnt{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);margin-left:auto}
.mg-list{padding-bottom:5px}
.mrow{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  padding:10px 12px 10px 4px;border-bottom:1px solid var(--line);
  transition:background .15s,padding .15s;
}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:rgba(255,255,255,.7);padding-left:11px}
.mrow .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.mrow .pt{font-size:11.4px;color:var(--ink-4);margin-top:2px;line-height:1.55}
.mrow .rt{display:flex;align-items:center;gap:7px}

/* ---------------- 详情页 ---------------- */
.detail-head{padding:12px 0 0}
.dh-kicker{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dh-title{font-size:clamp(22px,2.8vw,32px);letter-spacing:-.018em;line-height:1.18}
.dh-sub{margin-top:10px;color:var(--ink-2);font-size:12.8px;line-height:1.75;max-width:80ch}
.dh-tags{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}

.tabs{
  display:flex;gap:0;margin-top:16px;border-bottom:1px solid var(--line-2);
  position:sticky;top:var(--nav-h);z-index:30;
  background:rgba(251,250,246,.94);backdrop-filter:blur(12px);
  overflow-x:auto;
}
.tab{
  padding:10px 16px;font-size:12.5px;color:var(--ink-3);border-bottom:2px solid transparent;
  transition:color .16s,border-color .16s;white-space:nowrap;display:flex;align-items:center;gap:7px;
  font-weight:500;
}
.tab:hover{color:var(--ink)}
.tab .num{font-family:var(--mono);font-size:8.5px;color:var(--ink-4);letter-spacing:.1em}
.tab.on{color:var(--jade-d);border-color:var(--jade);font-weight:600}
.tab.on .num{color:var(--jade)}

.panel{display:none;padding:4px 0 42px}
.panel.on{display:block;animation:rise .3s ease both}

/* 30 秒判断 */
.judge{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:18px 0 2px;
  box-shadow:var(--sh-1);
}
.judge .jc{background:var(--card);padding:12px 14px}
.judge .jl{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--ink-4);margin-bottom:6px}
.judge .jv{font-size:13px;font-weight:650;display:flex;align-items:center;gap:6px}
.judge .jd{font-size:10.8px;color:var(--ink-3);margin-top:4px;line-height:1.55}

/* 四段式 */
.lede-block{padding:18px 0 2px}
.lede-block p{margin-top:8px;font-size:13.2px;line-height:1.82;color:var(--ink-2);max-width:88ch}
.sec4{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--line)}
.sec4:first-of-type{border-top:0}
.sec4 .sn{font-family:var(--mono);font-size:10.5px;color:var(--jade);letter-spacing:.08em;padding-top:2px}
.sec4 .sn span{display:block;color:var(--ink-4);margin-top:6px;font-size:8.5px;letter-spacing:.07em}
.sec4 h3{font-size:16px;margin-bottom:8px}
.sec4 p{font-size:13px;color:var(--ink-2);line-height:1.82;max-width:86ch}
.sec4 p + p{margin-top:8px}
.sec4-body{min-width:0}

/* 图 */
.figure{
  margin:14px 0 4px;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--card);padding:12px;overflow:hidden;box-shadow:var(--sh-1);
}
.figure svg{display:block;width:100%;height:auto}
.figcap{
  display:flex;gap:8px;font-size:10.5px;color:var(--ink-4);margin-top:9px;
  padding-top:8px;border-top:1px solid var(--line);line-height:1.6;
}
.figcap b{color:var(--ink-3);font-weight:600;flex-shrink:0;font-family:var(--mono);font-size:9px;letter-spacing:.06em}

/* 数据清单 */
.checklist{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--card);box-shadow:var(--sh-1)}
.cl-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:11px 15px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-3);
  background:var(--card-soft);
}
.cl-prog{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px}
.cl-bar{width:96px;height:3px;background:var(--line-2);border-radius:2px;overflow:hidden}
.cl-bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.cl-item{
  display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:start;
  padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;
}
.cl-item:last-child{border-bottom:0}
.cl-item:hover{background:var(--card-soft)}
.cl-box{
  width:16px;height:16px;border:1.5px solid var(--line-3);border-radius:4px;margin-top:3px;
  display:grid;place-items:center;transition:all .15s;flex-shrink:0;background:var(--card);
}
.cl-box svg{opacity:0;transition:opacity .15s}
.cl-item.done .cl-box{background:var(--jade);border-color:var(--jade)}
.cl-item.done .cl-box svg{opacity:1}
.cl-item.done .cl-t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.cl-t{font-size:12.8px;line-height:1.6;font-weight:500}
.cl-s{font-size:11.3px;color:var(--ink-4);margin-top:3px;line-height:1.6}
.cl-n{font-family:var(--mono);font-size:9px;color:var(--ink-4);letter-spacing:.05em;text-align:right;padding-top:4px;max-width:230px}

/* 难度与参考 */
.meter{display:flex;gap:4px;margin:5px 0 14px;max-width:260px}
.meter i{height:5px;flex:1;background:var(--line-2);border-radius:2px}
.meter i.on{background:var(--jade)}
.meter i.on.hi{background:var(--bad)}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.ref{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;
  border:1px solid var(--line-2);border-radius:100px;color:var(--ink-2);
  transition:all .15s;background:var(--card);
}
.ref:hover{border-color:var(--jade);color:var(--jade-d);background:var(--jade-l)}
.ref .ar{font-size:9px;opacity:.5}

/* 表格 */
.dtable{width:100%;border-collapse:collapse;margin-top:13px;font-size:12.3px}
.dtable th{
  text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--ink-4);
  font-weight:400;padding:7px 12px 7px 0;border-bottom:1px solid var(--line-2);
}
.dtable td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;line-height:1.65}
.dtable td:first-child{color:var(--ink);white-space:nowrap;padding-right:16px;font-weight:500}
.dtable tr:last-child td{border-bottom:0}

/* 相关场景 */
.related{margin-top:4px;border-top:1px solid var(--line);padding-top:22px}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-top:11px}
.rel-col{background:var(--card);padding:13px 16px}
.rel-col h5{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--ink-4);margin-bottom:8px;font-weight:400}
.rel-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.rel-item:last-child{border-bottom:0}
.rel-item:hover .nm{color:var(--jade-d)}
.rel-item .nm{transition:color .15s;font-weight:500}
.rel-item .go{font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}

/* ---------------- 待接入（没有案例的场景） ---------------- */
.pending{
  margin:26px 0 0;border:1px solid var(--line);border-radius:var(--r-l);
  background:
    radial-gradient(620px 220px at 8% 0%, rgba(47,125,107,.06), transparent 72%),
    var(--card);
  padding:24px 26px;box-shadow:var(--sh-1);
}
.pending-top{display:flex;align-items:center;gap:11px;margin-bottom:11px;flex-wrap:wrap}
.pending h3{font-size:16.5px}
.pending p{font-size:12.8px;color:var(--ink-2);line-height:1.78;max-width:74ch}
.pending-actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
.pending-lines{display:flex;flex-direction:column;gap:8px;margin-top:16px;max-width:480px}
.pending-line{
  height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--line-2),transparent);
  animation:pulse 2.6s ease-in-out infinite;
}
.pending-line:nth-child(2){width:84%;animation-delay:.2s}
.pending-line:nth-child(3){width:58%;animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}

/* ---------------- 案例流程 ---------------- */
.case-lead{display:grid;grid-template-columns:1.12fr .88fr;gap:26px;align-items:start;padding:20px 0 4px}
.case-lead h3{font-size:17px;margin-bottom:8px}
.case-lead p{font-size:12.8px;color:var(--ink-2);line-height:1.8}
.case-cells{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sh-1)}
.case-cells div{background:var(--card);padding:11px 13px}
.case-cells .l{font-family:var(--mono);font-size:8px;letter-spacing:.11em;color:var(--ink-4)}
.case-cells .v{font-size:12.8px;margin-top:4px;font-weight:500;color:var(--ink)}
.case-cells .v b{font-family:var(--mono);font-size:15px;color:var(--jade-d);font-weight:500}

.pipeline{position:relative;margin:18px 0 4px}
.pstep{display:grid;grid-template-columns:46px 1fr;gap:16px;padding:0 0 16px;position:relative}
.pstep::before{
  content:'';position:absolute;left:22px;top:42px;bottom:0;width:1px;
  background:linear-gradient(180deg,var(--line-2),var(--line));
}
.pstep:last-child::before{display:none}
.pstep .pn{
  width:46px;height:46px;border-radius:10px;border:1px solid var(--line-2);
  display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;color:var(--jade-d);
  background:var(--card);position:relative;z-index:1;
  transition:border-color .18s, box-shadow .18s;box-shadow:var(--sh-1);font-weight:500;
}
.pstep:hover .pn{border-color:var(--jade);box-shadow:0 0 0 4px rgba(47,125,107,.08)}
.pstep .pc{
  border:1px solid var(--line);border-radius:var(--r-m);padding:12px 15px;
  background:var(--card);transition:border-color .18s,box-shadow .18s;box-shadow:var(--sh-1);
}
.pstep:hover .pc{border-color:var(--line-2);box-shadow:var(--sh-2)}
.pstep h4{font-size:13.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pstep h4 .role{
  font-family:var(--mono);font-size:8px;letter-spacing:.11em;color:var(--ink-4);
  border:1px solid var(--line-2);padding:1px 6px;border-radius:3px;font-weight:400;
}
.pstep .pdo{font-size:12.2px;color:var(--ink-2);line-height:1.7;margin-top:6px}
.pstep .peff{
  margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
  display:flex;align-items:flex-start;gap:8px;font-size:11.2px;color:var(--ink-3);line-height:1.6;
}
.pstep .peff .k{font-family:var(--mono);font-size:8px;letter-spacing:.09em;color:var(--ok);flex-shrink:0;padding-top:2px}

.fails{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.fail{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 13px;background:var(--card);box-shadow:var(--sh-1)}
.fail .fi{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--bad);margin-bottom:6px}
.fail h5{font-size:12px;margin-bottom:5px}
.fail p{font-size:11px;color:var(--ink-3);line-height:1.62}

/* ---------------- 交互示范 ---------------- */
.demo{
  border:1px solid var(--line-2);border-radius:var(--r-l);overflow:hidden;
  background:var(--card);margin-top:16px;box-shadow:var(--sh-2);
}
.demo-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:18px;
  padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--card-soft);
}
.demo-head h3{font-size:14.5px;margin-top:5px}
.demo-head p{font-size:11.4px;color:var(--ink-3);margin-top:5px;max-width:66ch;line-height:1.6}
.demo-ctl{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(245,242,234,.55);
}
.ctl{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-2)}
.ctl label{font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--ink-3);white-space:nowrap}
.ctl input[type=range]{
  -webkit-appearance:none;appearance:none;width:112px;height:3px;border-radius:2px;
  background:var(--line-2);outline:none;cursor:pointer;
}
.ctl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--jade);border:2px solid var(--card);box-shadow:0 0 0 1px var(--jade);cursor:grab;
}
.ctl input[type=range]::-moz-range-thumb{
  width:11px;height:11px;border-radius:50%;background:var(--jade);border:2px solid var(--card);cursor:grab;
}
.ctl .val{font-family:var(--mono);font-size:10.5px;color:var(--jade-d);min-width:28px;text-align:right}
.ctl .tog{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11.5px;color:var(--ink-2)}
.ctl .tog i{width:30px;height:16px;border-radius:9px;background:var(--line-2);position:relative;transition:background .16s;flex-shrink:0}
.ctl .tog i::after{
  content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;
  background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .16s;
}
.ctl .tog.on i{background:rgba(47,125,107,.45)}
.ctl .tog.on i::after{transform:translateX(14px);background:var(--jade-d)}

.demo-grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:0}
.track-wrap{position:relative;padding:13px 13px;border-right:1px solid var(--line);background:var(--card)}
.track{position:relative}
.track svg{display:block;width:100%;height:auto}
.readout{
  position:absolute;top:24px;right:24px;font-family:var(--mono);font-size:9.5px;
  color:var(--ink-2);background:rgba(255,255,255,.92);border:1px solid var(--line-2);
  padding:5px 8px;border-radius:5px;letter-spacing:.02em;pointer-events:none;
  backdrop-filter:blur(6px);min-width:128px;text-align:center;box-shadow:var(--sh-1);
}
.track-legend{
  display:flex;flex-wrap:wrap;gap:12px;margin-top:2px;padding-top:11px;
  border-top:1px solid var(--line);font-size:10px;color:var(--ink-4);
}
.track-legend span{display:flex;align-items:center;gap:5px}
.track-legend i{width:13px;height:2px;border-radius:1px;display:block;flex-shrink:0}
.track-legend i.dash{height:0;border-top:1px dashed var(--jade);background:none!important}
.demo-side{padding:13px 16px;display:flex;flex-direction:column;gap:11px;min-width:0}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.metric{background:var(--card);padding:10px 11px}
.metric .l{font-family:var(--mono);font-size:8px;letter-spacing:.09em;color:var(--ink-4);white-space:nowrap}
.metric .v{font-family:var(--mono);font-size:18px;margin-top:5px;line-height:1;color:var(--ink)}
.metric .v small{font-size:8.5px;color:var(--ink-4);margin-left:2px}
.metric.good .v{color:var(--ok)}
.metric.warn .v{color:var(--warn)}
.metric.bad .v{color:var(--bad)}
.verdict{font-size:11.8px;color:var(--ink-2);line-height:1.7;padding:0 1px}
.verdict b{color:var(--ink)}
.fitbox{border:1px solid var(--line);border-radius:8px;padding:11px 11px 5px;background:var(--card-soft)}
.fitbox .ft{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;color:var(--ink-4);
  margin-bottom:6px;display:flex;justify-content:space-between;
}
.fitbox svg{display:block;width:100%;height:auto}
.hintbox{font-size:11.3px;color:var(--ink-4);line-height:1.75;border-left:2px solid var(--line-2);padding-left:10px}
.hintbox b{color:var(--ink-3);font-weight:600}

.ltable-wrap{border-top:1px solid var(--line);overflow-x:auto}
.ltable{width:100%;border-collapse:collapse;font-size:11.5px;min-width:600px}
.ltable th{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;color:var(--ink-4);font-weight:400;
  text-align:right;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--card-soft);
}
.ltable th:first-child,.ltable td:first-child{text-align:left;padding-left:21px}
.ltable td{
  padding:7px 14px;text-align:right;border-bottom:1px solid var(--line);
  font-family:var(--mono);color:var(--ink-2);
}
.ltable tr:last-child td{border-bottom:0}
.ltable tr:hover td{background:var(--card-soft)}
.ltable .lith{font-family:var(--sans);text-align:right}
.ltable .ok{color:var(--ok)}
.ltable .miss{color:var(--bad)}
.ltable .extra{color:var(--warn)}
.swatch{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ---------------- 案例库控制台 ---------------- */
.console-bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--card);box-shadow:var(--sh-1);margin-bottom:18px;
}
.console-bar .num{font-family:var(--mono);font-size:20px;color:var(--jade-d);line-height:1}
.console-bar .num small{font-size:10px;color:var(--ink-4);margin-left:2px;font-family:var(--sans)}
.console-bar .lbl{font-size:11.5px;color:var(--ink-3)}
.console-bar .sp{flex:1}

.sys-table{width:100%;border-collapse:collapse;font-size:12.3px;min-width:760px;background:var(--card)}
.sys-table th{
  font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--ink-4);font-weight:400;
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--card-soft);
  white-space:nowrap;
}
.sys-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.sys-table tr:last-child td{border-bottom:0}
.sys-table tr:hover td{background:var(--card-soft)}
.sys-table .id{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:500}
.sys-table .nm{font-size:12.5px;font-weight:600}
.sys-table .sc{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.ok-mark{color:var(--ok);font-family:var(--mono);font-size:11px}
.bad-mark{color:var(--bad);font-family:var(--mono);font-size:11px}
.dim-mark{color:var(--line-3);font-family:var(--mono);font-size:11px}

/* 代码块（深色，全站唯一深色元素，用于代码） */
.code{
  border-radius:var(--r-m);overflow:hidden;background:#20292a;border:1px solid #2b3839;
  margin:14px 0;box-shadow:var(--sh-2);
}
.code-top{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-bottom:1px solid #2f4041;background:#1a2223;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:#8fa3a0;
}
.code-top .dots{display:flex;gap:4px;margin-right:6px}
.code-top .dots i{width:6px;height:6px;border-radius:50%;background:#3d5052;display:block}
.code pre{
  margin:0;padding:14px 16px;overflow-x:auto;
  font-family:var(--mono);font-size:11.5px;line-height:1.8;color:#dfe8e4;
  tab-size:2;
}
.code .c{color:#7d938f}      /* 注释 */
.code .k{color:#e0a878}      /* 关键字 */
.code .s{color:#9fc7a8}      /* 字符串 */
.code .f{color:#88b8d8}      /* 函数名 */
.code .n{color:#c9a8d8}      /* 数字 / 属性 */

/* 指南页：步骤 */
.gsteps{counter-reset:gs;display:flex;flex-direction:column;gap:0}
.gstep{
  display:grid;grid-template-columns:44px 1fr;gap:16px;
  padding:18px 0;border-top:1px solid var(--line);
}
.gstep:first-child{border-top:0;padding-top:4px}
.gstep .gn{
  width:36px;height:36px;border-radius:9px;background:var(--jade-l);color:var(--jade-d);
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;
  border:1px solid rgba(47,125,107,.2);
}
.gstep h3{font-size:14.5px;margin-bottom:6px}
.gstep p{font-size:12.6px;color:var(--ink-2);line-height:1.78}
.gstep p + p{margin-top:7px}

/* 字段契约表 */
.contract{width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
.contract th{
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-4);font-weight:400;
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--card-soft);
}
.contract td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;line-height:1.6}
.contract tr:last-child td{border-bottom:0}
.contract td:first-child{font-family:var(--mono);font-size:11px;color:var(--jade-d);white-space:nowrap;font-weight:500}
.contract .req{
  font-family:var(--mono);font-size:8.5px;padding:1px 5px;border-radius:3px;
  background:var(--bad-bg);color:var(--bad);border:1px solid rgba(176,90,81,.2);
}
.contract .opt{
  font-family:var(--mono);font-size:8.5px;padding:1px 5px;border-radius:3px;
  background:var(--paper-2);color:var(--ink-4);border:1px solid var(--line-2);
}

/* 文件树 */
.tree{
  font-family:var(--mono);font-size:11.5px;line-height:2;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);
  padding:16px 18px;overflow-x:auto;
}
.tree .dir{color:var(--jade-d);font-weight:500}
.tree .new{color:var(--clay-d);font-weight:600}
.tree .cm{color:var(--ink-4)}
.tree b{color:var(--ink)}

/* 提示条 */
.callout{
  display:flex;gap:11px;padding:13px 15px;border-radius:var(--r-m);
  font-size:12.5px;line-height:1.75;margin:14px 0;
  border:1px solid rgba(47,125,107,.18);background:var(--jade-l);color:var(--jade-d);
}
.callout.warn{border-color:rgba(169,122,28,.22);background:var(--warn-bg);color:#7d5a12}
.callout .ci{font-family:var(--mono);font-size:9px;letter-spacing:.1em;flex-shrink:0;padding-top:3px;opacity:.75}
.callout b{color:inherit}

/* ---------------- 响应式 ---------------- */
@media (max-width:1080px){
  .methods{grid-template-columns:repeat(3,1fr)}
  .mcard{border-top:1px solid var(--line)}
  .mcard:nth-child(-n+3){border-top:0}
  .mcard:nth-child(3n+1){border-left:0}
  .fails{grid-template-columns:1fr 1fr}
  .fields{grid-template-columns:1fr}
  .demo-grid{grid-template-columns:1fr}
  .track-wrap{border-right:0;border-bottom:1px solid var(--line)}
  .case-lead{grid-template-columns:1fr}
  .judge{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .methods{grid-template-columns:1fr 1fr}
  .mcard:nth-child(-n+3){border-top:1px solid var(--line)}
  .mcard:nth-child(-n+2){border-top:0}
  .mcard:nth-child(3n+1){border-left:1px solid var(--line)}
  .mcard:nth-child(2n+1){border-left:0}
  .scene-row{grid-template-columns:1fr;gap:6px;padding:16px 6px}
  .sr-n{display:none}
  .sr-right{flex-direction:row;align-items:center;padding-top:0}
  .sec4{grid-template-columns:1fr;gap:10px}
  .sec4 .sn{display:flex;align-items:center;gap:9px;padding-top:0}
  .sec4 .sn span{margin-top:0}
  .rel-grid{grid-template-columns:1fr}
  .fails{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .judge{grid-template-columns:1fr}
  .pstep{grid-template-columns:38px 1fr;gap:13px}
  .pstep .pn{width:38px;height:38px;font-size:10.5px;border-radius:9px}
  .pstep::before{left:18px;top:34px}
  .gstep{grid-template-columns:1fr;gap:10px}
}

/* =========================================================
   案例包导入：弹窗 / 上传区 / 校验结果 / 提示条
   ========================================================= */
html.mdl-open{overflow:hidden}

.mdl{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.mdl[hidden]{display:none}
.mdl-bg{position:absolute;inset:0;background:rgba(36,43,46,.42);backdrop-filter:blur(3px)}
.mdl-p{
  position:relative;width:min(980px,100%);max-height:calc(100vh - 48px);
  background:var(--card);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:0 24px 70px -24px rgba(30,36,38,.42),0 2px 6px rgba(30,36,38,.10);
  display:flex;flex-direction:column;overflow:hidden;
  animation:mdlIn .22s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes mdlIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

.mdl-h{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.mdl-h h3{font-size:17px;margin-top:4px;letter-spacing:-.01em}
.mdl-x{width:28px;height:28px;border-radius:6px;color:var(--ink-4);font-size:13px;display:grid;place-items:center;transition:background .15s,color .15s}
.mdl-x:hover{background:var(--paper-2);color:var(--ink)}

.mdl-b{padding:16px 20px 18px;overflow-y:auto}

/* 三步说明 */
.imp-flow{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.imp-flow li{background:var(--card-soft);display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:11.5px;color:var(--ink-2)}
.imp-flow b{font-family:var(--mono);font-size:9.5px;color:var(--jade-d);background:var(--jade-l);border:1px solid rgba(47,125,107,.2);border-radius:3px;padding:1px 5px;font-weight:600}

.imp-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.imp-l{min-width:0}

/* 上传区 */
.imp-drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:1.5px dashed var(--line-3);border-radius:10px;background:var(--card-soft);
  padding:22px 16px;cursor:pointer;transition:border-color .16s,background .16s;
  text-align:center;
}
.imp-drop:hover,.imp-drop.on{border-color:var(--jade);background:var(--jade-l)}
.imp-ic{width:26px;height:26px;border-radius:50%;background:var(--jade-l);border:1px solid rgba(47,125,107,.25);color:var(--jade-d);display:grid;place-items:center;font-size:13px;margin-bottom:4px}
.imp-drop.on .imp-ic{background:var(--jade);color:#fff}
.imp-drop b{font-size:12.5px;color:var(--ink);font-weight:600}
.imp-sub{font-size:10.5px;color:var(--ink-4)}

.imp-file{
  display:flex;align-items:center;gap:10px;margin-top:9px;
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--card);
}
.imp-fn{font-size:11.5px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-fm{font-size:9.5px;color:var(--ink-4);margin-left:auto;white-space:nowrap}
.imp-fx{font-size:10px;color:var(--ink-4);width:18px;height:18px;border-radius:4px;display:grid;place-items:center;flex-shrink:0}
.imp-fx:hover{background:var(--bad-bg);color:var(--bad)}

.imp-tpl{display:flex;gap:7px;margin:10px 0 14px;flex-wrap:wrap}

/* 表单 */
.imp-form{display:grid;gap:10px}
.imp-f{display:flex;flex-direction:column;gap:4px}
.imp-f > span{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.imp-f > span i{color:var(--bad);font-style:normal}
.imp-f input,.imp-f select{
  height:33px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);
  padding:0 10px;font-size:12.5px;color:var(--ink);width:100%;
  transition:border-color .15s,box-shadow .15s;
}
.imp-f input:focus,.imp-f select:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px rgba(47,125,107,.12)}
.imp-f input::placeholder{color:var(--ink-4)}
.imp-f em{font-size:10px;color:var(--ink-4);font-style:normal}
.imp-f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 校验结果 */
.imp-r{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card-soft)}
.imp-rh{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card);
  font-size:10px;letter-spacing:.12em;color:var(--ink-4);text-transform:uppercase;
}
.imp-rh .mono{letter-spacing:0;text-transform:none;font-size:10px;color:var(--ink-4)}

/* =========================================================

   ---------------------------------------------------------
   内置数据在 data.js 里是只读的；管理员在后台的改动写入
   localStorage，加载时在这里合并生效。三类操作：
     · 技术：atlas.methods.user.v1  { key: def|{deleted:true} }
     · 场景：atlas.scenes.user.v1   { upserts:{id:def}, deleted:[id] }
   合并策略：重建 stages[].scenes 与全部索引，用户场景带 __user 标记。
   ========================================================= */
(function (A) {
  var K_M = 'atlas.methods.user.v1';
  var K_S = 'atlas.scenes.user.v1';

  var PALETTE = ['cv', 'ts', 'nlp', 'opt', 'kg'];

  function lsGet(k) {
    try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }

  var userMethods = lsGet(K_M) || {};
  var sceneEdits = (function () {
    var r = lsGet(K_S);
    if (r && r.upserts) return { upserts: r.upserts, deleted: r.deleted || [] };
    return { upserts: {}, deleted: [] };
  })();

  A.colors = { cv: 'cv', ts: 'ts', nlp: 'nlp', opt: 'opt', kg: 'kg' };
  function colorKeyOf(key) {

      var m = userMethods[k];

      A.methods[k] = {
        key: k, abbr: m.abbr, name: m.name, desc: m.desc || '',
        signal: m.signal || '', colorKey: m.colorKey || 'cv'
      };
      A.colors[k] = m.colorKey || 'cv';
    });

    /* 2. 场景覆盖：先从 stages 里摘掉用户注入的、被改的、被删的 */
    A.stages.forEach(function (st) {
      st.scenes = st.scenes.filter(function (sc) {
        if (sc.__user) return false;
        return !sceneEdits.upserts[sc.id] && sceneEdits.deleted.indexOf(sc.id) < 0;
      });
    });

    /* 3. 用户场景重新挂回（保持 upserts 的插入顺序） */
    Object.keys(sceneEdits.upserts).forEach(function (id) {
      var u = sceneEdits.upserts[id];
      var st = A.index.byStage[u.stageId] || A.stages[0];

        diffWhy: u.diffWhy || '', point: u.point || '', intro: u.intro || '',

    A.index = { scene: {}, byMethod: {}, byStage: {} };
    A.stages.forEach(function (st) {

  A.saveMethod = function (m) {

      });

    userMethods[m.key] = {
      abbr: String(m.abbr).slice(0, 6), name: String(m.name).slice(0, 24),
      desc: String(m.desc || '').slice(0, 300), signal: String(m.signal || '').slice(0, 40),
      colorKey: colorKey
    };
    if (!lsSet(K_M, userMethods)) return { ok: false, error: '浏览器存储失败（可能空间不足）' };
    A.reindex();

    userMethods[key] = { deleted: true };
    if (!lsSet(K_M, userMethods)) return { ok: false, error: '浏览器存储失败' };
    A.reindex();

  A.saveScene = function (sc) {

      problem: String(sc.problem || '').slice(0, 400), status: sc.status || 'full'

    return !!(sceneEdits.upserts[id] && A.index.byScene[id] && A.index.byScene[id].__user);

  var problems = [];

  function reg(def) {
    if (!def || typeof def !== 'object') {
      problems.push('register() 收到非对象参数，已忽略');
      return null;
    }
    if (!def.id) {
      problems.push('案例缺少 id 字段，已忽略：' + (def.title || '(无标题)'));
      return null;
    }
    if (store[def.id]) {
      problems.push('案例 id 重复，后者覆盖前者：' + def.id);
      var i = order.indexOf(def.id);
      if (i >= 0) order.splice(i, 1);
    }
    store[def.id] = def;
    order.push(def.id);
    return def;
  }

  function get(id) { return store[id] || null; }

  /* 运行时移除：上传案例删除后不希望再出现；插件案例的
     「删除（隐藏）」也走这里，是否跨会话由调用方决定 */
  function unregister(id) {
    if (!store[id]) return false;
    delete store[id];
    var i = order.indexOf(id);
    if (i >= 0) order.splice(i, 1);
    return true;
  }

  /* 一个场景可以挂多个案例；导入（上传）的排前面，插件案例按注册顺序兜底 */
  function bySceneAll(sceneId) {
    var imported = [], builtin = [];
    for (var i = 0; i < order.length; i++) {
      var c = store[order[i]];
      if (c.sceneId !== sceneId) continue;
      (c.imported ? imported : builtin).push(c);
    }
    return imported.concat(builtin);
  }

  function byScene(sceneId) {
    var all = bySceneAll(sceneId);
    return all.length ? all[0] : null;
  }

  function list() {
    return order.map(function (id) { return store[id]; });
  }

  /* ---------- 校验：返回结构化结果，供控制台展示 ---------- */
  function validate(c) {
    var out = [];
    function ok(label, detail) { out.push({ level: 'ok', label: label, detail: detail || '' }); }
    function warn(label, detail) { out.push({ level: 'warn', label: label, detail: detail || '' }); }
    function err(label, detail) { out.push({ level: 'error', label: label, detail: detail || '' }); }

    // 1. id 规范
    if (!c.id) err('id 缺失');
    else if (!ID_RE.test(c.id)) err('id 命名不规范', '只允许小写字母、数字与连字符，例如 welllog-layer');
    else ok('id 规范', c.id);

    // 2. 绑定场景
    var A = global.ATLAS;
    var scene = null;
    if (!c.sceneId) err('sceneId 缺失', '必须指向 ATLAS 中的某个场景 id');
    else if (A && A.index && A.index.byId) {
      scene = A.index.byId[c.sceneId];
      if (scene) ok('场景已绑定', scene.name + '（' + c.sceneId + '）');
      else err('sceneId 不存在', '在 data.js 中找不到 ' + c.sceneId);
    } else {
      warn('数据层未就绪', '无法校验 sceneId');
    }

    // 3. 元信息
    if (!c.title) err('title 缺失');
    else ok('标题', c.title);
    if (c.version) ok('版本', c.version); else warn('未声明 version');
    if (c.updated) ok('更新日期', c.updated); else warn('未声明 updated');
    if (STATUS.indexOf(c.status) < 0) warn('status 建议填 ready 或 draft', '当前：' + c.status);

    // 4. 三个 tab
    var t = c.tabs || {};
    if (!t.background) err('缺少 tabs.background', '专业背景 tab 是必需项');
    else {
      var secs = (t.background.sections || []);
      if (secs.length < 2) warn('background.sections 少于 2 段', '建议按四段式写：问题 / 介入点 / 数据 / 难度');
      else ok('background 段落', secs.length + ' 段');
      var badSec = secs.filter(function (s) { return !s.title || !(s.html || s.body); });
      if (badSec.length) err('有段落缺 title 或内容', badSec.map(function (s) { return s.title || '(无题)'; }).join('、'));
    }

    if (!t.workflow) warn('缺少 tabs.workflow', '没有流程 tab，页面只显示两个 tab');
    else {
      var steps = (t.workflow.steps || []);
      if (!steps.length) err('workflow.steps 为空');
      else ok('workflow 步骤', steps.length + ' 步');
    }

    if (!t.demo) {
      warn('没有可运行示范', 'demo 为可选项，但带示范的场景更容易被立项');
    } else if (typeof t.demo.mount !== 'function') {
      err('tabs.demo.mount 不是函数', '应为 mount(root, ctx)');
    } else {
      ok('可运行示范', '已挂载 mount()');
    }

    // 5. 场景声明与案例的一致性
    if (scene) {
      if (scene.demo && !t.demo) warn('场景标记了 demo:true，但案例没有示范', '二者应保持一致');
      if (!scene.demo && t.demo) warn('案例有示范，但场景未标记 demo:true', '列表页不会显示"可运行"徽标');
    }

    // 6. 同场景多案例：现在是受支持的能力，只做信息提示
    var sibs = bySceneAll(c.sceneId).filter(function (x) { return x.id !== c.id; });
    if (sibs.length) ok('同场景还有 ' + sibs.length + ' 个案例', '多案例场景会在页面顶部显示案例切换器：' + sibs.map(function (x) { return x.id; }).join('、'));

    return out;
  }

  function validateAll() {
    var map = {};
    list().forEach(function (c) { map[c.id] = validate(c); });
    return map;
  }

  function stats() {
    var A = global.ATLAS;
    var total = A ? A.allScenes.length : 0;
    var withDemo = 0, ready = 0;
    var covered = {};
    list().forEach(function (c) {
      if (c.status === 'ready') ready++;
      if (c.tabs && c.tabs.demo && typeof c.tabs.demo.mount === 'function') withDemo++;
      covered[c.sceneId] = 1;
    });
    return {
      registered: order.length, ready: ready, withDemo: withDemo,
      totalScenes: total,
      coveredScenes: Object.keys(covered).length
    };
  }

  global.Cases = {
    register: reg,
    unregister: unregister,
    get: get,
    byScene: byScene,
    bySceneAll: bySceneAll,
    list: list,
    validate: validate,
    validateAll: validateAll,
    stats: stats,
    problems: function () { return problems.slice(); }
  };
})(window);

</script>
<script>
/* =========================================================
   渲染工具箱 Render Kit
   ---------------------------------------------------------
   把"案例想表达什么"和"页面长什么样"分开：
   案例只调用这里的语义化函数，不写 CSS 类名。
   想改版式只需改本文件与 ui.css，所有案例同步生效。
   ========================================================= */

(function (global) {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* 允许案例在文本里用极简标记：**粗体** 与 `等宽` */
  function rich(s) {
    var out = esc(s);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    out = out.replace(/`([^`]+)`/g, '<code style="font-family:var(--mono);font-size:.92em;background:var(--paper-2);padding:1px 4px;border-radius:3px">$1</code>');
    return out;
  }

  /* ---------- 标签 ---------- */
  function mtag(keys) {
    var M = (global.ATLAS && global.ATLAS.methods) || {};
    return (keys || []).map(function (k) {
      var m = M[k] || { abbr: k.toUpperCase() };
      return '<span class="mtag" data-m="' + k + '"><b>' + m.abbr + '</b></span>';
    }).join('');
  }

  function dtag(d) {
    return '<span class="dtag" data-d="' + esc(d) + '">难度 ' + esc(d) + '</span>';
  }

  /* ---------- 图 ---------- */
  function figure(svg, no, caption) {
    return '<div class="figure">' + svg + '</div>' +
      (caption ? '<div class="figcap"><b>图 ' + esc(no) + '</b><span>' + rich(caption) + '</span></div>' : '');
  }

  /* ---------- 四段式 ---------- */
  function sec4(no, en, title, bodyHTML) {
    return '<div class="sec4"><div class="sn">' + pad(no) + '<span>' + esc(en) + '</span></div>' +
      '<div class="sec4-body"><h3>' + esc(title) + '</h3>' + bodyHTML + '</div></div>';
  }

  /* ---------- 30 秒判断 ---------- */
  function judge(cells) {
    return '<div class="judge">' + cells.map(function (c) {
      return '<div class="jc"><div class="jl">' + esc(c.label) + '</div>' +
        '<div class="jv">' + (c.html || rich(c.value)) + '</div>' +
        (c.desc ? '<div class="jd">' + rich(c.desc) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }

  /* ---------- 表格 ---------- */
  function dtable(head, rows) {
    return '<table class="dtable"><thead><tr>' +
      head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + rich(c) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }

  /* ---------- 数据清单（可勾选） ---------- */
  function checklist(items, title) {
    var head = title || '数据准备清单';
    var rows = items.map(function (d, i) {
      var name = Array.isArray(d) ? d[0] : d;
      var spec = Array.isArray(d) ? d[1] : '';
      var note = Array.isArray(d) ? d[2] : '';
      return '<div class="cl-item" data-cl="' + i + '">' +
        '<span class="cl-box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>' +
        '<span><span class="cl-t">' + esc(name) + '</span>' +
        '<span class="cl-s">' + esc(spec) + '</span></span>' +
        '<span class="cl-n">' + esc(note) + '</span></div>';
    }).join('');
    return '<div class="checklist"><div class="cl-head">' +
      '<span>' + esc(head) + ' · ' + items.length + ' 项</span>' +
      '<span class="cl-prog"><span id="cl-txt">0 / ' + items.length + '</span>' +
      '<span class="cl-bar"><i id="cl-fill"></i></span></span></div>' + rows + '</div>';
  }

  /* ---------- 参考方向 ---------- */
  function refs(list, hrefPrefix) {
    return '<div class="refs">' + list.map(function (r) {
      var name = typeof r === 'string' ? r : r.name;
      var href = typeof r === 'string' ? (hrefPrefix || '#/method/cv') : (r.href || hrefPrefix);
      var ar = href ? '<span class="ar">↗</span>' : '';
      return href
        ? '<a class="ref" href="' + href + '">' + esc(name) + ar + '</a>'
        : '<span class="ref">' + esc(name) + '</span>';
    }).join('') + '</div>';
  }

  /* ---------- 难度条 ---------- */
  function meter(diff) {
    var lv = diff === '低' ? 1 : diff === '高' ? 3 : 2;
    return '<div class="meter">' + [1, 2, 3].map(function (i) {
      return '<i class="' + (i <= lv ? 'on' : '') + (i === 3 && lv === 3 ? ' hi' : '') + '"></i>';
    }).join('') + '</div>';
  }

  /* ---------- 编号指标格 ---------- */
  function cells(items) {
    return '<div class="case-cells">' + items.map(function (c) {
      var l = Array.isArray(c) ? c[0] : c.label;
      var v = Array.isArray(c) ? c[1] : c.value;
      var raw = Array.isArray(c) ? c[2] : c.html;
      var isNum = !raw && /^[\d.]+$/.test(String(v));
      return '<div><div class="l">' + esc(l) + '</div><div class="v">' +
        (raw ? v : isNum ? '<b>' + esc(v) + '</b>' : esc(v)) + '</div></div>';
    }).join('') + '</div>';
  }

  /* ---------- 流程步骤 ---------- */
  function pipeline(steps) {
    var overview = '<div class="flow-overview" aria-label="案例流程总览"><div class="flow-overview-head"><span class="kicker plain">DATA FLOW</span><span>输入 → 处理 → 结果 → 复核</span></div><div class="flow-overview-track">' + steps.map(function (s, i) {
      return '<div class="flow-overview-node"><span>STEP ' + pad(i + 1) + (s.role ? ' · ' + esc(s.role) : '') + '</span><b>' + esc(s.name) + '</b></div>' + (i < steps.length - 1 ? '<i aria-hidden="true">→</i>' : '');
    }).join('') + '</div></div>';
    return overview + '<div class="pipeline">' + steps.map(function (s, i) {
      return '<div class="pstep"><div class="pn">' + pad(i + 1) + '</div><div class="pc">' +
        '<h4>' + esc(s.name) + (s.role ? '<span class="role">' + esc(s.role) + '</span>' : '') + '</h4>' +
        '<div class="pdo">' + rich(s.do) + '</div>' +
        (s.effect ? '<div class="peff"><span class="k">预期效果</span><span>' + rich(s.effect) + '</span></div>' : '') +
        (s.trap ? '<div class="peff" style="border-top-color:rgba(176,90,81,.2)"><span class="k" style="color:var(--bad)">常见坑</span><span>' + rich(s.trap) + '</span></div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
  }

  /* ---------- 失败模式 ---------- */
  function fails(items) {
    return '<div class="fails">' + items.map(function (f, i) {
      return '<div class="fail"><div class="fi">FAIL ' + pad(i + 1) + '</div>' +
        '<h5>' + esc(f.name) + '</h5><p>' + rich(f.why) + '</p></div>';
    }).join('') + '</div>';
  }

  /* ---------- 提示条 ---------- */
  function callout(text, kind) {
    return '<div class="callout' + (kind === 'warn' ? ' warn' : '') + '">' +
      '<span class="ci">' + (kind === 'warn' ? '注意' : '说明') + '</span>' +
      '<span>' + rich(text) + '</span></div>';
  }

  /* ---------- 代码块 ---------- */
  function highlight(src) {
    var store = [];
    function stash(html) { store.push(html); return '\u0001' + (store.length - 1) + '\u0002'; }

    var s = String(src);
    // 注释
    s = s.replace(/\/\/[^\n]*/g, function (m) { return stash('<span class="c">' + esc(m) + '</span>'); });
    // 字符串
    s = s.replace(/'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"/g, function (m) {
      return stash('<span class="s">' + esc(m) + '</span>');
    });
    s = esc(s);
    s = s.replace(/\b(var|let|const|function|return|if|else|for|while|new|this|typeof|true|false|null|undefined)\b/g,
      '<span class="k">$1</span>');
    s = s.replace(/\u0001(\d+)\u0002/g, function (_, i) { return store[+i]; });
    return s;
  }

  function code(src, opts) {
    opts = opts || {};
    return '<div class="code">' +
      '<div class="code-top"><span class="dots"><i></i><i></i><i></i></span>' +
      esc(opts.file || 'snippet.js') + (opts.note ? ' · ' + esc(opts.note) : '') + '</div>' +
      '<pre>' + highlight(src) + '</pre></div>';
  }

  /* ---------- 文件树 ---------- */
  function tree(lines) {
    return '<div class="tree">' + lines.join('<br>') + '</div>';
  }

  global.K = {
    esc: esc, pad: pad, rich: rich,
    mtag: mtag, dtag: dtag,
    figure: figure, sec4: sec4, judge: judge,
    dtable: dtable, checklist: checklist, refs: refs, meter: meter,
    cells: cells, pipeline: pipeline, fails: fails,
    callout: callout, code: code, tree: tree, highlight: highlight
  };
})(window);

</script>

<script>
/* =========================================================
   案例 01 · 测井曲线智能分层
   ---------------------------------------------------------
   这是一个"案例插件"的完整示例：
   · 只依赖 Cases 注册表与 K 工具箱，不引用任何外壳内部变量
   · 三块内容（background / workflow / demo）都是可替换的
   · 删掉这个文件 + index.html 里对应的一行 script，系统照常运行，
     只是 w1 场景会回到"待接入"状态
   ========================================================= */

(function () {

  var esc = K.esc;

  /* =========================================================
     插图：用 JS 生成，避免手写几百行 path
     ========================================================= */

  /* 一条带噪声的阶梯曲线，模拟测井响应 */
  function grPolyline(xL, xW, yT, yH, layers, seed) {
    var rnd = seed || 1;
    function r() { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; }
    var pts = [];
    var n = 260;
    for (var i = 0; i <= n; i++) {
      var t = i / n;
      var y = yT + t * yH;
      // 找到当前所在层
      var acc = 0, v = layers[0].v;
      for (var j = 0; j < layers.length; j++) {
        if (t >= layers[j].from) v = layers[j].v;
      }
      // 层内缓变 + 噪声
      var local = (r() - 0.5) * 0.055;
      pts.push((xL + (v + local) * xW).toFixed(1) + ',' + y.toFixed(1));
    }
    return pts.join(' ');
  }

  function figManual() {
    var xL = 118, xW = 210, yT = 30, yH = 230;
    var layers = [
      { from: 0, v: 0.52 },
      { from: 0.26, v: 0.20 },
      { from: 0.46, v: 0.66 },
      { from: 0.62, v: 0.36 },
      { from: 0.70, v: 0.58 },
      { from: 0.90, v: 0.30 }
    ];
    var s = '';
    s += '<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="人工卡层误差示意">';

    // 深度刻度
    for (var d = 0; d <= 100; d += 20) {
      var y = yT + d / 100 * yH;
      s += '<line x1="96" y1="' + y + '" x2="' + (xL + xW + 6) + '" y2="' + y + '" stroke="#e9e4d8" stroke-width="1" stroke-dasharray="2 4"/>';
      s += '<text x="88" y="' + (y + 3.5) + '" text-anchor="end" font-size="9" font-family="monospace" fill="#9ba3a9">' + (1000 + d * 3) + '</text>';
    }

    // 真实界面
    var truth = [26, 46, 62, 70, 90];
    truth.forEach(function (p) {
      var y = yT + p / 100 * yH;
      s += '<line x1="' + xL + '" y1="' + y + '" x2="' + (xL + xW + 30) + '" y2="' + y + '" stroke="#2f7d6b" stroke-width="1.4" stroke-dasharray="5 3"/>';
    });

    // 曲线
    s += '<polyline points="' + grPolyline(xL, xW, yT, yH, layers, 7) + '" fill="none" stroke="#31393d" stroke-width="1.3" stroke-linejoin="round"/>';
    s += '<line x1="' + (xL + xW + 2) + '" y1="' + yT + '" x2="' + (xL + xW + 2) + '" y2="' + (yT + yH) + '" stroke="#c9c2b0" stroke-width="1"/>';

    // 人工界面（橙色，偏移）
    var manual = [30, 49, 62, 90];
    manual.forEach(function (p, i) {
      var y = yT + p / 100 * yH;
      s += '<line x1="' + (xL - 12) + '" y1="' + y + '" x2="' + (xL + xW + 18) + '" y2="' + y + '" stroke="#b26a39" stroke-width="1.6"/>';
      s += '<circle cx="' + (xL - 12) + '" cy="' + y + '" r="2.6" fill="#b26a39"/>';
    });

    // 薄层（真实存在，人工漏卡）
    var yb1 = yT + 0.70 * yH, yb2 = yT + 0.745 * yH;
    s += '<rect x="' + xL + '" y="' + yb1 + '" width="' + (xW + 4) + '" height="' + (yb2 - yb1) + '" fill="#f2d98a" opacity=".5" rx="2"/>';
    s += '<line x1="' + (xL + xW + 34) + '" y1="' + ((yb1 + yb2) / 2) + '" x2="' + (xL + xW + 62) + '" y2="' + ((yb1 + yb2) / 2) + '" stroke="#b26a39" stroke-width="1"/>';
    s += '<text x="' + (xL + xW + 66) + '" y="' + ((yb1 + yb2) / 2 + 3.5) + '" font-size="10" fill="#b26a39">0.8 m 薄层 · 漏卡</text>';

    // 标注
    s += '<text x="' + (xL + xW + 30) + '" y="' + (yT + 0.26 * yH - 7) + '" font-size="9.5" fill="#2f7d6b">真实界面</text>';
    s += '<text x="' + (xL - 14) + '" y="' + (yT + 0.30 * yH - 7) + '" font-size="9.5" fill="#b26a39" text-anchor="end">人工卡层</text>';

    // 偏差标注
    var y1 = yT + 0.26 * yH, y2 = yT + 0.30 * yH;
    s += '<line x1="' + (xL + xW - 20) + '" y1="' + y1 + '" x2="' + (xL + xW - 20) + '" y2="' + y2 + '" stroke="#b26a39" stroke-width="1"/>';
    s += '<line x1="' + (xL + xW - 24) + '" y1="' + y1 + '" x2="' + (xL + xW - 16) + '" y2="' + y1 + '" stroke="#b26a39" stroke-width="1"/>';
    s += '<line x1="' + (xL + xW - 24) + '" y1="' + y2 + '" x2="' + (xL + xW - 16) + '" y2="' + y2 + '" stroke="#b26a39" stroke-width="1"/>';
    s += '<text x="' + (xL + xW + 62) + '" y="' + ((y1 + y2) / 2 + 3) + '" font-size="9.5" fill="#b26a39">偏移 1.2 m</text>';

    s += '<text x="' + xL + '" y="16" font-size="9.5" font-family="monospace" fill="#9ba3a9" letter-spacing="1">GR (API)</text>';
    s += '<text x="' + (xL + xW + 2) + '" y="' + (yT + yH + 18) + '" text-anchor="end" font-size="9.5" font-family="monospace" fill="#9ba3a9">深度 / m</text>';
    s += '</svg>';
    return s;
  }

  function figAI() {
    var steps = [
      ['原始曲线', '多井 GR / SP / RT', '#e6f1ec', '#2f7d6b'],
      ['滑窗特征', '均值差 · 方差比 · 斜率', '#e7eef9', '#41699b'],
