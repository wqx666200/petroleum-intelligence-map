      '<div class="imp-empty">把案例文件夹拖进来后，这里会逐项显示检查结果。<br>只有 0 项错误才能添加。</div>' +
      '</div>' +
      '</div>' +

      '</div>' +
      '</div>' +

      '<div class="mdl-f">' +
      '<span class="imp-tip" id="imp-tip">表单里的名称 / 场景会覆盖清单里的同名字段。</span>' +
      '<span style="flex:1"></span>' +
      '<button class="btn" data-close>取消</button>' +
      '<button class="btn primary" id="imp-ok">校验并添加</button>' +
      '</div>' +

      '</div>';

    document.body.appendChild(el);
    return el;
  }

  function q(id) { return S.el.querySelector(id); }

  function paintResults(list) {
    var res = q('#imp-res'), cnt = q('#imp-count');
    if (!list.length) {
      res.innerHTML = '<div class="imp-empty">把案例文件夹拖进来后，这里会逐项显示检查结果。<br>只有 0 项错误才能添加。</div>';
      cnt.textContent = '未开始';
      cnt.className = 'mono';
      return;
    }
    var sum = summarize(list);
    res.innerHTML = list.map(function (x) {
      var icon = x.level === 'ok' ? '✓' : x.level === 'warn' ? '!' : '✕';
      return '<div class="imp-item" data-lv="' + x.level + '">' +
        '<span class="imp-i">' + icon + '</span>' +
        '<div><div class="imp-m">' + esc(x.msg) + '</div>' +
        (x.hint ? '<div class="imp-h">' + esc(x.hint) + '</div>' : '') + '</div></div>';
    }).join('');
    cnt.textContent = sum.errors ? sum.errors + ' 项错误' : sum.warns ? sum.warns + ' 项警告' : '全部通过';
    cnt.className = 'mono ' + (sum.errors ? 'is-err' : sum.warns ? 'is-warn' : 'is-ok');
  }

  function tip(msg, kind) {
    var el = q('#imp-tip');
    el.textContent = msg;
    el.className = 'imp-tip' + (kind ? ' ' + kind : '');
  }

  function metaNow() {
    return {
      id: q('#imp-id').value.trim(),
      title: q('#imp-title-in').value.trim(),
      sceneId: q('#imp-scene').value,
      methods: checkedMethods(),
      version: q('#imp-ver').value.trim(),
      updated: q('#imp-date').value
    };
  }

  function preview() {
    if (!S.pkg) { paintResults([]); return; }
    paintResults(checkAll(S.pkg, metaNow(), S.files));
  }

  function suggestId(sceneId) {
    var base = (sceneId || 'case') + '-case';
    var id = base, n = 2;
    while (global.Cases.get(id)) { id = base + '-' + n; n++; }
    return id;
  }

  /* ---- 文件列表 ---- */
  function paintFiles() {
    var box = q('#imp-pack'), list = q('#imp-list');
    if (!S.raw.length) { box.hidden = true; return; }
    box.hidden = false;

    var total = S.raw.reduce(function (a, f) { return a + f.size; }, 0);
    q('#imp-pack-sum').textContent = S.raw.length + ' 个文件 · ' + kb(total) + ' KB';

    var mode = S.files.length ? global.CaseDemoHost.resolveMode({ files: S.files, demo: demoCfg(S.pkg) }) : 'none';
    var cfg = demoCfg(S.pkg);
    if (mode === 'none' && cfg.builtin) mode = 'builtin';
    var label = { page: '整页模式', module: '模块模式', builtin: '复用内置示范', none: '无示范' }[mode] || '无示范';
    var mEl = q('#imp-mode');
    mEl.textContent = label;
    mEl.dataset.mode = mode;

    q('#imp-try').disabled = (mode === 'none' || mode === 'builtin');

    list.innerHTML = S.raw.map(function (f, i) {
      var r = roleOf(f);
      return '<div class="imp-row" data-role="' + r.k + '">' +
        '<span class="imp-role">' + r.t + '</span>' +
        '<span class="imp-name" title="' + esc(f.name) + '">' + esc(f.name) + '</span>' +
        '<span class="imp-size">' + kb(f.size) + ' KB</span>' +
        '<button class="imp-fx" data-del="' + i + '" title="移除">✕</button>' +
        '</div>';
    }).join('');
  }

  /* ---- 载入一组文件 ---- */
  function loadFiles(fileList) {
    var files = [].slice.call(fileList || []).filter(function (f) { return f && f.name && f.name !== '.DS_Store'; });
    if (!files.length) return;

    if (S.loading) return;
    S.loading = true;
    tip('正在读取 ' + files.length + ' 个文件…', '');

    Promise.all(files.map(readOne)).then(function (arrs) {
      S.loading = false;
      stripRoot(arrs);
      adopt(arrs);
    }).catch(function (e) {
      S.loading = false;
      paintResults([{ level: 'error', msg: '读取文件失败', hint: e.message }]);
      tip('读取失败，换一个文件夹再试', 'is-err');
    });
  }

  function adopt(arrs) {
    S.raw = arrs;
    var mf = pickManifest(arrs);
    S.manifest = mf;
    S.files = arrs.filter(function (f) { return f !== mf; });

    if (!mf) {
      S.pkg = null;
      paintFiles();
      paintResults([{
        level: 'error',
        msg: '没有找到 case.json 清单',
        hint: '案例包里必须有一个 .json 清单（建议叫 case.json）。点「↓ 下载案例包模板」拿一份现成的。'
      }]);
      tip('缺少清单文件', 'is-err');
      return;
    }

    var pkg;
    try {
      pkg = JSON.parse(mf.data);
    } catch (e) {
      S.pkg = null;
      paintFiles();
      paintResults([{
        level: 'error',
        msg: '清单不是合法 JSON：' + e.message,
        hint: '常见原因：多了一个逗号、用了中文引号、注释没删干净。'
      }]);
      tip('清单解析失败', 'is-err');
      return;
    }
    if (!pkg || typeof pkg !== 'object' || Array.isArray(pkg)) {
      S.pkg = null;
      paintFiles();
      paintResults([{ level: 'error', msg: '清单最外层应该是一个对象 { ... }', hint: '检查文件开头结尾的 { }' }]);
      return;
    }

    S.pkg = pkg;

    /* 清单里的默认值填进表单（不覆盖用户已填） */
    if (pkg.title && !q('#imp-title-in').value) q('#imp-title-in').value = pkg.title;
    if (pkg.version && !q('#imp-ver').value) q('#imp-ver').value = pkg.version;
    if (pkg.updated && !q('#imp-date').value) q('#imp-date').value = pkg.updated;
    if (pkg.sceneId && !q('#imp-scene').value) {
      q('#imp-scene').value = pkg.sceneId;
      if (q('#imp-scene').value !== pkg.sceneId) {
        tip('清单里的 sceneId「' + pkg.sceneId + '」在地图里不存在，请手动选一个', 'is-err');
      }
    }
    if (!q('#imp-id').value) q('#imp-id').value = pkg.id || suggestId(q('#imp-scene').value);
    if (!q('#imp-date').value) q('#imp-date').value = today();
    paintMethods();   /* 清单声明了 methods 就按清单勾选，否则按场景 */

    paintFiles();
    tip('已载入，右侧是当前校验结果', 'is-ok');
    preview();
  }

  function fail(msg, hint) {
    paintResults([{ level: 'error', msg: msg, hint: hint || '' }]);
    tip('文件有问题，按右侧提示处理后重新上传', 'is-err');
  }

  /* ---- 模板下载 ---- */
  function download(name, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function downloadTemplate() {
    try {
      var zip = makeZip([
        { name: 'my-case/README.txt', text: TPL_README },
        { name: 'my-case/case.json', text: JSON.stringify(templateManifest(), null, 2) },
        { name: 'my-case/demo/index.html', text: TPL_HTML },
        { name: 'my-case/demo/demo.css', text: TPL_CSS },
        { name: 'my-case/demo/demo.js', text: TPL_JS }
      ]);
      download('案例包模板.zip', zip);
      tip('模板已下载：解压后改内容，再把 my-case 文件夹整个拖回这里', 'is-ok');
    } catch (e) {
      tip('打包失败：' + e.message, 'is-err');
    }
  }

  function downloadManifest() {
    download('my-case.json', new Blob([JSON.stringify(templateManifest(), null, 2)], { type: 'application/json;charset=utf-8' }));
    tip('清单模板已下载（只有文字内容，示范请另外打包）', 'is-ok');
  }

  /* ---- 试跑示范 ---- */
  function openPreview() {
    if (!S.pkg) { tip('请先载入案例包', 'is-err'); return; }
    var mode = global.CaseDemoHost.resolveMode({ files: S.files, demo: demoCfg(S.pkg) });
    if (mode === 'none') { tip('这个包没有可运行的示范', 'is-err'); return; }

    if (!S.pv) {
      S.pv = document.createElement('div');
      S.pv.className = 'mdl';
      S.pv.id = 'import-preview';
      S.pv.hidden = true;
      S.pv.innerHTML =
        '<div class="mdl-bg" data-pv-close></div>' +
        '<div class="mdl-p" role="dialog" aria-modal="true">' +
        '<div class="mdl-h"><div><div class="eyebrow">SANDBOX PREVIEW</div>' +
        '<h3>示范预览</h3></div><button class="mdl-x" data-pv-close>✕</button></div>' +
        '<div class="mdl-b pv-body" id="imp-pv-body"></div>' +
        '<div class="mdl-f"><span class="imp-tip">这是沙箱内的真实运行效果，与添加后完全一致。</span>' +
        '<span style="flex:1"></span><button class="btn" data-pv-close>关闭预览</button></div>' +
        '</div>';
      document.body.appendChild(S.pv);
      S.pv.addEventListener('click', function (e) {
        if (e.target.closest('[data-pv-close]')) closePreview();
      });
    }

    var body = S.pv.querySelector('#imp-pv-body');
    if (S.pvHandle) { try { S.pvHandle.destroy(); } catch (e) { } }
    S.pvHandle = global.CaseDemoHost.create(body, {
      files: S.files, demo: demoCfg(S.pkg), meta: metaNow()
    }, {});
    S.pv.hidden = false;
    document.documentElement.classList.add('mdl-open');
  }

  function closePreview() {
    if (S.pv) S.pv.hidden = true;
    if (S.pvHandle) { try { S.pvHandle.destroy(); } catch (e) { } S.pvHandle = null; }
    document.documentElement.classList.remove('mdl-open');
  }

  /* ---- 提交 ---- */
  function commit() {
    var meta = metaNow();
    var list = checkAll(S.pkg, meta, S.files);
    paintResults(list);
    var sum = summarize(list);

    if (!S.pkg) { tip('请先拖入案例文件夹', 'is-err'); return; }
    if (sum.errors) { tip(sum.errors + ' 项不符合要求，按右侧红色提示修改后再添加', 'is-err'); return; }

    saved = saved.filter(function (r) { return r.meta && r.meta.id !== meta.id; });
    var rec = { v: 2, pkg: S.pkg, meta: meta, files: S.files, savedAt: new Date().toISOString() };
    saved.push(rec);
    /* 同 id 的插件案例若曾被隐藏，重新上传时解除隐藏 */
    var bl = readBlocklist();
    if (bl.indexOf(meta.id) >= 0) writeBlocklist(bl.filter(function (x) { return x !== meta.id; }));

    var stored = writeStore(saved);
    global.Cases.register(toCase(rec));

    close();
    toast('已添加「' + meta.title + '」' + (stored ? '' : '（仅本次有效）'),
      stored ? '正在打开场景页…' : '内容太大，浏览器没能保存，刷新后会丢失');

    var target = '#/scene/' + meta.sceneId;
    setTimeout(function () {
      if (global.location.hash === target) global.dispatchEvent(new Event('hashchange'));
      else global.location.hash = target;
    }, 620);
  }

  function bind() {
    S.el.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) { close(); }
    });

    var drop = q('#imp-drop'), fileIn = q('#imp-file'), dirIn = q('#imp-dir');

    /* 有些环境（国产浏览器兼容模式等）解析 innerHTML 时会丢非标准属性，
       或压根不支持 webkitdirectory —— 弹出的仍是普通文件框。这里补一次属性，
       并准备三级降级策略。 */
    try {
      dirIn.setAttribute('webkitdirectory', '');
      dirIn.setAttribute('directory', '');
    } catch (e) { }

    var HAS_DIR_ATTR = (function () {
      var t = document.createElement('input');
      t.type = 'file';
      return 'webkitdirectory' in t;
    })();
    var HAS_FSA = typeof global.showDirectoryPicker === 'function';

    /* 选文件夹三级策略：
       ① webkitdirectory 属性（Chrome / Edge / Firefox）
       ② showDirectoryPicker() 文件夹句柄 API（Chromium 86+）
       ③ 都没有 → 明确提示替代方式 */
    function pickDir() {
      if (HAS_DIR_ATTR) { dirIn.click(); return; }
      if (HAS_FSA) { pickDirFSA(); return; }
      tip('当前浏览器不支持「选择文件夹」按钮。三个替代办法：' +
        '① 把整个文件夹直接拖进虚线框（推荐）；' +
        '② 点「选择文件」，在弹出的对话框里进入案例文件夹后 Ctrl+A 全选所有文件；' +
        '③ 改用 Chrome 或 Edge 浏览器。', 'is-err');
    }

    /* 文件夹句柄 API：递归读出目录下所有 File，并补上相对路径 */
    function pickDirFSA() {
      var p;
      try { p = global.showDirectoryPicker(); } catch (e) { p = null; }
      if (!p || !p.then) { tip('浏览器拒绝了文件夹访问，请改用拖拽方式', 'is-err'); return; }
      p.then(function (root) {
        var out = [];
        tip('正在读取文件夹「' + root.name + '」…', '');
        walkDirHandle(root, root.name + '/', out).then(function () {
          if (!out.length) { tip('这个文件夹里没有文件', 'is-err'); return; }
          loadFiles(out);
        }).catch(function (e) {
          tip('读取文件夹失败：' + ((e && e.message) || e), 'is-err');
        });
      }).catch(function () { /* 用户取消，不打扰 */ });
    }

    function walkDirHandle(dir, prefix, out) {
      var iter = dir.values();
      function step() {
        return iter.next().then(function (r) {
          if (r.done) return null;
          var h = r.value;
          if (h.kind === 'file') {
            return h.getFile().then(function (f) {
              try {
                Object.defineProperty(f, 'webkitRelativePath', { value: prefix + f.name, configurable: true });
              } catch (e) { }
              out.push(f);
            }).then(step);
          }
          if (h.kind === 'directory') return walkDirHandle(h, prefix + h.name + '/', out).then(step);
          return step();
        });
      }
      return step();
    }

    /* 关键：两个输入框就放在虚线框内部，程序化 .click() 触发的合成 click 事件
       会冒泡回虚线框监听器，导致文件框 + 文件夹框连环弹出。
       双保险：① 输入框层面拦截冒泡；② 虚线框只响应真实用户点击。 */
    fileIn.addEventListener('click', function (e) { e.stopPropagation(); });
    dirIn.addEventListener('click', function (e) { e.stopPropagation(); });
    drop.addEventListener('click', function (e) {
      if (!e.isTrusted) return;
      if (e.target.closest('.btn')) return;
      if (e.target.closest('input')) return;
      fileIn.click();
    });
    q('#imp-pick-files').addEventListener('click', function (e) { e.stopPropagation(); fileIn.click(); });
    q('#imp-pick-dir').addEventListener('click', function (e) { e.stopPropagation(); pickDir(); });

    fileIn.addEventListener('change', function () { loadFiles(fileIn.files); fileIn.value = ''; });
    dirIn.addEventListener('change', function () { loadFiles(dirIn.files); dirIn.value = ''; });

    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('on'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('on'); });
    });
    drop.addEventListener('drop', function (e) {
      var dt = e.dataTransfer;
      if (!dt) return;
      /* 支持拖入文件夹：递归收集 */
      var items = dt.items ? [].slice.call(dt.items) : [];
      var entries = items.map(function (it) {
        return it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
      }).filter(Boolean);

      if (!entries.length) { loadFiles(dt.files); return; }

      tip('正在读取拖入的文件夹…', '');
      var collected = [];
      var pending = 0;

      function walk(entry, path) {
        if (entry.isFile) {
          pending++;
          entry.file(function (f) {
            try { Object.defineProperty(f, 'webkitRelativePath', { value: path + f.name, configurable: true }); } catch (e) { }
            collected.push(f);
            if (--pending === 0) loadFiles(collected);
          }, function () { if (--pending === 0) loadFiles(collected); });
        } else if (entry.isDirectory) {
          pending++;
          var reader = entry.createReader();
          var all = [];
          (function readMore() {
            reader.readEntries(function (batch) {
              if (!batch.length) {
                pending--;
                all.forEach(function (en) { walk(en, path + entry.name + '/'); });
                if (pending === 0) loadFiles(collected);
                return;
              }
              all = all.concat([].slice.call(batch));
              readMore();
            }, function () { pending--; if (pending === 0) loadFiles(collected); });
          })();
        }
      }

      entries.forEach(function (en) { walk(en, ''); });
    });

    q('#imp-dl').addEventListener('click', downloadTemplate);
    q('#imp-dl-json').addEventListener('click', downloadManifest);
    q('#imp-try').addEventListener('click', openPreview);
    q('#imp-ok').addEventListener('click', commit);

    q('#imp-clear').addEventListener('click', function () {
      S.pkg = null; S.manifest = null; S.files = []; S.raw = [];
      paintFiles();
      paintResults([]);
      tip('已清空，可以重新拖入', '');
    });

    q('#imp-list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-del]');
      if (!b) return;
      var i = Number(b.getAttribute('data-del'));
      var f = S.raw[i];
      if (!f) return;
      S.raw.splice(i, 1);
      if (f === S.manifest) {
        S.manifest = null; S.pkg = null;
        S.files = S.raw.slice();
        tip('清单被移除了，需要重新拖入 case.json', 'is-err');
      } else {
        S.files = S.raw.filter(function (x) { return x !== S.manifest; });
      }
      paintFiles();
      preview();
    });

    ['#imp-title-in', '#imp-id', '#imp-scene', '#imp-ver', '#imp-date'].forEach(function (sel) {
      var el = q(sel);
      el.addEventListener('input', preview);
      el.addEventListener('change', function () {
        if (sel === '#imp-scene') {
          var idEl = q('#imp-id');
          if (!idEl.value || /-case(-\d+)?$/.test(idEl.value)) idEl.value = suggestId(el.value);
          paintMethods();   /* 换场景后按新场景重置技术勾选 */
        }
        preview();
      });
    });

    /* 技术芯片：勾选状态同步到样式并刷新校验 */
    q('#imp-methods').addEventListener('change', function (e) {
      var lab = e.target.closest('.imp-mchip');
      if (lab) lab.classList.toggle('on', e.target.checked);
      preview();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (S.pv && !S.pv.hidden) { closePreview(); return; }
      if (!S.el.hidden) close();
    });
  }

  function reset(opts) {
    S.pkg = null; S.manifest = null; S.files = []; S.raw = [];
    q('#imp-file').value = '';
    q('#imp-dir').value = '';
    q('#imp-pack').hidden = true;
    q('#imp-title-in').value = '';
    q('#imp-id').value = '';
    q('#imp-ver').value = '';
    q('#imp-date').value = today();
    q('#imp-scene').innerHTML = sceneOptions((opts && opts.sceneId) || '');
    q('#imp-scene').value = (opts && opts.sceneId) || '';
    if (opts && opts.sceneId) q('#imp-id').value = suggestId(opts.sceneId);
    paintMethods();
    paintResults([]);
    tip('表单里的名称 / 场景会覆盖清单里的同名字段。', '');
  }

  function open(opts) {
    if (!S.el) { S.el = build(); bind(); }
    reset(opts || {});
    S.el.hidden = false;
    document.documentElement.classList.add('mdl-open');
    setTimeout(function () { q('#imp-title-in').focus(); }, 60);
  }

  function close() {
    if (!S.el) return;
    closePreview();
    S.el.hidden = true;
    document.documentElement.classList.remove('mdl-open');
  }

  /* ---------------------------------------------------------
     7. 提示条
     --------------------------------------------------------- */
  var toastTimer = null;
  function toast(title, sub) {
    var el = document.getElementById('imp-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'imp-toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.innerHTML = '<span class="toast-ic">✓</span><div><b>' + esc(title) + '</b>' +
      (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>';
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 3000);
  }

  /* ---------------------------------------------------------
     8. 对外接口
     --------------------------------------------------------- */
  function loadSaved() {
    /* v2 */
    saved = readStore(KEY).filter(function (r) { return r && r.pkg && r.meta && r.meta.id; });
    /* v1：只有清单没有文件，按原样升级 */
    readStore(KEY_V1).forEach(function (r) {
      if (!r || !r.pkg || !r.meta || !r.meta.id) return;
      if (saved.some(function (x) { return x.meta.id === r.meta.id; })) return;
      saved.push({ v: 1, pkg: r.pkg, meta: r.meta, files: [], savedAt: r.savedAt });
    });

    saved.forEach(function (r) {
      if (global.Cases.get(r.meta.id)) return;   /* JS 插件优先 */
      global.Cases.register(toCase(r));
    });
    /* 最后应用隐藏名单：被删除的插件案例不再出现 */
    applyBlocklist();
  }

  /* 删除案例：上传案例 = 移除本地存储；插件案例 = 记入隐藏名单。
     两者都在本次会话内立即注销并触发页面重渲染，不刷新。 */
  function remove(id) {
    var c = global.Cases.get(id);
    if (!c) return false;
    var isImported = !!c.imported;
    var msg = isImported
      ? '从本机移除案例「' + (c.title || id) + '」？\n将删除浏览器里保存的这份案例包，磁盘上的文件不受影响。'
      : '删除插件案例「' + (c.title || id) + '」？\n它的 .js 文件仍留在磁盘上，但会立即从站点消失，刷新后也保持隐藏；\n在案例库的「已隐藏」区可以随时恢复。';
    if (!global.confirm(msg)) return false;

    if (isImported) {
      saved = saved.filter(function (r) { return r.meta.id !== id; });
      writeStore(saved);
    } else {
      var bl = readBlocklist();
      if (bl.indexOf(id) < 0) { bl.push(id); writeBlocklist(bl); }
    }
    global.Cases.unregister(id);
    toast('已删除「' + (c.title || id) + '」', '页面已同步更新');
    global.dispatchEvent(new Event('hashchange'));
    return true;
  }

  /* 恢复被隐藏的插件案例：移出名单后刷新，让插件脚本重新注册 */
  function restore(id) {
    var bl = readBlocklist().filter(function (x) { return x !== id; });
    writeBlocklist(bl);
    global.location.reload();
    return true;
  }

  /* 管理后台编辑案例元信息：只支持本机上传的案例（插件案例的内容在磁盘文件里）。
     patch = { title, sceneId, methods, version, updated }，全部可选。 */
  function updateMeta(id, patch) {
    var rec = saved.filter(function (r) { return r.meta.id === id; })[0];
    if (!rec) return { ok: false, error: '不是本机上传的案例，无法在线编辑（插件案例请改源文件）' };
    var p = patch || {};
    if (p.title != null) rec.meta.title = String(p.title).slice(0, 40);
    if (p.version != null) rec.meta.version = String(p.version).slice(0, 16);
    if (p.updated != null) rec.meta.updated = String(p.updated).slice(0, 10);
    if (p.sceneId != null) {
      if (!sceneOf(p.sceneId)) return { ok: false, error: '目标场景不存在：' + p.sceneId };
      rec.meta.sceneId = p.sceneId;
    }
    if (p.methods != null) {
      if (!Array.isArray(p.methods)) return { ok: false, error: 'methods 应为数组' };
      rec.meta.methods = p.methods.filter(function (k) {
        return global.ATLAS.methods && global.ATLAS.methods[k];
      });
    }
    if (!writeStore(saved)) return { ok: false, error: '浏览器存储失败' };
    global.Cases.unregister(id);
    global.Cases.register(toCase(rec));
    return { ok: true };
  }

  function exported() {
    return saved.map(function (r) {
      return { id: r.meta.id, title: r.meta.title, sceneId: r.meta.sceneId, files: (r.files || []).length, savedAt: r.savedAt };
    });
  }

  global.CaseImport = {
    open: open,
    close: close,
    loadSaved: loadSaved,
    remove: remove,
    restore: restore,
    updateMeta: updateMeta,
    blockedList: readBlocklist,
    list: exported,
    template: templateManifest,
    check: function (pkg, meta) { return checkAll(pkg, meta, S.files); },
    makeZip: makeZip,
    templates: { manifest: TPL_README, html: TPL_HTML, css: TPL_CSS, js: TPL_JS }
  };

  /* 事件委托：任何带 data-import 的按钮都能唤起弹窗 */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-import]');
    if (!btn) return;
    e.preventDefault();
    open({ sceneId: btn.getAttribute('data-scene') || '' });
  });

  /* 指南页/其它地方的"下载模板"按钮 */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-dl-template]');
    if (!btn) return;
    e.preventDefault();
    if (!S.el) { S.el = build(); bind(); }
    downloadTemplate();
  });

  /* 案例库里的"移除/删除案例"（上传案例与插件案例共用） */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove-case]');
    if (!btn) return;
    e.preventDefault();
    remove(btn.getAttribute('data-remove-case'));
  });

  /* 案例库"已隐藏"区里的"恢复" */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-restore-case]');
    if (!btn) return;
    e.preventDefault();
    restore(btn.getAttribute('data-restore-case'));
  });

  /* 启动即恢复：必须在 shell.js 渲染之前完成 */
  if (global.Cases) {
    try { loadSaved(); } catch (e) { /* 存储损坏时静默跳过，不影响站点启动 */ }
  }

})(window);

</script>

<script>
/* =========================================================
   管理后台 Admin
   ---------------------------------------------------------
   路由：#/admin          登录（未登录时）
         #/admin/cases    案例：改标题 / 场景 / 技术标签 / 版本，删除
         #/admin/methods  技术：增删改 AI 技术类别
         #/admin/scenes   场景：增删改场景（绑定环节 / 技术标签 / 难度）
   账号：存在 localStorage[atlas.admin.v1]，首次自动创建
         admin / admin123（登录后可在页面上改密码）。
   场景与技术的增删改走 data.js 的 A.saveMethod / A.deleteMethod /
   A.saveScene / A.deleteScene，写入 localStorage 后全站立即生效。
   注意：这是纯静态演示站，密码仅做形式鉴权，不是安全边界。
   ========================================================= */

(function (global) {
  'use strict';

  var KEY = 'atlas.admin.v1';
  var SESS = 'atlas.admin.session';
  var ID_RE = /^[a-z0-9]+(-[a-z0-9]+)*$/;

  /* djb2 —— 形式鉴权用，不追求密码学强度 */
  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  function account() {
    var r = null;
    try { r = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
    if (!r || !r.user || !r.hash) {
      r = { user: 'admin', hash: hash('admin123') };
      try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) { }
    }
    return r;
  }

  function loggedIn() { return global.sessionStorage.getItem(SESS) === '1'; }

  function refresh() { global.dispatchEvent(new Event('hashchange')); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* =========================================================
     登录页
     ========================================================= */
  function loginHTML(msg) {
    return '<main class="wrap" style="max-width:460px;padding-top:70px">' +
      '<div class="adm-card">' +
      '<div class="eyebrow">ADMIN SIGN IN</div><h2 style="margin:8px 0 4px">管理员登录</h2>' +
      '<p class="small muted">登录后可管理案例、技术类别与场景。默认账号 <b>admin</b>，默认密码 <b>admin123</b>，登录后请尽快修改。</p>' +
      (msg ? '<div class="callout warn" style="margin:12px 0"><span class="ci">!</span><span>' + esc(msg) + '</span></div>' : '') +
      '<label class="imp-f"><span>账号</span><input type="text" id="adm-user" autocomplete="username"></label>' +
      '<label class="imp-f"><span>密码</span><input type="password" id="adm-pass" autocomplete="current-password"></label>' +
      '<div style="display:flex;gap:8px;margin-top:16px">' +
      '<button class="btn primary" id="adm-login">登录</button>' +
      '<a class="btn ghost" href="#/">返回站点</a></div>' +
      '<p class="small muted" style="margin-top:14px">本站为纯静态演示，账号只做操作门槛，不是安全边界。</p>' +
      '</div></main>';
  }

  function doLogin() {
    var u = document.getElementById('adm-user');
    var p = document.getElementById('adm-pass');
    var acc = account();
    if (u.value.trim() !== acc.user || hash(p.value) !== acc.hash) {
      alert('账号或密码不对。默认 admin / admin123。');
      return;
    }
    global.sessionStorage.setItem(SESS, '1');
    global.location.hash = '#/admin/cases';
    refresh();
  }

  function bindLogin() {
    var b = document.getElementById('adm-login');
    if (!b) return;
    b.addEventListener('click', doLogin);
    document.getElementById('adm-pass').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
  }

  /* =========================================================
     页面骨架
     ========================================================= */
  var TABS = [
    ['', '概览'], ['cases', '案例管理'], ['methods', '技术管理'], ['scenes', '场景管理']
  ];

  function shellHTML(cur, inner) {
    var tabs = TABS.map(function (t) {
      var href = '#/admin' + (t[0] ? '/' + t[0] : '');
      return '<button class="chip' + (cur === t[0] ? ' on' : '') + '" data-adm-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('');
    return '<main class="wrap">' +
      '<div class="page-head"><div class="ph-top"><div>' +

      '</div><div class="ph-stat"><div><div class="n">' + global.Cases.list().length + '</div><div class="l">案例</div></div>' +

      inner + '</main>';

  /* 页面内操作反馈（不用 alert：不阻塞，且能在无头环境正常工作） */
  function admMsg(text, isErr) {

  function stageOptions(sel) {

      return '<option value="' + esc(st.id) + '"' + (st.id === sel ? ' selected' : '') + '>' +
        esc(st.idx + ' ' + st.name) + '</option>';
    }).join('');
  }

  /* =========================================================
     概览
     ========================================================= */
  function overviewHTML() {
    var s = global.Cases.stats();
    var A = global.ATLAS;
    return '<div class="adm-grid">' +
      '<div class="adm-card"><h4>案例接入</h4>' +

      '<a class="btn sm" href="#/cases">打开案例库 →</a></div>' +

      Object.keys(A.methods).map(function (k) { return esc(A.methods[k].name); }).join('、') + '。</p>' +
      '<p class="small muted">删除某类技术前，需要先把它从所有场景上摘掉。</p></div>' +
      '<div class="adm-card"><h4>安全提示</h4>' +

        (c.imported ? ' <span class="badge-local">本地导入</span>' : '') + '</div></td>' +
        '<td>' + mChips + '</td>' +

        '<td>' +
        '<a href="#" class="link-remove" data-adm-edit-case="' + esc(c.id) + '">编辑</a> ' +
        '<a href="#" class="link-remove" data-adm-del-case="' + esc(c.id) + '">删除</a>' +
        '</td></tr>';
    }).join('');

    return '<div class="adm-note">' +
      '<b>编辑</b>只对本机上传的案例生效（可改标题、场景、技术标签、版本）；插件案例的内容在磁盘文件里，请改源文件。' +
      '同一个场景可以挂多个案例。</div>' +
      '<div class="matrix-wrap" style="box-shadow:var(--sh-1)">' +
      '<table class="sys-table"><thead><tr>' +
      '<th>案例 id</th><th>标题 / 场景</th><th>技术标签</th><th>版本</th><th>操作</th>' +
      '</tr></thead><tbody>' + (rows || '<tr><td colspan="5" class="empty">还没有案例</td></tr>') + '</tbody></table></div>';
  }

  function editCaseHTML(id) {
    var c = global.Cases.get(id);
    if (!c) return '';
    if (!c.imported) {
      return '<div class="adm-edit"><div class="callout warn"><span class="ci">!</span><span>「' + esc(id) +
        '」是插件案例（assets/cases/*.case.js），内容在磁盘文件里，只能删除或改源文件，无法在线编辑。</span></div></div>';
    }

      '<div class="adm-form">' +
      '<label class="imp-f"><span>标题</span><input type="text" id="adm-c-title" value="' + esc(c.title || '') + '" maxlength="40"></label>' +

      '<button class="btn sm ghost" id="adm-c-cancel">取消</button></div>' +
      '</div>';
  }

  function sceneOptionsFor(sel) {
    return global.ATLAS.stages.map(function (st) {
      return '<optgroup label="' + esc(st.name) + '">' + st.scenes.map(function (sc) {
        return '<option value="' + esc(sc.id) + '"' + (sc.id === sel ? ' selected' : '') + '>' + esc(sc.name) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
  }

  /* =========================================================
     技术管理
     ========================================================= */
  function methodsHTML(editKey) {

    var editing = editKey ? A.methods[editKey] : null;
    var rows = Object.keys(A.methods).map(function (k) {
      var m = A.methods[k];
      var used = A.allScenes.filter(function (s) { return s.methods.indexOf(k) >= 0; }).length;
      var builtin = !A.colors || A.colors[k] === k;
      return '<tr><td class="id">' + esc(k) + '</td>' +
        '<td class="nm">' + esc(m.abbr) + '</td>' +
        '<td>' + esc(m.name) + (builtin ? ' <span class="dim-mark">内置</span>' : ' <span class="badge-local">自定义</span>') + '</td>' +
        '<td class="sc">' + esc(m.signal || '—') + '</td>' +
        '<td>' + used + ' 个场景</td>' +
        '<td><a href="#" class="link-remove" data-adm-edit-m="' + esc(k) + '">编辑</a> ' +
        '<a href="#" class="link-remove" data-adm-del-m="' + esc(k) + '">删除</a></td></tr>';
    }).join('');

    return '<div class="adm-edit">' +
      '<h4>' + (editing ? '编辑技术：' + esc(editKey) : '新增技术类别') + '</h4>' +
      '<div class="adm-form">' +
      '<label class="imp-f"><span>key（小写英文）<i>*</i></span>' +
      '<input type="text" id="adm-m-key" ' + (editing ? 'value="' + esc(editKey) + '" readonly' : 'placeholder="agent"') + ' maxlength="12">' +
      '<em>用于配色与场景标签，建好后不可改</em></label>' +
      '<div class="adm-f2">' +
      '<label class="imp-f"><span>缩写 <i>*</i></span><input type="text" id="adm-m-abbr" value="' + esc(editing ? editing.abbr : '') + '" placeholder="AG" maxlength="6"></label>' +

      '</div>' +
      '<label class="imp-f"><span>一句话说明</span><input type="text" id="adm-m-desc" value="' + esc(editing ? editing.desc : '') + '" maxlength="120"></label>' +
      '<label class="imp-f"><span>擅长信号</span><input type="text" id="adm-m-signal" value="' + esc(editing ? editing.signal : '') + '" placeholder="预测 / 分段 / 异常" maxlength="24"></label>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button class="btn primary sm" id="adm-m-save">' + (editing ? '保存修改' : '添加技术') + '</button>' +
      (editing ? '<button class="btn sm ghost" id="adm-m-cancel">取消编辑</button>' : '') +
      '</div></div>' +

      '<div class="matrix-wrap" style="box-shadow:var(--sh-1);margin-top:16px">' +
      '<table class="sys-table"><thead><tr>' +
      '<th>key</th><th>缩写</th><th>名称</th><th>擅长信号</th><th>使用量</th><th>操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* =========================================================
     场景管理
     ========================================================= */
  function scenesHTML(editId) {
    var A = global.ATLAS;
    var editing = editId ? A.index.byScene[editId] : null;
    var rows = A.allScenes.map(function (sc) {
      var n = global.Cases.bySceneAll(sc.id).length;
      return '<tr><td class="id">' + esc(sc.id) + '</td>' +
        '<td><div class="nm">' + esc(sc.name) + (sc.__user ? ' <span class="badge-local">自定义</span>' : '') + '</div>' +
        '<div class="sc">' + esc(sc.stageName) + '</div></td>' +
        '<td class="sc">' + esc(sc.methods.join(' / ')) + '</td>' +
        '<td>' + esc(sc.diff) + '</td>' +
        '<td>' + (n ? '<span class="ok-mark">' + n + ' 个案例</span>' : '<span class="dim-mark">未接入</span>') + '</td>' +
        '<td><a href="#" class="link-remove" data-adm-edit-s="' + esc(sc.id) + '">编辑</a> ' +
        '<a href="#" class="link-remove" data-adm-del-s="' + esc(sc.id) + '">删除</a></td></tr>';
    }).join('');

    var diffSel = function (cur) {
      return ['低', '中', '高'].map(function (d) {

      }).join('');

      '<h4>' + (editing ? '编辑场景：' + esc(editing.id) : '新增场景') + '</h4>' +
      '<div class="adm-form">' +
      '<div class="adm-f2">' +
      '<label class="imp-f"><span>场景 id <i>*</i></span>' +
      '<input type="text" id="adm-s-id" ' + (editing ? 'value="' + esc(editing.id) + '" readonly' : 'placeholder="w9"') + ' maxlength="8"></label>' +
      '<label class="imp-f"><span>场景名称 <i>*</i></span>' +
      '<input type="text" id="adm-s-name" value="' + esc(editing ? editing.name : '') + '" maxlength="30"></label>' +
      '</div>' +
      '<div class="adm-f3">' +
      '<label class="imp-f"><span>所属环节</span><select id="adm-s-stage">' +
      stageOptions(editing ? editing.stageId : '') + '</select></label>' +
      '<label class="imp-f"><span>难度</span><select id="adm-s-diff">' + diffSel(editing && editing.diff) + '</select></label>' +
      '<label class="imp-f"><span>状态</span><select id="adm-s-status">' +
      '<option value="full"' + (!editing || editing.status === 'full' ? ' selected' : '') + '>详解</option>' +
      '<option value="ext"' + (editing && editing.status === 'ext' ? ' selected' : '') + '>待扩展</option></select></label>' +
      '</div>' +
      '<div class="imp-f"><span>技术类别 <i>*</i></span>' +
      chipBox('adm-s-methods', Object.keys(A.methods), editing ? editing.methods : []) + '</div>' +
      '<label class="imp-f"><span>场景介绍（一句话）</span><input type="text" id="adm-s-intro" value="' + esc(editing ? editing.intro : '') + '" maxlength="120"></label>' +
      '<label class="imp-f"><span>AI 介入点</span><input type="text" id="adm-s-point" value="' + esc(editing ? editing.point : '') + '" maxlength="120"></label>' +
      '<label class="imp-f"><span>业务问题描述</span><input type="text" id="adm-s-problem" value="' + esc(editing ? editing.problem : '') + '" maxlength="120"></label>' +
      '<label class="imp-f"><span>难度原因</span><input type="text" id="adm-s-why" value="' + esc(editing ? editing.diffWhy : '') + '" maxlength="120"></label>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button class="btn primary sm" id="adm-s-save">' + (editing ? '保存修改' : '添加场景') + '</button>' +
      (editing ? '<button class="btn sm ghost" id="adm-s-cancel">取消编辑</button>' : '') +
      '</div></div>' +

      '<div class="matrix-wrap" style="box-shadow:var(--sh-1);margin-top:16px">' +
      '<table class="sys-table"><thead><tr>' +
      '<th>id</th><th>场景</th><th>技术</th><th>难度</th><th>案例</th><th>操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* =========================================================
     路由与事件
     ========================================================= */
  function route(p, q) {
    if (!loggedIn()) return loginHTML();
    var sub = p[1] || '';
    var editId = q.edit || '';
    var inner;
    if (sub === 'cases') inner = (editId ? editCaseHTML(editId) : '') + casesHTML();
    else if (sub === 'methods') inner = methodsHTML(editId);
    else if (sub === 'scenes') inner = scenesHTML(editId);
    else inner = overviewHTML();
    return shellHTML(sub, inner);
  }

  function chipVals(id) {
    var box = document.getElementById(id);
    if (!box) return [];
    return [].slice.call(box.querySelectorAll('input:checked')).map(function (i) { return i.value; });
  }
  function bindChips(id) {
    var box = document.getElementById(id);
    if (!box) return;
    box.addEventListener('change', function (e) {
      var lab = e.target.closest('.imp-mchip');
      if (lab) lab.classList.toggle('on', e.target.checked);
    });
  }
  /* 在页面上挂一个委托点击监听；sel 里自己判断目标 */
  function bindCheck(root, sel) {
    root.addEventListener('click', sel);
  }
  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function bind(root) {
    if (!loggedIn()) { bindLogin(); return; }

    /* 顶栏 */
    [].forEach.call(root.querySelectorAll('[data-adm-tab]'), function (b) {
      b.addEventListener('click', function () {
        global.location.hash = '#/admin' + (b.dataset.admTab ? '/' + b.dataset.admTab : '');
      });
    });
    var lo = document.getElementById('adm-logout');
    if (lo) lo.addEventListener('click', function () {
      global.sessionStorage.removeItem(SESS);
      global.location.hash = '#/';
      refresh();
    });
    var pb = document.getElementById('adm-pass-btn');
    if (pb) pb.addEventListener('click', function () {
      var p = prompt('输入新密码（至少 6 位）：');
      if (p == null) return;
      if (p.length < 6) { alert('密码太短'); return; }
      var acc = account();
      acc.hash = hash(p);
      try { localStorage.setItem(KEY, JSON.stringify(acc)); alert('密码已更新'); }
      catch (e) { alert('保存失败：' + e.message); }
    });

    /* 案例编辑 */
    bindCheck(root, function (e) {
      var t = e.target.closest('[data-adm-edit-case]');
      if (t) { e.preventDefault(); global.location.hash = '#/admin/cases?edit=' + t.dataset.admEditCase; }
    });
    bindCheck(root, function (e) {
      var t = e.target.closest('[data-adm-del-case]');
      if (!t) return;
      e.preventDefault();
      global.CaseImport.remove(t.dataset.admDelCase);
      refresh();
    });
    bindCheck(root, function (e) {
      if (e.target.id !== 'adm-c-save' && e.target.id !== 'adm-c-cancel') return;
      e.preventDefault();
      if (e.target.id === 'adm-c-cancel') { global.location.hash = '#/admin/cases'; return; }
      var r = global.CaseImport.updateMeta(root.querySelector('.adm-edit').dataset.editing, {
        title: val('adm-c-title'),
        sceneId: val('adm-c-scene'),
        methods: chipVals('adm-c-methods'),
        version: val('adm-c-ver'),
        updated: val('adm-c-date')
      });
      admMsg(r.ok ? '已保存，站点已同步更新。' : ('保存失败：' + r.error), !r.ok);
      if (r.ok) { global.location.hash = '#/admin/cases'; refresh(); }
    });
    bindChips('adm-c-methods');

    /* 技术管理 */
    bindCheck(root, function (e) {
      var t = e.target.closest('[data-adm-edit-m]');
      if (t) { e.preventDefault(); global.location.hash = '#/admin/methods?edit=' + t.dataset.admEditM; }
    });
    bindCheck(root, function (e) {
      var t = e.target.closest('[data-adm-del-m]');
      if (!t) return;
      e.preventDefault();
      if (!confirm('删除技术类别「' + t.dataset.admDelM + '」？')) return;
      var r = global.ATLAS.deleteMethod(t.dataset.admDelM);
      if (!r.ok) admMsg(r.error, true); else admMsg('技术类别已删除。');
      refresh();
    });
    bindCheck(root, function (e) {
      if (e.target.id !== 'adm-m-save' && e.target.id !== 'adm-m-cancel') return;
      e.preventDefault();
      if (e.target.id === 'adm-m-cancel') { global.location.hash = '#/admin/methods'; return; }
      var r = global.ATLAS.saveMethod({
        key: val('adm-m-key'),
        abbr: val('adm-m-abbr'),
        name: val('adm-m-name'),
        desc: val('adm-m-desc'),
        signal: val('adm-m-signal')
      });
      if (!r.ok) { admMsg(r.error, true); return; }
      global.location.hash = '#/admin/methods';
      refresh();
    });

    /* 场景管理 */
    bindCheck(root, function (e) {
      var t = e.target.closest('[data-adm-edit-s]');
      if (t) { e.preventDefault(); global.location.hash = '#/admin/scenes?edit=' + t.dataset.admEditS; }
    });
    bindCheck(root, function (e) {
      var t = e.target.closest('[data-adm-del-s]');
      if (!t) return;
      e.preventDefault();
      if (!confirm('删除场景「' + t.dataset.admDelS + '」？关联的环节列表会同步移除。')) return;
      var r = global.ATLAS.deleteScene(t.dataset.admDelS);
      if (!r.ok) admMsg(r.error, true); else admMsg('场景已删除。');
      refresh();
    });
    bindCheck(root, function (e) {
      if (e.target.id !== 'adm-s-save' && e.target.id !== 'adm-s-cancel') return;
      e.preventDefault();
      if (e.target.id === 'adm-s-cancel') { global.location.hash = '#/admin/scenes'; return; }
      var r = global.ATLAS.saveScene({
        id: val('adm-s-id'),
        name: val('adm-s-name'),
        stageId: val('adm-s-stage'),
        methods: chipVals('adm-s-methods'),
        diff: val('adm-s-diff'),
        status: val('adm-s-status'),
        intro: val('adm-s-intro'),
        point: val('adm-s-point'),
        problem: val('adm-s-problem'),
        diffWhy: val('adm-s-why')
      });
      if (!r.ok) { admMsg(r.error, true); return; }
      global.location.hash = '#/admin/scenes';
      refresh();
    });
    bindChips('adm-s-methods');
  }

  global.Admin = {
    loggedIn: loggedIn,
    route: route,
    bind: bind
  };
})(window);

</script>

<script>
/* =========================================================
   应用外壳 Shell
   ---------------------------------------------------------
   职责：路由、页面骨架、导航、把案例挂到场景页上。
   不含任何具体案例的业务内容 —— 那些都在 assets/cases/*.js
   ========================================================= */

(function (global) {
  'use strict';

  var A = global.ATLAS;
  var M = A.methods;
  var K = global.K;
  var esc = K.esc, pad = K.pad, rich = K.rich;

  var view = document.getElementById('view');
  var mounted = null;          // 当前挂载中的示范，切页时调用其 unmount
  var mountedKey = '';

  /* =========================================================
     一、路由
     ========================================================= */
  function parseHash() {
    var h = location.hash.replace(/^#/, '') || '/';
    var qi = h.indexOf('?'), qs = '';
    if (qi >= 0) { qs = h.slice(qi + 1); h = h.slice(0, qi); }
    var q = {};
    qs.split('&').forEach(function (kv) {
      if (!kv) return;
      var p = kv.split('=');
      q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    return { parts: h.split('/').filter(Boolean), q: q };
  }

  function go(hash) { location.hash = hash; }

  /* file:// 协议下部分浏览器会拒绝 replaceState，失败时静默降级 */
  function setHashQuiet(hash) {
    try { history.replaceState(null, '', hash); }
    catch (e) { /* 忽略：地址栏不同步不影响功能 */ }
  }

  /* =========================================================
     二、公共片段
     ========================================================= */
  function header() {
    var r = parseHash();
    var cur = r.parts[0] || 'home';
    function on(k) { return cur === k ? ' on' : ''; }
    return '<header class="hdr"><div class="hdr-in">' +
      '<a class="brand" href="#/">' +
      '<span class="brand-mark">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round">' +
      '<path d="M3 17l5-6 4 3 4-6 5 4"/><circle cx="8" cy="11" r="1.6" fill="#fff" stroke="none"/>' +
      '</svg></span>' +
      '<span class="brand-txt"><b>智能化可能性地图</b><span>Petro × AI Atlas</span></span></a>' +
      '<nav class="nav">' +
      '<a class="nav-keep' + on('home') + '" href="#/">总览</a>' +
      '<a class="nav-keep' + on('chain') + '" href="#/chain">作业链</a>' +
      '<a class="nav-keep' + on('cases') + '" href="#/cases">案例库</a>' +
      '<a class="nav-keep' + on('guide') + '" href="#/guide">接入指南</a>' +
      '<a class="nav-keep' + on('admin') + '" href="#/admin">' + (Admin.loggedIn() ? '管理后台' : '管理') + '</a>' +
      '<button class="nav-add" data-import>＋ 添加案例</button>' +
      '</nav></div></header>';
  }

  function footer() {
    var s = Cases.stats();
    return '<footer class="ftr"><div class="wrap"><div class="ftr-in">' +
      '<div class="ftr-col" style="max-width:30ch">' +
      '<h5>关于</h5><p>' + esc(A.meta.title) + '</p>' +
      '<p style="margin-top:8px;color:var(--ink-4)">' + esc(A.meta.version) + ' · 更新于 ' + esc(A.meta.updated) + '</p></div>' +
      '<div class="ftr-col"><h5>地图</h5>' +
      '<a href="#/">总览</a><a href="#/chain">作业链</a><a href="#/method/cv">按方法反查</a></div>' +
      '<div class="ftr-col"><h5>系统</h5>' +
      '<a href="#/cases">案例库（' + s.registered + ' 个已接入）</a>' +
      '<a href="#/guide">接入新案例</a></div>' +
      '<div class="ftr-col"><h5>参与</h5>' +
      '<p>发现问题或想补一个场景？</p>' +
      '<a href="mailto:' + esc(A.meta.email) + '">' + esc(A.meta.email) + '</a></div>' +
      '</div>' +
      '<div class="ftr-bot"><span>场景数据：' + A.allScenes.length + ' 个 · 环节：' + A.stages.length + ' 个</span>' +
      '<span>纯静态 · 无后端 · 可离线运行</span></div>' +
      '</div></footer>';
  }

  function crumb(items) {
    return '<nav class="crumb">' + items.map(function (it, i) {
      var last = i === items.length - 1;
      return (i ? '<span class="sep">/</span>' : '') +
        (last ? '<span class="cur">' + esc(it[1]) + '</span>' : '<a href="' + it[0] + '">' + esc(it[1]) + '</a>');
    }).join('') + '</nav>';
  }

  function methodChip(k) {
    var ck = (M[k] && (M[k].colorKey || k)) || 'cv';
    return '<span class="mtag" data-m="' + ck + '"><b>' + M[k].abbr + '</b>' + esc(M[k].name) + '</span>';
  }

  function caseChip(k) {  /* 案例 methods 标签（小号） */
    var m = M[k];
    if (!m) return '';
    var ck = m.colorKey || k;
    return '<span class="mtag sm" data-m="' + ck + '"><b>' + esc(m.abbr) + '</b>' + esc(m.name) + '</span>';
  }

  function stageBar(stageId) {
    var counts = A.countByStageMethod()[stageId];
    var keys = Object.keys(counts).filter(function (k) { return counts[k] > 0; });
    if (!keys.length) return '<div class="step-bar"><i class="empty"></i></div>';
    return '<div class="step-bar">' + keys.map(function (k) {
      var ck = (M[k] && (M[k].colorKey || k)) || 'cv';
      return '<i style="flex:' + counts[k] + ';background:var(--c-' + ck + ')"></i>';
    }).join('') + '</div>';
  }

  /* =========================================================
     三、首页
     ========================================================= */
  function homeHTML() {
    var s = A.stats();
    var cs = Cases.stats();
    var total = A.allScenes.length;
    var keys = Object.keys(M);

    /* 方法构成条：一根堆叠条 + 图例，替代原先与下方方法面板重复的 5 张色块 */
    var compBar = keys.map(function (k) {
      var n = (A.index.byMethod[k] || []).length;
      return '<i style="width:' + (n / total * 100).toFixed(2) + '%;background:var(--c-' + (M[k].colorKey || k) + ')"></i>';
    }).join('');
    var compLegend = keys.map(function (k) {
      var n = (A.index.byMethod[k] || []).length;
      return '<a href="#/method/' + k + '"><i style="background:var(--c-' + (M[k].colorKey || k) + ')"></i>' + M[k].abbr +
        '<b>' + n + '</b></a>';
    }).join('');

    var coverPct = total ? Math.round(cs.coveredScenes / total * 100) : 0;
    var coverBar =
      '<i style="width:' + coverPct + '%;background:var(--jade)"></i>' +
      '<i style="width:' + (100 - coverPct) + '%;background:var(--line)"></i>';

    var diffBar =
      '<i style="width:' + (s.diff.低 / total * 100).toFixed(2) + '%;background:var(--ok)"></i>' +
      '<i style="width:' + (s.diff.中 / total * 100).toFixed(2) + '%;background:var(--warn)"></i>' +
      '<i style="width:' + (s.diff.高 / total * 100).toFixed(2) + '%;background:var(--bad)"></i>';

    var chain = A.stages.map(function (st) {
      return '<a class="step" href="#/stage/' + st.id + '">' +
        '<div class="step-idx">' + pad(st.idx) + '</div>' +
        '<div class="step-name">' + esc(st.name) + '</div>' +
        '<div class="step-n">' + st.scenes.length + '<span>场景</span></div>' +
        stageBar(st.id) + '</a>';
    }).join('');

    var mcards = Object.keys(M).map(function (k) {
      return '<a class="mcard" data-m="' + (M[k].colorKey || k) + '" href="#/method/' + k + '">' +
        '<div class="abbr"><b>' + M[k].abbr + '</b><span>' + esc(M[k].signal) + '</span></div>' +
        '<div class="nm">' + esc(M[k].name) + '</div>' +
        '<div class="ds">' + esc(M[k].desc) + '</div>' +
        '<div class="cnt"><b>' + (A.index.byMethod[k] || []).length + '</b>个场景</div></a>';
    }).join('');

    return '<main>' +
      '<section class="hero"><div class="wrap"><div class="hero-grid">' +

      '<div class="hero-main">' +
      '<div class="hero-top">' +
      '<span class="hero-badge">' + esc(A.meta.version) + ' · ' + total + ' 个候选场景</span>' +
      '<span class="hero-badge alt">案例系统 · ' + cs.registered + ' 个已接入</span>' +
      '</div>' +
      '<h1>石油勘探开发的<em>智能化</em><br>可能性地图</h1>' +
      '<p class="hero-lead">把整条作业链拆成 ' + total + ' 个候选场景，逐个说明：哪一步能被算法替掉、需要准备什么数据、难在哪里。带「可运行」标记的场景，可以直接在浏览器里跑一遍，看算法在什么条件下失效。</p>' +
      '<div class="hero-note"><div>' +
      '<p><b>这不是一个展示页，而是一个可扩展的系统。</b>场景元数据、案例内容、可运行示范三者分离；新增案例只需写一个插件文件并注册，外壳、导航、检索路径都会自动接上。</p>' +
      '</div></div>' +
      '<div class="hero-acts">' +
      '<a class="btn primary" href="#/chain">浏览完整作业链 <span class="ar">→</span></a>' +
      '<a class="btn" href="#/scene/w1?tab=demo">看一个可运行示范</a>' +
      '</div>' +
      '</div>' +

      '<aside class="spec">' +
      '<div class="spec-h"><span class="mono">AT A GLANCE · 速览</span><span class="mono">' + esc(A.meta.version) + '</span></div>' +
      '<div class="spec-body">' +
      '<div class="spec-row"><span class="k">作业环节</span><span class="v">' + A.stages.length + '<small>个</small></span></div>' +
      '<div class="spec-row"><span class="k">候选场景</span><span class="v">' + total + '<small>个</small></span></div>' +
      '<div class="spec-row"><span class="k">难度分布（低 / 中 / 高）</span><span class="v">' + s.diff.低 + '<small>/</small>' + s.diff.中 + '<small>/</small>' + s.diff.高 + '</span></div>' +
      '</div>' +
      '<div class="spec-bar">' + diffBar + '</div>' +
      '<div class="spec-body">' +
      '<div class="spec-row"><span class="k">已接入案例</span><span class="v">' + cs.registered + '<small>个</small></span></div>' +
      '<div class="spec-row"><span class="k">其中可运行示范</span><span class="v">' + cs.withDemo + '<small>个</small></span></div>' +
      '<div class="spec-row"><span class="k">案例覆盖场景</span><span class="v">' + cs.coveredScenes + '<small>/ ' + total + ' · ' + coverPct + '%</small></span></div>' +
      '</div>' +
      '<div class="spec-bar">' + coverBar + '</div>' +
      '<div class="spec-sub"><span class="mono">方法构成 · BY METHOD</span></div>' +
      '<div class="comp">' +
      '<div class="comp-bar">' + compBar + '</div>' +
      '<div class="comp-legend">' + compLegend + '</div>' +
      '</div>' +
      '<div class="spec-f"><span>数据截至 2026-10</span><span>教学用途</span></div>' +
      '</aside>' +

      '</div></div></section>' +

      /* 按环节找 */
      '<section class="section"><div class="wrap">' +
      '<div class="sec-head">' +
      '<div class="sec-rail"><span class="sec-num">01</span><span class="kicker">BY STAGE</span>' +
      '<span class="r"><a class="btn sm ghost" href="#/chain">完整链条 →</a></span></div>' +
      '<h2>按环节找：我现在站在哪一步</h2>' +
      '<p>沿着作业链从左到右，每个节点下方的色条表示该环节可用的方法构成。点进去是该环节的场景清单。</p>' +
      '</div>' +
      '<div class="chain-wrap"><div class="chain-scroll"><div class="chain">' + chain + '</div></div>' +
      '<div class="chain-hint">← 横向滚动查看全部 ' + A.stages.length + ' 个环节</div></div>' +
      '</div></section>' +

      /* 按方法找 */
      '<section class="section"><div class="wrap">' +
      '<div class="sec-head">' +
      '<div class="sec-rail"><span class="sec-num">02</span><span class="kicker">BY METHOD</span></div>' +
      '<h2>按方法找：我手上有一套什么技术</h2>' +
      '<p>如果你已经有一支做 CV 或时序的团队，更自然的问法是「这套技术在这行能干什么」。点进去是跨环节的场景清单。</p>' +
      '</div>' +
      '<div class="methods">' + mcards + '</div>' +
      '</div></section>' +

      /* 矩阵 */
      '<section class="section"><div class="wrap">' +
      '<div class="sec-head">' +
      '<div class="sec-rail"><span class="sec-num">03</span><span class="kicker">MATRIX</span></div>' +
      '<h2>方法 × 环节：哪里已经被占满，哪里还是空白</h2>' +

      /* 系统构成 */
      '<section class="section"><div class="wrap">' +

  function matrixHTML() {
    var counts = A.countByStageMethod();
    var keys = Object.keys(M);
    var head = '<tr><th>环节</th>' + keys.map(function (k) {
      return '<th>' + M[k].abbr + '</th>';
    }).join('') + '<th>合计</th></tr>';

    var body = A.stages.map(function (st) {
      var c = counts[st.id];
      var rowTotal = st.scenes.length;
      return '<tr><th><i>' + pad(st.idx) + '</i>' + esc(st.name) + '</th>' +
        keys.map(function (k) {
          var n = c[k] || 0;
          return '<td class="' + (n ? '' : 'zero') + '"><a href="#/stage/' + st.id + '?m=' + k + '">' + (n || '·') + '</a></td>';
        }).join('') +
        '<td><a href="#/stage/' + st.id + '" style="color:var(--ink-3)">' + rowTotal + '</a></td></tr>';
    }).join('');

    var foot = '<tr><th>合计</th>' + keys.map(function (k) {
      return '<td>' + (A.index.byMethod[k] || []).length + '</td>';
    }).join('') + '<td>' + A.allScenes.length + '</td></tr>';

    return '<div class="matrix-wrap"><table class="matrix"><thead>' + head + '</thead><tbody>' + body +
      '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  }

  function chainHTML() {
    var rows = A.stages.map(function (st) {
      var top = st.scenes.slice(0, 5).map(function (s) { return s.name; }).join('、');

        '<div><div class="sr-name">' + esc(st.name) +
        '<span class="mono" style="font-size:9.5px;color:var(--ink-4);letter-spacing:.14em">' + esc(st.en).toUpperCase() + '</span>' +
        '<span class="arrow">→</span></div>' +
        '<div class="sr-point">' + esc(st.blurb) + '</div>' +
        '<div class="sr-meta">' + st.scenes.slice(0, 3).map(function (s) { return methodChip(s.methods[0]); }).join('') +
        '<span class="tag" style="margin-left:4px">' + esc(top) + (st.scenes.length > 5 ? '…' : '') + '</span></div></div>' +
        '<div class="sr-right"><span class="mono" style="font-size:19px;color:var(--ink-2)">' + st.scenes.length + '</span>' +

      '<div class="page-head"><div class="ph-top"><div>' +
      '<div class="ph-idx">CHAIN · ' + A.stages.length + ' 个环节</div>' +
      '<h1>从地质勘察到加工的全链条</h1>' +
      '<p class="blurb">上游到下游按作业顺序排列。每个环节标注可智能化的场景数量与方法构成，点进去看清单。</p>' +
      '</div><div class="ph-stat">' +
      '<div><div class="n">' + A.stages.length + '</div><div class="l">环节</div></div>' +
      '<div><div class="n">' + A.allScenes.length + '</div><div class="l">场景</div></div>' +
      '</div></div></div>' +
      '<div class="scenes">' + rows + '</div></main>';

  /* =========================================================
     五、环节页
     ========================================================= */
  function stageHTML(st, q) {
    var counts = {};
    st.scenes.forEach(function (s) { counts[s.diff] = (counts[s.diff] || 0) + 1; });
    var mFilter = q.m || '';
    var dFilter = q.d || '';

    var methodKeys = Object.keys(M).filter(function (k) {
      return st.scenes.some(function (s) { return s.methods.indexOf(k) >= 0; });
    });
    var methBtns = ['<button class="chip' + (mFilter ? '' : ' on') + '" data-f="m" data-v="">全部方法</button>'].concat(
      methodKeys.map(function (k) {
        return '<button class="chip' + (mFilter === k ? ' on' : '') + '" data-f="m" data-v="' + k + '" data-m="' + k + '">' + M[k].abbr + ' ' + esc(M[k].name) + '</button>';
      })).join('');

    var diffBtns = ['<button class="chip' + (dFilter ? '' : ' on') + '" data-f="d" data-v="">全部难度</button>'].concat(
      ['低', '中', '高'].map(function (d) {
        return '<button class="chip' + (dFilter === d ? ' on' : '') + '" data-f="d" data-v="' + d + '">' + d + '</button>';
      })).join('');

    var list = st.scenes.map(function (sc) {
      var cn = Cases.bySceneAll(sc.id).length;
      return '<a class="scene-row' + (sc.status === 'ext' ? ' is-ext' : '') + '" href="#/scene/' + sc.id + '" data-m="' + sc.methods.join(' ') + '" data-d="' + sc.diff + '">' +
        '<div class="sr-n">' + esc(sc.id.toUpperCase()) + '</div>' +
        '<div><div class="sr-name">' + esc(sc.name) +
        (cn ? '<span class="badge-ready">已接入案例' + (cn > 1 ? ' ×' + cn : '') + '</span>' : '') +
        '<span class="arrow">→</span></div>' +
        '<div class="sr-point">' + esc(sc.point) + '</div>' +
        '<div class="sr-meta">' + sc.methods.map(function (k) {
          var ck = (M[k] && (M[k].colorKey || k)) || 'cv';
          return '<span class="mtag" data-m="' + ck + '"><b>' + M[k].abbr + '</b>' + esc(M[k].name) + '</span>';
        }).join('') + '</div></div>' +
        '<div class="sr-right"><span class="dtag" data-d="' + sc.diff + '">难度 ' + sc.diff + '</span>' +
        (sc.demo ? '<span class="badge-wip" style="border-style:solid;color:var(--jade-d);background:var(--jade-l);border-color:rgba(47,125,107,.2)">可运行</span>' : '') +
        '</div></a>';
    }).join('');

    var idx = A.stages.indexOf(st);
    var prev = A.stages[idx - 1], next = A.stages[idx + 1];

    return '<main class="wrap">' +
      crumb([['#/', '总览'], ['#/chain', '作业链'], ['#/stage/' + st.id, st.name]]) +
      '<div class="page-head"><div class="ph-top"><div>' +
      '<div class="ph-idx">' + pad(st.idx) + ' / ' + pad(A.stages.length) + '</div>' +
      '<h1>' + esc(st.name) + '环节的可智能化场景<span class="en">' + esc(st.en) + '</span></h1>' +
      '<p class="blurb">' + esc(st.blurb) + '</p></div>' +
      '<div class="ph-stat">' +
      '<div><div class="n">' + st.scenes.length + '</div><div class="l">场景</div></div>' +
      '<div><div class="n">' + (counts.低 || 0) + '</div><div class="l">低难度</div></div>' +
      '<div><div class="n">' + (counts.高 || 0) + '</div><div class="l">高难度</div></div>' +
      '</div></div></div>' +

      '<div class="filters"><span class="lbl">方法</span>' + methBtns +
      '<span class="divider"></span><span class="lbl">难度</span>' + diffBtns +
      '<span class="count" id="f-count">' + st.scenes.length + ' 个场景</span></div>' +
      '<div class="scenes" id="scene-list">' + list + '</div>' +
      '<div class="pager">' +
      (prev ? '<a href="#/stage/' + prev.id + '" class="prev"><span class="dir">← 上一环节</span><span class="nm">' + pad(prev.idx) + ' ' + esc(prev.name) + '</span></a>' : '') +
      (next ? '<a href="#/stage/' + next.id + '" class="next"><span class="dir">下一环节 →</span><span class="nm">' + pad(next.idx) + ' ' + esc(next.name) + '</span></a>' : '') +
      '</div></main>';
  }

  function bindFilters(root) {
    var listEl = root.querySelector('#scene-list');
    if (!listEl) return;
    var st = { m: '', d: '' };
    var chips = root.querySelectorAll('.filters .chip');
    [].forEach.call(chips, function (c) {
      if (c.classList.contains('on')) st[c.dataset.f] = c.dataset.v;
    });

    function apply() {
      var n = 0;
      [].forEach.call(listEl.children, function (row) {
        var ms = (row.dataset.m || '').split(' ');
        var okM = !st.m || ms.indexOf(st.m) >= 0;
        var okD = !st.d || row.dataset.d === st.d;
        var show = okM && okD;
        row.style.display = show ? '' : 'none';
        if (show) n++;
      });
      var cnt = root.querySelector('#f-count');
      if (cnt) cnt.textContent = n + ' 个场景';
      if (!n) {
        if (!listEl.querySelector('.filter-empty')) {
          var d = document.createElement('div');
          d.className = 'empty filter-empty';
          d.innerHTML = '<b>没有符合条件的场景</b>换个筛选条件试试。';
          listEl.appendChild(d);
        }
      } else {
        var e = listEl.querySelector('.filter-empty');
        if (e) e.remove();
      }
    }

    [].forEach.call(chips, function (c) {
      c.addEventListener('click', function () {
        var f = c.dataset.f;
        st[f] = c.dataset.v;
        [].forEach.call(chips, function (x) {
          if (x.dataset.f === f) x.classList.toggle('on', x === c);
        });
        apply();
        var hash = '#/stage/' + parseHash().parts[1] + (st.m ? '?m=' + st.m + (st.d ? '&d=' + st.d : '') : (st.d ? '?d=' + st.d : ''));
        setHashQuiet(hash);
      });
    });
    apply();
  }

  /* =========================================================
     六、方法反查页
     ========================================================= */
  function methodHTML(key) {
    if (!M[key]) return '<main class="wrap"><div class="empty"><b>没有这个方法类别</b></div></main>';
    var all = A.index.byMethod[key] || [];
    var hitStages = A.stages.filter(function (st) {
      return st.scenes.some(function (s) { return s.methods.indexOf(key) >= 0; });
    });
    var groups = hitStages.map(function (st) {
      var rows = st.scenes.filter(function (s) { return s.methods.indexOf(key) >= 0; }).map(function (sc) {
        var c = Cases.byScene(sc.id);
        return '<a class="mrow" href="#/scene/' + sc.id + '">' +
          '<div><div class="nm">' + esc(sc.name) + (c ? '<span class="badge-ready">案例</span>' : '') + '</div>' +
          '<div class="pt">' + esc(sc.point) + '</div></div>' +
          '<div class="rt"><span class="dtag" data-d="' + sc.diff + '">' + sc.diff + '</span><span class="mono" style="font-size:10px;color:var(--ink-4)">→</span></div></a>';
      }).join('');
      return '<div class="method-group"><div class="mg-head">' +
        '<span class="idx">' + pad(st.idx) + '</span><h3>' + esc(st.name) + '</h3>' +
        '<span class="cnt">' + st.scenes.filter(function (s) { return s.methods.indexOf(key) >= 0; }).length + ' 个</span></div>' +
        '<div class="mg-list">' + rows + '</div></div>';
    }).join('');

    return '<main class="wrap">' +
      crumb([['#/', '总览'], ['#/method/' + key, M[key].name]]) +
      '<div class="page-head"><div class="ph-top"><div>' +
      '<div class="ph-idx">METHOD · ' + M[key].abbr + '</div>' +
      '<h1>' + esc(M[key].name) + '在石油勘探开发中的可应用场景<span class="en">' + esc(M[key].signal) + '</span></h1>' +
      '<p class="blurb">' + esc(M[key].desc) + '</p></div>' +
      '<div class="ph-stat"><div><div class="n">' + all.length + '</div><div class="l">场景</div></div>' +
      '<div><div class="n">' + hitStages.length + '</div><div class="l">跨环节</div></div></div>' +
      '</div></div>' +
      '<div style="padding:6px 0 10px">' + groups + '</div>' +
      '<div class="pager"><a href="#/" class="prev"><span class="dir">← 返回</span><span class="nm">总览</span></a></div></main>';
  }

  /* =========================================================
     七、场景详情页（案例自动挂载）
     ========================================================= */
  function sceneHTML(sc, q) {
    var st = A.index.byStage[sc.stageId];
    var allCases = Cases.bySceneAll(sc.id);
    /* 当前展示哪个案例：?case= 指定，默认第一个 */
    var c = allCases.filter(function (x) { return x.id === q.case; })[0] || allCases[0] || null;

    var caseSwitch = '';
    if (allCases.length > 1) {
      caseSwitch = '<div class="case-switch"><span class="cs-lbl">本场景共有 ' + allCases.length +
        ' 个案例，当前展示</span>' + allCases.map(function (x) {
          var on = c && x.id === c.id;
          return '<button class="chip' + (on ? ' on' : '') + '" data-case="' + esc(x.id) + '">' +
            esc(x.title || x.id) + '</button>';
        }).join('') + '</div>';
    }

    var tabs = [];
    if (c) {
      if (c.tabs.background) tabs.push({ key: 'bg', num: '01', name: c.tabs.background.label || '专业背景' });
      if (c.tabs.workflow) tabs.push({ key: 'flow', num: '02', name: c.tabs.workflow.label || '案例流程' });
      if (c.tabs.demo) tabs.push({ key: 'demo', num: '03', name: c.tabs.demo.label || '可运行示范' });
    }

    var tabBtns = tabs.map(function (t, i) {
      return '<button class="tab' + (i === 0 ? ' on' : '') + '" data-tab="' + t.key + '">' +
        '<span class="num">' + t.num + '</span>' + esc(t.name) + '</button>';
    }).join('');

    var panels = '';
    if (c) {
      if (c.tabs.background) panels += '<div class="panel on" data-panel="bg">' + renderBackground(sc, c) + '</div>';
      if (c.tabs.workflow) panels += '<div class="panel" data-panel="flow">' + renderWorkflow(sc, c) + '</div>';
      if (c.tabs.demo) panels += '<div class="panel" data-panel="demo">' + renderDemoShell(sc, c) + '</div>';
    }

    var cBadge = allCases.length
      ? '<span class="badge-ready">案例 ' + esc(c.id) + ' · v' + esc(c.version || '—') + '</span>' +
        (allCases.length > 1 ? '<span class="tag">共 ' + allCases.length + ' 个案例</span>' : '')
      : '<span class="badge-wip">未接入案例</span>';

    var head = '<div class="detail-head">' +
      '<div class="dh-kicker">' +
      '<a class="tag" href="#/stage/' + st.id + '">环节 ' + pad(st.idx) + ' · ' + esc(st.name) + '</a>' +
      sc.methods.map(function (k) {
        var ck = (M[k] && (M[k].colorKey || k)) || 'cv';
        return '<span class="mtag" data-m="' + ck + '"><b>' + M[k].abbr + '</b>' + esc(M[k].name) + '</span>';
      }).join('') +
      cBadge +
      '</div>' +
      '<h1 class="dh-title">' + esc(sc.name) + '</h1>' +
      '<p class="dh-sub">' + esc(sc.intro) + '</p>' +
      '<div class="dh-tags">' + K.dtag(sc.diff) +
      (sc.status === 'ext' ? '<span class="badge-wip">待扩展</span>' : '') +
      '<span class="tag"><span class="dot" style="color:var(--ink-4)"></span>' + esc(sc.id.toUpperCase()) + '</span>' +
      '</div></div>';

    var body = c
      ? caseSwitch + '<div class="tabs" id="tabs">' + tabBtns + '</div>' + panels
      : pendingHTML(sc);

    return '<main class="wrap">' +
      crumb([['#/', '总览'], ['#/chain', '作业链'], ['#/stage/' + st.id, st.name], ['#/scene/' + sc.id, sc.name]]) +
      head + body + relatedHTML(sc) + '</main>';
  }

  /* ---- 有案例：三块内容由案例提供，这里只套版式 ---- */
  function renderBackground(sc, c) {
    var b = c.tabs.background;
    var out = '';
    if (b.judge) out += K.judge(b.judge);
    var concept = {
      m1: ['岩屑样品', '标准化拍摄', '颗粒识别', '岩性统计', '地质复核'],
      m2: ['气测/组分曲线', '迟到时间校正', '异常段筛查', '工况关联', '综合复核'],
      m3: ['岩屑荧光样品', '紫外成像', '颜色与亮度特征', '显示分级建议', '解释员复核'],
      m4: ['钻时/井深序列', '工况与数据清洗', '变化点检测', '层界候选', '多资料核验'],
      m5: ['结构化录井记录', '字段与单位校验', '模板映射', '报告草稿', '工程师签发']
    }[sc.id];
    if (concept) out += '<section class="concept-map" aria-label="专业概念流程图"><div class="concept-head"><div><span class="kicker plain">CONCEPT MAP</span><h3>专业概念与智能化链路</h3></div><span class="concept-note">AI 生成候选 · 专业人员复核</span></div><div class="concept-flow">' + concept.map(function (label, i) { return '<div class="concept-node ' + (i === 2 || i === 3 ? 'focus' : '') + '"><span>' + (i < 2 ? 'INPUT' : i < 4 ? 'AI / RULE' : 'REVIEW') + ' · 0' + (i + 1) + '</span><b>' + esc(label) + '</b></div>' + (i < concept.length - 1 ? '<i class="concept-arrow" aria-hidden="true">→</i>' : ''); }).join('') + '</div><p class="concept-caption">沿着样品/工程数据进入、算法辅助分析、形成业务候选并由专业人员确认的路径阅读本案例。</p></section>';
    if (b.lede) out += '<div class="lede-block"><span class="kicker plain">专业场景介绍</span><p>' + rich(b.lede) + '</p></div>';
    (b.sections || []).forEach(function (s, i) {
      out += K.sec4(i + 1, s.en || '', s.title, s.html || s.body || '');
    });
    return out;
  }

  function renderWorkflow(sc, c) {
    var w = c.tabs.workflow;
    var out = '<div class="case-lead"><div>' +
      '<span class="kicker clay">CASE WALKTHROUGH</span>' +
      '<h3 style="margin-top:10px">' + esc(w.title || '案例流程') + '</h3>' +
      (w.lead || []).map(function (p) { return '<p>' + rich(p) + '</p>'; }).join('') +
      '</div>' + (w.stats ? K.cells(w.stats) : '') + '</div>';

    out += K.pipeline(w.steps || []);

    if (w.metrics) {
      out += K.sec4(0, 'METRICS', w.metrics.title || '怎么算"做对了"', w.metrics.html || '');
    }
    if (w.fails) {
      out += '<div class="sec4"><div class="sn">FAIL<span>MODES</span></div><div class="sec4-body">' +
        '<h3>这类任务通常死在哪</h3>' +
        '<p>下面这些失败模式在同类项目里反复出现。它们多半不是模型能力问题，而是任务定义与数据规范问题。</p>' +
        K.fails(w.fails) + '</div></div>';
    }
    return out;
  }

  /* ---- 无案例：展示速览 + 接入引导 ---- */

      '<div class="sec4"><div class="sn">02<span>INTERVENTION</span></div><div class="sec4-body">' +
      '<h3>AI 介入点</h3><p>' + esc(sc.point) + '</p></div></div>' +

  /* ---- tab 交互与示范挂载 ---- */
  function bindTabs(sc, c) {
    var tabsEl = document.getElementById('tabs');
    if (!tabsEl) return;

    function activate(key, scroll) {
      [].forEach.call(tabsEl.children, function (b) {
        b.classList.toggle('on', b.dataset.tab === key);
      });
      [].forEach.call(document.querySelectorAll('.panel'), function (p) {
        p.classList.toggle('on', p.dataset.panel === key);
      });
      if (key === 'demo') mountDemo(sc, c);
      if (scroll) {
        var y = tabsEl.getBoundingClientRect().top + window.scrollY - 62;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    }

    tabsEl.addEventListener('click', function (e) {
      var b = e.target.closest('.tab');
      if (!b) return;
      activate(b.dataset.tab, true);
      setHashQuiet('#/scene/' + sc.id + '?tab=' + b.dataset.tab);
    });

    var want = { 1: 'bg', 2: 'flow', 3: 'demo' }[parseHash().q.tab] || parseHash().q.tab;
    if (want && tabsEl.querySelector('[data-tab="' + want + '"]')) activate(want, false);

    bindChecklist();
  }

  function mountDemo(sc, c) {
    var d = c.tabs.demo;
    if (!d || typeof d.mount !== 'function') return;
    var key = c.id;
    if (mountedKey === key) return;
    var root = document.getElementById('case-demo-root');
    if (!root) return;
    if (mounted && mounted.unmount) { try { mounted.unmount(); } catch (e) { } }
    root.innerHTML = '';
    mounted = d;
    mountedKey = key;
    try {
      d.mount(root, { scene: sc, kase: c, K: K, atlas: A });
    } catch (err) {
      root.innerHTML = '<div class="callout warn"><span class="ci">错误</span><span>示范挂载失败：' +
        esc(err.message) + '。检查 <b>' + esc(c.id) + '</b> 的 tabs.demo.mount。</span></div>';
      console.error('[case:' + c.id + '] demo mount failed', err);
    }
  }

  function bindChecklist() {
    var items = document.querySelectorAll('.cl-item');
    if (!items.length) return;
    var total = items.length;
    var fill = document.getElementById('cl-fill');
    var txt = document.getElementById('cl-txt');

    function sync() {
      var n = document.querySelectorAll('.cl-item.done').length;
      if (fill) fill.style.width = (n / total * 100) + '%';
      if (txt) txt.textContent = n + ' / ' + total;
    }
    [].forEach.call(items, function (it) {
      it.addEventListener('click', function () {
        it.classList.toggle('done');
        sync();
      });
    });
    sync();
  }
